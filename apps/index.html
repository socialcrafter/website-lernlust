<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernapps — Lernlust</title>
<style>
:root{--bg:#ffffff;--surface:#fef6e4;--black:#000;--primary:#e67e22;--accent:#7209b7;
--border:4px solid var(--black);--shadow:8px 8px 0 var(--black)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Source Sans 3','Source Sans Pro',sans-serif;background:var(--bg);color:var(--black);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 64px}
h1{font-family:"Arial Black",Arial,sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;font-size:clamp(1.8rem,6vw,2.6rem);margin-bottom:4px}
.sub{font-size:15px;color:#555;font-weight:600;margin-bottom:24px}
.tag{display:inline-block;background:var(--black);color:var(--surface);padding:4px 12px;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:2px;margin-bottom:12px}
.card{background:var(--bg);border:var(--border);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:20px;display:block;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(4px,4px);box-shadow:4px 4px 0 var(--black)}
.card h2{font-family:"Arial Black",Arial,sans-serif;font-size:19px;text-transform:uppercase;margin-bottom:4px}
.card .meta{font-family:"Courier New",monospace;font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.card p{font-size:14px;color:#555}
.card .status{display:inline-block;margin-top:8px;font-family:"Courier New",monospace;font-size:11px;font-weight:700;padding:2px 8px;border:2px solid var(--black)}
.status.beta{background:#ffe8cc}.status.live{background:#d9f2de}
.back{display:inline-block;margin-top:24px;font-weight:900;color:var(--black)}
</style>
</head>
<body>
<div class="wrap">
<div class="tag">Lernlust · Apps</div>
<h1>Lernapps</h1>
<p class="sub">Aktuelle interaktive Lernapps. Ältere Versionen liegen im Archiv.</p>
<div id="list"></div>
<a class="back" href="../index.html">← Zurück zu lernlust.ch</a>
</div>
<script>
// Registry: Neue App? → Datei nach apps/ legen und hier einen Eintrag ergänzen.
const APPS=[
{file:'kurden-teil1-2.html',titel:'Geschichte der Kurden — Teil 1+2',meta:'Geschichte · Sek II',
 desc:'Mittelalter bis Lausanne 1923: Islamisierung, Saladin, Osmanen und Safawiden. Mit Quiz, Kurmanji-Glossar, Elternaufgaben und Methodik-Seite.',status:'beta'},
{file:'kurden-teil3.html',titel:'Geschichte der Kurden — Teil 3',meta:'Geschichte · Sek II',
 desc:'Das 20. Jahrhundert: Türkei, Irak, Iran, Syrien und die Gesellschaft der Stämme. 5 Module, 32 Abschnitte, mit Reflexionen und Elternaufgaben.',status:'beta'}
];
document.getElementById('list').innerHTML=APPS.map(a=>`<a class="card" href="${a.file}"><div class="meta">${a.meta}</div><h2>${a.titel}</h2><p>${a.desc}</p><span class="status ${a.status}">${a.status==='beta'?'Beta':'Live'}</span></a>`).join('');
</script>
</body>
</html>
