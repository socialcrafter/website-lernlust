<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wetter Basel · MeteoSwiss Open Data</title>
<style>
:root {
  --bg:#f0f4f8; --card:#ffffff; --ink:#1a2332; --muted:#6b7c93;
  --blue:#3b82f6; --blue-soft:#dbeafe; --green:#10b981; --green-soft:#d1fae5;
  --orange:#f59e0b; --orange-soft:#fef3c7; --red:#ef4444; --red-soft:#fee2e2;
  --purple:#8b5cf6; --purple-soft:#ede9fe;
  --shadow:0 4px 24px rgba(0,0,0,0.08); --radius:20px; --radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 60px}
.wrap{max-width:520px;margin:0 auto;padding:16px}
header{padding:32px 0 8px;text-align:center}
.kicker{letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--blue);font-weight:700}
h1{font-size:clamp(24px,5vw,32px);margin:.2em 0 .15em;font-weight:700}
.subtitle{font-size:14px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:16px}
.temp-big{font-size:72px;font-weight:700;line-height:1;margin:8px 0 4px}
.temp-big .unit{font-size:28px;font-weight:400;color:var(--muted);vertical-align:top;margin-left:2px}
.temp-range{font-size:14px;color:var(--muted);margin-bottom:16px}
.condition{font-size:18px;font-weight:600;color:var(--blue);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric{background:var(--bg);border-radius:var(--radius-sm);padding:14px 16px}
.metric-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.metric-value{font-size:22px;font-weight:700;margin:2px 0 0}
.metric-unit{font-size:13px;color:var(--muted);font-weight:400}
.metric.blue .metric-value{color:var(--blue)}
.metric.green .metric-value{color:var(--green)}
.metric.orange .metric-value{color:var(--orange)}
.metric.purple .metric-value{color:var(--purple)}
.metric.red .metric-value{color:var(--red)}
.chart-wrap{position:relative;height:180px;margin:12px 0}
canvas{width:100%!important;height:100%!important}
.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--muted)}
.chart-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend-temp::before{background:var(--blue)}
.legend-rain::before{background:var(--green)}
.legend-wind::before{background:var(--orange)}
.timestamp{text-align:center;font-size:12px;color:var(--muted);margin:12px 0 0}
.source{text-align:center;font-size:11px;color:var(--muted);margin-top:20px}
.source a{color:var(--blue);text-decoration:none}
.back{display:inline-block;padding:8px 16px;background:var(--blue);color:white;border-radius:var(--radius-sm);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:16px}
.back:hover{background:#2563eb}
@media(max-width:400px){.grid{grid-template-columns:1fr}.temp-big{font-size:56px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">MeteoSwiss Open Data</div>
    <h1>Wetter Basel</h1>
    <p class="subtitle">Station Basel / Binningen</p>
  </header>

  <a href="../index.html" class="back">← Zurück zu Lernlust</a>

  <div class="card">
    <div class="condition" id="condition"></div>
    <div class="temp-big" id="tempBig"></div>
    <div class="temp-range" id="tempRange"></div>
    <div class="grid" id="metricsGrid"></div>
    <p class="timestamp" id="timestamp"></p>
  </div>

  <div class="card">
    <h3 style="font-size:15px;margin-bottom:8px;color:var(--muted)">Letzte Stunden</h3>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="chart-legend">
      <span class="legend-temp">Temp °C</span>
      <span class="legend-rain">Regen mm</span>
      <span class="legend-wind">Wind km/h</span>
    </div>
  </div>

  <p class="source">Daten: <a href="https://www.meteoswiss.admin.ch" target="_blank">MeteoSwiss Open Data</a> · Aktualisiert: 2026-06-17 07:57</p>
</div>

<script>
const S = {"info": {"id": "bas", "name": "Basel / Binningen (BAS)", "lat": 47.5411, "lon": 7.5835}, "current": {"timestamp": "17.06.2026 05:00", "params": {"tre200h0": {"value": 17.2, "name": "Temperatur", "unit": "°C"}, "tre200hn": {"value": 17.0, "name": "Temperatur min", "unit": "°C"}, "tre200hx": {"value": 17.5, "name": "Temperatur max", "unit": "°C"}, "ure200h0": {"value": 72.0, "name": "Luftfeuchtigkeit", "unit": "%"}, "pp0qffh0": {"value": 1019.9, "name": "Luftdruck (gemessen)", "unit": "hPa"}, "pp0qnhh0": {"value": 1020.6, "name": "Luftdruck (auf Meereshöhe)", "unit": "hPa"}, "fkl010h0": {"value": 1.2, "name": "Windgeschwindigkeit", "unit": "km/h"}, "fkl010h1": {"value": 3.7, "name": "Windböen", "unit": "km/h"}, "dkl010h0": {"value": 95.0, "name": "Windrichtung", "unit": "°"}, "rre150h0": {"value": 0.0, "name": "Niederschlag", "unit": "mm"}, "gre000h0": {"value": 74.0, "name": "Sonnenscheindauer", "unit": "min"}, "tde200h0": {"value": 12.0, "name": "Taupunkt", "unit": "°C"}, "pva200h0": {"value": 14.0, "name": "Dampfdruck", "unit": "hPa"}}, "history": [{"time": "17.06.2026 00:00", "temp": 20.4, "rain": 0.0, "wind": 1.2}, {"time": "17.06.2026 01:00", "temp": 19.2, "rain": 0.0, "wind": 1.2}, {"time": "17.06.2026 02:00", "temp": 18.1, "rain": 0.0, "wind": 0.8}, {"time": "17.06.2026 03:00", "temp": 17.4, "rain": 0.0, "wind": 1.0}, {"time": "17.06.2026 04:00", "temp": 16.8, "rain": 0.0, "wind": 1.0}, {"time": "17.06.2026 05:00", "temp": 17.2, "rain": 0.0, "wind": 1.2}]}};

function windDir(deg) {
  if (deg == null) return "–";
  const dirs = ["N","NNO","NO","ONO","O","OSO","SO","SSO","S","SSW","SW","WSW","W","WNW","NW","NNW"];
  return dirs[Math.round(deg / 22.5) % 16];
}

function conditionText(temp, rain, wind) {
  if (rain > 5) return "🌧️ Regen";
  if (rain > 0.5) return "🌦️ Leichter Regen";
  if (temp > 30) return "🔥 Heiss";
  if (temp > 25) return "☀️ Warm";
  if (temp > 15) return "🌤️ Angenehm";
  if (temp > 5) return "🌥️ Kühl";
  if (temp > 0) return "❄️ Kalt";
  return "🥶 Frost";
}

const p = S.current.params;
const temp = p.tre200h0?.value;
const tempMin = p.tre200hn?.value;
const tempMax = p.tre200hx?.value;
const humid = p.ure200h0?.value;
const wind = p.fkl010h0?.value;
const gusts = p.fkl010h1?.value;
const windDir_val = p.dkl010h0?.value;
const rain = p.rre150h0?.value;
const pressure = p.pp0qnhh0?.value;
const sun = p.gre000h0?.value;
const dew = p.tde200h0?.value;

document.getElementById("condition").textContent = conditionText(temp, rain || 0, wind || 0);
document.getElementById("tempBig").innerHTML = temp != null
  ? `${temp}<span class="unit">°C</span>`
  : '–<span class="unit">°C</span>';
document.getElementById("tempRange").textContent =
  (tempMin != null && tempMax != null) ? `Min ${tempMin}° · Max ${tempMax}°` : "";

const metrics = [
  { label: "Luftfeuchtigkeit", value: humid, unit: "%", color: "blue" },
  { label: "Wind", value: wind != null ? `${wind} ${windDir(windDir_val)}` : null, unit: gusts != null ? `Böen ${gusts} km/h` : "km/h", color: "green" },
  { label: "Niederschlag", value: rain, unit: "mm", color: "purple" },
  { label: "Luftdruck", value: pressure, unit: "hPa", color: "orange" },
  { label: "Taupunkt", value: dew, unit: "°C", color: "blue" },
  { label: "Sonne", value: sun != null ? Math.round(sun / 60 * 10) / 10 : null, unit: "h", color: "orange" },
];

document.getElementById("metricsGrid").innerHTML = metrics.map(m =>
  `<div class="metric ${m.color}">
    <div class="metric-label">${m.label}</div>
    <div class="metric-value">${m.value != null ? m.value : '–'} <span class="metric-unit">${m.unit}</span></div>
  </div>`
).join("");

document.getElementById("timestamp").textContent =
  S.current.timestamp ? `Messzeit: ${S.current.timestamp}` : "";

// Chart
const history = S.current.history;
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const dpr = window.devicePixelRatio || 1;
const rect = canvas.parentElement.getBoundingClientRect();
canvas.width = rect.width * dpr;
canvas.height = rect.height * dpr;
ctx.scale(dpr, dpr);
const W = rect.width, H = rect.height;

ctx.clearRect(0, 0, W, H);
if (history && history.length > 1) {
  const temps = history.map(h => h.temp).filter(v => v != null);
  const rains = history.map(h => h.rain).filter(v => v != null);
  const winds = history.map(h => h.wind).filter(v => v != null);

  if (temps.length > 1) {
    const minT = Math.min(...temps) - 2;
    const maxT = Math.max(...temps) + 2;
    const maxR = Math.max(...rains, 1);
    const maxW = Math.max(...winds, 1);
    const n = history.length;
    const pad = { l: 36, r: 8, t: 8, b: 24 };
    const cw = W - pad.l - pad.r;
    const ch = H - pad.t - pad.b;

    // Grid
    ctx.strokeStyle = "#e5e7eb";
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (ch / 4) * i;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
    }

    ctx.fillStyle = "#9ca3af";
    ctx.font = "10px sans-serif";
    ctx.textAlign = "right";
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + (ch / 4) * i;
      const val = maxT - ((maxT - minT) / 4) * i;
      ctx.fillText(val.toFixed(0) + "°", pad.l - 6, y + 3);
    }

    ctx.textAlign = "center";
    const step = Math.max(1, Math.floor(n / 6));
    for (let i = 0; i < n; i += step) {
      const x = pad.l + (cw / (n - 1)) * i;
      const t = history[i].time.split(" ")[1] || "";
      ctx.fillText(t, x, H - 4);
    }

    // Rain bars
    if (rains.some(v => v > 0)) {
      ctx.fillStyle = "rgba(16,185,129,0.3)";
      const barW = cw / n * 0.6;
      for (let i = 0; i < n; i++) {
        const v = history[i].rain;
        if (v == null || v === 0) continue;
        const x = pad.l + (cw / (n - 1)) * i - barW / 2;
        const h = (v / maxR) * ch * 0.4;
        ctx.fillRect(x, pad.t + ch - h, barW, h);
      }
    }

    // Lines
    function drawLine(data, maxVal, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = "round";
      ctx.beginPath();
      let started = false;
      for (let i = 0; i < n; i++) {
        const v = data[i];
        if (v == null) continue;
        const x = pad.l + (cw / (n - 1)) * i;
        const y = pad.t + ch - (v / maxVal) * ch;
        if (!started) { ctx.moveTo(x, y); started = true; }
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    drawLine(temps, maxT - minT, "#3b82f6");
    drawLine(winds, maxW, "#f59e0b");
  }
}
</script>
</body>
</html>
