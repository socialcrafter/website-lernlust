return `<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="go('modules')"><i class="fa-solid fa-arrow-left"></i> Module</button><div class="topbar-title">Modul ${S.mi+1}</div><div class="topbar-right">${S.si+1}/${total}</div></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="eyebrow">${mod.title}</div><h2 style="text-transform:none">${sec.title}</h2><div class="card"><div class="read-text">${sec.text}</div></div><button class="tts-btn" onclick="speakText()"><i class="fa-solid fa-volume-high"></i> Vorlesen</button><div class="glossary"><div class="glossary-label">Kurmanji / کوردی</div>${sec.glossary.map(g=>`<div class="glossary-row"><span class="kw">${g.kw}</span><span class="eq">=</span><span class="tr">${g.tr}</span></div>`).join('')}</div>${sec.wb?`<div class="glossary wb"><div class="glossary-label">Wörter erklärt</div>${sec.wb.map(x=>`<div class="glossary-row"><span class="kw">${x.w}</span><span class="eq">→</span><span class="ex">${x.e}</span></div>`).join('')}</div>`:''}<div class="chunk-nav">${mod.sections.map((_,i)=>`<div class="chunk-dot ${i===S.si?'on':''} ${i<S.si?'visited':''}" onclick="goSec(${i})"></div>`).join('')}</div><button class="btn btn-primary" onclick="startQuiz()"><i class="fa-solid fa-brain"></i> Zum Quiz (${sec.questions.length} Fragen)</button>${S.si>0?`<button class="btn btn-secondary" onclick="prevSec()"><i class="fa-solid fa-arrow-left"></i> Zurück</button>`:''}</div>`;}

function rQuiz(){
const mod=MODULES[S.mi];const sec=mod.sections[S.si];const q=sec.questions[S.qi];const total=sec.questions.length;const pct=((S.qi+1)/total)*100;const cc=S.results.filter(r=>r).length;
return `<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()"><i class="fa-solid fa-arrow-left"></i> Text</button><div class="topbar-title">Quiz</div><div class="topbar-right">${S.qi+1}/${total}</div></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div style="display:flex;align-items:center;justify-content:space-between"><div class="streak"><i class="fa-solid fa-fire" style="color:var(--color-primary)"></i> ${S.streak}</div><div style="font-family:var(--font-mono);font-size:12px;font-weight:700">${cc} von ${S.results.length} richtig</div></div><div class="card-surface"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><div class="eyebrow" style="margin:0">Frage ${S.qi+1}</div><div class="kurmanji-badge">${q.kurmanji}</div></div><div class="question-text">${q.q}</div><button class="tts-btn" onclick="speakQ()" style="margin-top:8px"><i class="fa-solid fa-volume-high"></i> Vorlesen</button><div class="ans-grid" id="ans-grid" style="margin-top:12px">${shuf([{t:q.correct,ok:true},...q.wrong.map(w=>({t:w,ok:false}))]).map(a=>`<button class="ans-btn" data-c="${a.ok}" onclick="ans(this,${a.ok})">${a.t}</button>`).join('')}</div><div class="feedback ok" id="fb-ok" style="margin-top:12px"><span style="font-size:18px">✓</span><span>Richtig! ${q.kurmanji}</span></div><div class="feedback ko" id="fb-ko" style="margin-top:12px"><span style="font-size:18px">→</span><span>Richtig: <strong>${q.correct}</strong></span></div><button class="btn btn-primary" id="nq-btn" style="display:none;margin-top:12px" onclick="nextQ()">Nächste Frage <i class="fa-solid fa-arrow-right"></i></button></div></div>`;}

const TASK_META={parent:{cls:'',icon:'🏠',label:'Elternaufgabe — zu Hause bearbeiten',title:'Elternaufgabe',ph:'Schreib hier auf, was du herausgefunden hast...'},reflect:{cls:'reflect',icon:'💭',label:'Reflexion — denk nach und notiere',title:'Reflexion',ph:'Schreib hier deine Gedanken auf...'},transfer:{cls:'transfer',icon:'🔍',label:'Forschungsauftrag',title:'Forschung',ph:'Notiere hier deine Ergebnisse...'}};

function rTask(){
const sec=MODULES[S.mi].sections[S.si];const t=sec.task;const meta=TASK_META[t.type]||TASK_META.parent;const key=`${S.mi}-${S.si}`;const saved=S.notesSaved[key]||'';
return `<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="S.screen='read';save();render()"><i class="fa-solid fa-arrow-left"></i> Zurück</button><div class="topbar-title">${meta.title}</div><div class="topbar-right"></div></div><div class="parent-task ${meta.cls}"><div class="pt-icon">${meta.icon}</div><div class="pt-label">${meta.label}</div><div class="pt-text">${t.text}</div></div><div class="parent-answer ${meta.cls}"><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:6px">Deine Antwort / Notizen:</div><textarea id="task-input" placeholder="${meta.ph}" oninput="saveNote()">${saved}</textarea></div><button class="btn btn-green" onclick="finishSec()"><i class="fa-solid fa-check"></i> Gespeichert — weiter</button><button class="btn btn-secondary" onclick="finishSec()"><i class="fa-solid fa-arrow-right"></i> Überspringen</button></div>`;}

function rResult(){
const mod=MODULES[S.mi];const sec=mod.sections[S.si];const total=sec.questions.length;const c=S.results.filter(r=>r).length;const pct=Math.round(c/total*100);const s=Math.min(3,Math.round(c/total*3));const isLast=S.si>=mod.sections.length-1;
return `<div class="screen active fade-in" style="justify-content:center;align-items:center;min-height:80vh"><div class="card" style="text-align:center;padding:36px 24px;max-width:420px"><div class="eyebrow">Abschnitt ${S.si+1}</div><h2 style="margin-bottom:16px;text-transform:none">${sec.title}</h2><div class="result-stars">${[1,2,3].map(i=>`<div class="star ${i<=s?'earned':''}">★</div>`).join('')}</div><div class="score-text">${c}/${total}</div><div class="score-label" style="margin-bottom:8px">${pct}% richtig</div><div style="font-family:var(--font-body);font-size:15px;color:#555;margin-bottom:20px">${c>=total-1?'Sehr gut!':c>=Math.ceil(total/2)?'Gut, weiter so!':'Übe nochmal, du schaffst es!'}</div>${!isLast?`<button class="btn btn-primary" onclick="nextSec()">Nächster Abschnitt <i class="fa-solid fa-arrow-right"></i></button>`:`<button class="btn btn-green" onclick="finishMod()">Modul abschliessen <i class="fa-solid fa-trophy"></i></button>`}<button class="btn btn-secondary" onclick="retrySec()" style="margin-top:4px"><i class="fa-solid fa-rotate-left"></i> Nochmal</button><button class="btn btn-secondary" onclick="go('modules')" style="margin-top:4px"><i class="fa-solid fa-th-large"></i> Übersicht</button></div></div>`;}

function rAllDone(){
let totalC=0,totalQ=0;Object.values(S.visited).forEach(v=>{if(v&&v.done){totalC+=v.correct;totalQ+=v.questions}});const pct=totalQ?Math.round(totalC/totalQ*100):0;
return `<div class="screen active fade-in" style="justify-content:center;align-items:center;min-height:80vh"><div class="card" style="text-align:center;padding:36px 24px;max-width:420px"><div style="font-size:48px;margin-bottom:12px">🏆</div><h2>Alle Module geschafft!</h2><div class="score-text">${totalC}/${totalQ}</div><div class="score-label">${pct}% richtig insgesamt</div><p style="color:#555;margin:12px 0 20px;line-height:1.6;font-family:var(--font-body)">Du hast alle ${MODULES.length} Module von Teil 3 durchgearbeitet.</p><button class="btn btn-primary" onclick="resetAll()"><i class="fa-solid fa-rotate-left"></i> Von vorne</button><button class="btn btn-secondary" style="margin-top:4px" onclick="go('modules')"><i class="fa-solid fa-th-large"></i> Module</button></div></div>`;}

function rFulltext(){
let html=`<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="go('start')"><i class="fa-solid fa-arrow-left"></i> Start</button><div class="topbar-title">Gesamttext</div><div class="topbar-right"></div></div><h1 style="font-size:24px">Die Kurden im 20. Jahrhundert</h1><p style="color:#555;font-size:15px;margin-bottom:16px;font-weight:600">Der vollständige Text aller ${MODULES.length} Module zum Durchlesen. ${MODULES.reduce((a,m)=>a+m.sections.length,0)} Abschnitte.</p>`;
MODULES.forEach((mod,mi)=>{const cls=mi===0?'':'mod-'+Math.min(mi+1,3);
html+=`<div class="fulltext-mod ${cls}"><h2 style="font-size:18px;margin-bottom:12px">Modul ${mi+1}: ${mod.title}</h2>`;
mod.sections.forEach((sec,si)=>{html+=`<div style="margin-bottom:24px${si<mod.sections.length-1?';padding-bottom:24px;border-bottom:2px dashed #ddd':''}"><h3 style="font-size:15px;margin-bottom:8px;text-transform:none;letter-spacing:0">${sec.title}</h3><div class="read-text" style="font-size:17px;margin-bottom:8px">${sec.text}</div><button class="tts-btn" onclick="speakFullSec(${mi},${si})"><i class="fa-solid fa-volume-high"></i> Vorlesen</button><div class="glossary" style="margin-top:8px"><div class="glossary-label">Kurmanji</div>${sec.glossary.map(g=>`<div class="glossary-row"><span class="kw">${g.kw}</span><span class="eq">=</span><span class="tr">${g.tr}</span></div>`).join('')}</div>${sec.wb?`<div class="glossary wb" style="margin-top:8px"><div class="glossary-label">Wörter erklärt</div>${sec.wb.map(x=>`<div class="glossary-row"><span class="kw">${x.w}</span><span class="eq">→</span><span class="ex">${x.e}</span></div>`).join('')}</div>`:''}</div>`;});
html+=`</div>`;});
html+=`<button class="btn btn-primary" onclick="go('modules')"><i class="fa-solid fa-brain"></i> Zu den Modulen &amp; Quiz</button><button class="btn btn-secondary" onclick="go('start')" style="margin-top:4px"><i class="fa-solid fa-arrow-left"></i> Zurück zum Start</button></div>`;
return html;}

function rMethodik(){
const totalSec=MODULES.reduce((a,m)=>a+m.sections.length,0);
return `<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="go('start')"><i class="fa-solid fa-arrow-left"></i> Start</button><div class="topbar-title">Methodik &amp; Didaktik</div><div class="topbar-right"></div></div>
<h2 style="text-transform:none;font-size:1.3rem">1. Biographisches Lernen / Identitätslernen</h2>
<p><strong>Beobachtung (aus Teil 1/2):</strong> Der Schüler entdeckte im Glossar den Begriff <em>Zerdeştî</em> — und erkannte ihn als den Spitznamen, den seine Grossmutter ihm gegeben hatte. Dieser Überraschungsmoment erzeugte echte Neugier: <em>Bin ich nach einer alten Religion benannt?</em></p>
<p><strong>Methodisches Prinzip:</strong> Wenn Lernende sich selbst in historischen Inhalten wiederfinden, entsteht intrinsische Motivation ohne Belohnungssystem. Der Inhalt wird nicht mehr «gelernt», sondern «erlebt».</p>
<p><strong>Anknüpfungspunkte in Teil 3:</strong> Badinan und Sulaimaniya/Surdash (Herkunftsregion der Familie), der Familienname <em>Koçer</em> (Modul «Stamm, Familie und Gesellschaft»), Barzani und die Peschmerga.</p>

<h2 style="text-transform:none;font-size:1.3rem">2. Sprachliche Brücken als kognitive Anker</h2>
<p><strong>Beobachtung:</strong> Der Name <em>Koçer</em> ist der zweite Familienname des Schülers. Im Text bedeutet es «Nomade». Das löste eine Kette von Fragen aus: <em>Warum heisst meine Familie so?</em></p>
<p><strong>Methodisches Prinzip:</strong> Das Kurmanji-Glossar fungiert nicht als Übersetzungshilfe, sondern als <strong>Identitätsresonanz</strong>. Ein Wort in der Muttersprache aktiviert Vorwissen, das im Schulunterricht sonst unsichtbar bleibt.</p>

<h2 style="text-transform:none;font-size:1.3rem">3. Transfer: Elternaufgabe, Reflexion — oder bewusst nichts</h2>
<p><strong>Neu in Teil 3:</strong> Nicht jeder Abschnitt endet mit einer Elternaufgabe. Drei Varianten wechseln sich ab:</p>
<p><strong>🏠 Elternaufgabe</strong> — echte Forschungsaufträge an die Familie (Oral History), gezielt dort eingesetzt, wo Familienwissen wirklich etwas beitragen kann (Barzani, Badinan, Stammesnamen, Migration).</p>
<p><strong>💭 Reflexion</strong> — eigenständiges Nachdenken und Schreiben, besonders bei moralisch komplexen Inhalten (Krieg, Verrat, Identität, gebrochene Versprechen). Hier soll der SuS eine eigene Haltung entwickeln, bevor er andere fragt.</p>
<p><strong>Kein Auftrag</strong> — bewusste Entlastung. Die Eltern-Ressource wird nicht überstrapaziert, und reine Wissensabschnitte dürfen einfach abgeschlossen werden.</p>
<p><strong>Didaktische Begründung:</strong> Bei sensiblen Themen (Anfal, Halabdscha) ist die Elternaufgabe explizit als Angebot formuliert — mit dem Hinweis, dass Nicht-darüber-sprechen-wollen in Ordnung ist. Traumasensibilität geht vor Vollständigkeit.</p>

<h2 style="text-transform:none;font-size:1.3rem">4. Das 3-Phasen-Modell der App</h2>
<div style="border:var(--border-medium);padding:16px 20px;background:var(--color-surface);margin:12px 0;font-family:var(--font-mono);font-size:13px;line-height:2">
<div style="color:var(--color-primary);font-weight:700">LESEN (Originaltext)</div>
<div style="padding-left:16px;color:#555">↓ TTS-Unterstützung, Glossar, keine Zeitlimits</div>
<div style="color:var(--color-primary);font-weight:700;margin-top:4px">VERSTEHEN (2 Quiz-Fragen pro Abschnitt)</div>
<div style="padding-left:16px;color:#555">↓ sofortiges fehlerfreundliches Feedback, keine Strafe</div>
<div style="color:var(--color-primary);font-weight:700;margin-top:4px">TRANSFER (Elternaufgabe / Reflexion / frei)</div>
<div style="padding-left:16px;color:#555">↓ Verbindung Schulwissen ↔ Familienwissen ↔ eigene Haltung</div>
</div>
<p>Jede Phase ist optional ablösbar: Gesamttext-Modus für reines Lesen, Modul-Modus für strukturiertes Lernen. ${totalSec} Abschnitte à 5–7 Minuten — kein Druck, alles auf einmal zu schaffen.</p>

<h2 style="text-transform:none;font-size:1.3rem">5. Lernmethodische Besonderheiten</h2>
<div style="border:var(--border-thick);overflow:hidden">
<div style="display:grid;grid-template-columns:1fr 2fr;border-bottom:var(--border-medium)">
<div style="padding:10px 14px;font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;background:var(--color-black);color:#fff;border-right:var(--border-medium)">Prinzip</div>
<div style="padding:10px 14px;font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;background:var(--color-black);color:#fff">Umsetzung in der App</div>
</div>
<div style="display:grid;grid-template-columns:1fr 2fr;border-bottom:var(--border-thin)">
<div style="padding:10px 14px;font-weight:700;font-size:14px;border-right:var(--border-thin)">Fehlerfreundlichkeit</div>
<div style="padding:10px 14px;font-size:14px;color:#555">Falschantwort zeigt sofort die richtige — kein Zurückwurf</div>
</div>
<div style="display:grid;grid-template-columns:1fr 2fr;border-bottom:var(--border-thin)">
<div style="padding:10px 14px;font-weight:700;font-size:14px;border-right:var(--border-thin)">Chunking</div>
<div style="padding:10px 14px;font-size:14px;color:#555">${totalSec} Abschnitte à 5–7 Min, kein Druck alles auf einmal</div>
</div>
<div style="display:grid;grid-template-columns:1fr 2fr;border-bottom:var(--border-thin)">
<div style="padding:10px 14px;font-weight:700;font-size:14px;border-right:var(--border-thin)">Multimodalität</div>
<div style="padding:10px 14px;font-size:14px;color:#555">Lesen + TTS + Antworten auswählen + schriftlicher Transfer</div>
</div>
<div style="display:grid;grid-template-columns:1fr 2fr;border-bottom:var(--border-thin)">
<div style="padding:10px 14px;font-weight:700;font-size:14px;border-right:var(--border-thin)">Abwechslung im Transfer</div>
<div style="padding:10px 14px;font-size:14px;color:#555">Elternaufgabe, Reflexion oder bewusst kein Auftrag — keine Routine-Ermüdung</div>
</div>
<div style="display:grid;grid-template-columns:1fr 2fr;border-bottom:var(--border-thin)">
<div style="padding:10px 14px;font-weight:700;font-size:14px;border-right:var(--border-thin)">Respekt vor dem SuS</div>
<div style="padding:10px 14px;font-size:14px;color:#555">Anspruchsvolle Inhalte statt Vereinfachung, Fachbegriffe erklärt</div>
</div>
<div style="display:grid;grid-template-columns:1fr 2fr;border-bottom:var(--border-thin)">
<div style="padding:10px 14px;font-weight:700;font-size:14px;border-right:var(--border-thin)">Traumasensibilität</div>
<div style="padding:10px 14px;font-size:14px;color:#555">Sensible Themen (Anfal) als Angebot, nie als Pflicht formuliert</div>
</div>
<div style="display:grid;grid-template-columns:1fr 2fr">
<div style="padding:10px 14px;font-weight:700;font-size:14px;border-right:var(--border-thin)">Kulturelle Anschlussfähigkeit</div>
<div style="padding:10px 14px;font-size:14px;color:#555">Glossar in Herkunftssprache, Inhalt direkt relevant (Badinan, Koçer)</div>
</div>
</div>

<h2 style="text-transform:none;font-size:1.3rem;margin-top:24px">6. Mehrperspektivität als Leitprinzip von Teil 3</h2>
<p>Teil 3 behandelt Gegenwartsgeschichte mit offenen Wunden: PKK, Anfal, Bürgerkriege. Die App folgt drei Regeln:</p>
<p><strong>Beide Erzählungen zeigen:</strong> «Kampf gegen Terroristen» und «Befreiungskampf» werden als konkurrierende Deutungen benannt, nicht entschieden (Modul 2).</p>
<p><strong>Komplexität statt Helden:</strong> Das Fallbeispiel Sisin zeigt Menschen, die pragmatisch zwischen den Fronten überleben — gegen jede Schwarz-Weiss-Zeichnung.</p>
<p><strong>Innerkurdische Konflikte nicht verschweigen:</strong> Hormek gegen Cibran, PUK gegen DPK, Dschahsch — die Geschichte wird nicht zur Einheits-Legende geglättet.</p>

<h2 style="text-transform:none;font-size:1.3rem">Fazit</h2>
<p>Die wichtigste Erkenntnis aus der Praxis: <strong>Der SuS ist kein leeres Gefäss.</strong></p>
<p>Er bringt eine Geschichte mit, die im Klassenzimmer unsichtbar ist — aber im Text plötzlich auftaucht: Badinan, Surdash, Koçer, die Peschmerga.</p>
<p>Die App ist dann am wirksamsten, wenn sie diese Geschichte sichtbar macht — durch Sprache, durch Fragen an die Familie, durch eigenes Nachdenken.</p>
<button class="btn btn-primary" onclick="go('modules')" style="margin-top:16px"><i class="fa-solid fa-book-open"></i> Zur Lernapp</button>
<button class="btn btn-secondary" onclick="go('start')" style="margin-top:4px"><i class="fa-solid fa-arrow-left"></i> Zurück zum Start</button>
</div>`;}

function go(s){S.screen=s;S.answered=false;save();render()}
function startMod(i){S.mi=i;S.si=0;S.screen='read';save();render()}
function nextSec(){S.si++;S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function prevSec(){S.si=Math.max(0,S.si-1);S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function goSec(i){S.si=i;S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function startQuiz(){S.qi=0;S.streak=0;S.results=[];S.answered=false;S.screen='quiz';save();render()}
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function ans(btn,ok){
if(S.answered)return;S.answered=true;
const btns=document.querySelectorAll('#ans-grid .ans-btn');btns.forEach(b=>b.disabled=true);
if(ok){btn.classList.add('correct');S.streak++;S.results.push(true);document.getElementById('fb-ok').classList.add('show');speak('Richtig!')}
else{btn.classList.add('wrong');S.streak=0;S.results.push(false);btns.forEach(b=>{if(b.dataset.c==='true')b.classList.add('revealed')});document.getElementById('fb-ko').classList.add('show');speak('Leider falsch.');}
document.getElementById('nq-btn').style.display='flex';save();}

function nextQ(){
const sec=MODULES[S.mi].sections[S.si];S.qi++;S.answered=false;
if(S.qi>=sec.questions.length){if(sec.task){S.screen='task';save();render()}else{finishSec()}return}
save();render()}

function finishSec(){
const sec=MODULES[S.mi].sections[S.si];const total=sec.questions.length;const c=S.results.filter(r=>r).length;
if(!S.visited[S.mi])S.visited[S.mi]={};S.visited[S.mi][S.si]={correct:c,total:total};
S.screen='result';S.answered=false;save();render()}

function retrySec(){S.screen='read';S.qi=0;S.results=[];S.answered=false;startQuiz()}

function finishMod(){
const mod=MODULES[S.mi];let modCorrect=0,modTotal=0;
mod.sections.forEach((sec,si)=>{const total=sec.questions.length;modTotal+=total;if(S.visited[S.mi]&&S.visited[S.mi][si]){modCorrect+=S.visited[S.mi][si].correct}});
if(!S.visited)S.visited={};S.visited[mod.id]={done:true,correct:modCorrect,questions:modTotal};
const allDone=MODULES.every(m=>S.visited&&S.visited[m.id]&&S.visited[m.id].done);
if(allDone){S.screen='allDone'}else{S.mi=S.mi<MODULES.length-1?S.mi+1:0;S.si=0;S.screen='modules'}save();render()}

function saveNote(){const key=`${S.mi}-${S.si}`;const ta=document.getElementById('task-input');if(ta){S.notesSaved[key]=ta.value;save()}}

function speakText(){const sec=MODULES[S.mi].sections[S.si];speak(sec.text.replace(/<[^>]+>/g,''))}
function speakQ(){speak(MODULES[S.mi].sections[S.si].questions[S.qi].q)}
function speakFullSec(mi,si){const sec=MODULES[mi].sections[si];speak(sec.text.replace(/<[^>]+>/g,''))}

function speak(text){
if(!window.speechSynthesis)return;window.speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(text);u.lang='de-CH';u.rate=0.85;
u.onstart=()=>document.querySelectorAll('.tts-btn').forEach(b=>b.classList.add('speaking'));
u.onend=()=>document.querySelectorAll('.tts-btn').forEach(b=>b.classList.remove('speaking'));
window.speechSynthesis.speak(u)}

load();render();
</script>
</body>
</html>
