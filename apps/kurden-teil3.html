<style>

<script>
const MODULES=[
{id:'tuerkei1',title:'Die Türkei: Aufstände und Verbote',desc:'1923 bis 1960: Scheich Said, Dersim, Assimilation',
sections:[
{title:'Lausanne und die «zwei Mustafa Kemals»',
text:'Im Befreiungskrieg hatten viele Kurden aufseiten der kemalistischen Bewegung gekämpft, denn Mustafa Kemal hatte versprochen, Kalifat, Sultanat und Religion zu schützen. Doch nach dem Sieg blieb von den Versprechen wenig übrig: Das <strong>Kalifat, das wichtigste Bindeglied zwischen Türken und Kurden, wurde 1924 abgeschafft</strong>. Der <strong>Vertrag von Lausanne</strong> (1923) gewährte Minderheitenrechte nur den nicht-muslimischen Gruppen (Griechen, Armeniern und Juden), eine Folge des osmanischen Millet-Systems. Die Kurden erhielten als Muslime <strong>keinen Minderheitenstatus</strong>. Als der Soziologe Ismail Beşikçi Jahrzehnte später einen alten kurdischen Bauern nach Mustafa Kemal fragte, bekam er zur Antwort: «Nach welchem von beiden fragst du? Es gibt zwei Mustafa Kemal. Einen, der im Feldzug Religion und Glauben schützen wollte und die Stammesführer um Hilfe bat. Und einen anderen, der nach dem Feldzug den Padischah verjagte und unserer Religion keine Beachtung mehr schenkte.»',
glossary:[{kw:'Lausanne',tr:'Lozan'},{kw:'Minderheit',tr:'kêmanî'},{kw:'Kalifat',tr:'xelîfetî'},{kw:'Versprechen',tr:'soz'}],
wb:[{w:'Kalifat',e:'religiöse Führung aller Muslime durch einen Nachfolger des Propheten (Kalif)'},{w:'Millet-System',e:'osmanische Ordnung, die Menschen nach Religion einteilte, nicht nach Sprache oder Volk'},{w:'Padischah',e:'Titel des osmanischen Sultans (Herrschers)'},{w:'Minderheitenstatus',e:'offiziell anerkannte Sonderrechte für eine kleinere Volksgruppe'}],
questions:[{q:'Wer erhielt im Vertrag von Lausanne Minderheitenrechte?',correct:'Nur Nicht-Muslime: Griechen, Armenier und Juden',wrong:['Alle Völker der Türkei','Die Kurden und Araber','Niemand'],kurmanji:'kêmanî = Minderheit'},{q:'Warum sprach der alte Bauer von «zwei Mustafa Kemals»?',correct:'Vor dem Sieg versprach Kemal, die Religion zu schützen, danach brach er die Versprechen',wrong:['Mustafa Kemal hatte einen Zwillingsbruder','Es gab zwei Politiker mit demselben Namen','Der Bauer kannte ihn nicht'],kurmanji:'soz = Versprechen'}],
task:{type:'reflect',text:'«Es gibt zwei Mustafa Kemal», sagte der alte Bauer. Was meinte er damit? Kennst du andere Beispiele aus Geschichte oder Alltag, in denen Versprechen nach einem Sieg gebrochen wurden? Schreib deine Gedanken auf.'}},

{title:'Azadi und der Scheich-Said-Aufstand 1925',
text:'Schon 1923, noch vor den Säkularisierungs-Gesetzen, wurde die Geheimorganisation <strong>Azadi</strong> («Freiheit») gegründet, mit Zentrum um Erzurum. Unter den Mitgliedern waren Stammesführer und Offiziere wie Ihsan Nuri und Halid Cibran, die in der osmanischen Armee gedient hatten. Der kurdische Widerstand war also nicht allein ein Kampf gegen die Religionspolitik Ankaras. Azadi hatte massgeblichen Anteil an einer Koalition, deren Führung der Naqschbandi-Scheich <strong>Said aus Palu</strong> übernahm. Sein Aufstand war ein <strong>nationalistischer Aufstand in religiösem Gewand</strong>: Erst in der Massenmobilisierung setzte Said seine religiöse Autorität ein und erliess Gutachten (<em>fetva</em>), welche die Regierung in Ankara als Feind der Religion brandmarkten. Im Februar 1925 wurde der Aufstand durch einen Zwischenfall vorzeitig ausgelöst. Anfangs hatten die Kurden Erfolge: 10&thinsp;000 bis 15&thinsp;000 Bewaffnete nahmen Orte wie Lice, Maden, Palu und Bingöl ein; die Regierungstruppen zogen sich in die Garnisonen von Diyarbakır und Erzurum zurück.',
glossary:[{kw:'Azadi',tr:'azadî (Freiheit)'},{kw:'Scheich',tr:'şêx'},{kw:'Aufstand',tr:'serhildan'},{kw:'Gutachten',tr:'fetwa'}],
wb:[{w:'Säkularisierung',e:'Trennung von Religion und Staat; die Religion verliert Einfluss auf Gesetze und Schulen'},{w:'Naqschbandi-Orden',e:'grosse religiöse Bruderschaft im Islam (Sufi-Orden)'},{w:'Garnison',e:'Ort, an dem Truppen dauerhaft stationiert sind'},{w:'Mobilisierung',e:'viele Menschen für eine Sache in Bewegung bringen'}],
questions:[{q:'Wie lässt sich der Scheich-Said-Aufstand am besten beschreiben?',correct:'Ein nationalistischer Aufstand in religiösem Gewand',wrong:['Ein rein religiöser Aufstand','Ein kommunistischer Aufstand','Ein Aufstand für den Sultan'],kurmanji:'serhildan = Aufstand'},{q:'Was zeigt die Gründung von Azadi bereits 1923?',correct:'Der kurdische Widerstand begann vor den Säkularisierungs-Gesetzen, es ging nicht nur um Religion',wrong:['Die Kurden waren gegen jede Regierung','Azadi wurde von den Briten gegründet','Der Widerstand begann erst 1925'],kurmanji:'azadî = Freiheit'}],
task:null},

{title:'Die Niederschlagung und ihre Folgen',
text:'Ihr wichtigstes Ziel, die Eroberung der grossen Städte, erreichten die Aufständischen nicht. Über die Eisenbahn wurden Truppen nach Ost-Anatolien gebracht; die Rebellen wurden zwischen Bingöl und Lice eingekreist und geschlagen. Bemerkenswert: Es war nicht in erster Linie das türkische Militär, das die Aufständischen bekämpfte, sondern <strong>andere kurdische Stämme</strong>, vor allem die Zaza-sprachigen Hormek, die noch alte Rechnungen mit den Cibran offen hatten. <strong>Scheich Said wurde im April 1925 gefangen genommen und im Juni mit Dutzenden Mitstreitern hingerichtet.</strong> Die Regierung scherte alle Kurden über einen Kamm und unterschied nicht zwischen regierungstreuen und aufständischen. Das löste auch bei Unbeteiligten Verbitterung aus. Der Aufstand lieferte den Vorwand für das Gesetz zur «Aufrechterhaltung von Ruhe und Ordnung»: Unabhängigkeitsgerichte übten politische Justiz, die Presse wurde an die Kandare genommen, Stämme wurden entwaffnet, ganze Dörfer in den Westen deportiert.',
glossary:[{kw:'Gericht',tr:'dadgeh'},{kw:'Strafe',tr:'ceza'},{kw:'Stamm',tr:'eşîr'},{kw:'Rache',tr:'tolhildan'}],
wb:[{w:'Deportation',e:'zwangsweises Wegbringen von Menschen an einen anderen Ort'},{w:'politische Justiz',e:'Gerichte verurteilen Gegner der Regierung, statt neutral zu urteilen'},{w:'Vorwand',e:'vorgeschobener Grund, der den wahren Grund verdeckt'},{w:'an die Kandare nehmen',e:'streng kontrollieren (Bild vom Zaumzeug des Pferdes)'}],
questions:[{q:'Wer kämpfte vor allem gegen die Aufständischen?',correct:'Auch kurdische Stämme wie die Hormek, wegen alter Stammesrivalitäten',wrong:['Nur das türkische Militär','Britische Truppen','Armenische Milizen'],kurmanji:'eşîr = Stamm'},{q:'Wozu nutzte die Regierung den Aufstand?',correct:'Als Vorwand für Notstandsgesetze, politische Justiz und Deportationen',wrong:['Um den Kurden Autonomie zu geben','Um Wahlen auszurufen','Um das Kalifat wieder einzuführen'],kurmanji:'dadgeh = Gericht'}],
task:{type:'reflect',text:'Kurdische Stämme kämpften gegen kurdische Rebellen, wegen alter Rivalitäten. Was sagt das über die Idee einer «kurdischen Einheit» in dieser Zeit? Hältst du Einheit für selbstverständlich, wenn Menschen dieselbe Sprache sprechen?'}},

{title:'Choibun und der Ararat-Aufstand 1930',
text:'Viele kurdische Nationalisten mussten nach der Gründung der Republik ins Exil. 1927 trafen sie sich in der Nähe von Beirut und gründeten die Allianz <strong>Choibun</strong>. Es war der erste Versuch, intellektuelle, militärische, religiöse und tribale Führer zu koordinieren. Choibun arbeitete mit armenischen Nationalisten zusammen und hoffte, die kurdische Frage vor den Völkerbund zu bringen. 1930 organisierte Choibun den <strong>Aufstand am Ararat</strong> unter Führung von Ihsan Nuri: Die Region sollte «befreit» und eine kurdische Regierung eingesetzt werden. Der Aufstand misslang: Die kurdischen Kräfte kämpften nur an einer Front, und <strong>Iran schloss mit der Türkei ein Abkommen</strong>, das die Grenze dichtmachte und die Flucht- und Versorgungswege abschnitt. Erfolgreicher war Choibun auf kulturellem Gebiet: Die Brüder Celadet und Kamuran Bedir Chan leisteten in den dreissiger Jahren Pionierarbeit für die kurdische Sprache; Celadet erteilte Atatürk in einem offenen Brief eine Lektion über die Eigenständigkeit des Kurdischen.',
glossary:[{kw:'Ararat',tr:'Agirî'},{kw:'Hoffnung',tr:'hêvî'},{kw:'Grenze',tr:'sînor'},{kw:'Bündnis',tr:'hevalbendî'}],
wb:[{w:'Exil',e:'erzwungenes Leben im Ausland, weil die Heimat zu gefährlich ist'},{w:'Völkerbund',e:'internationale Organisation nach dem Ersten Weltkrieg, Vorläufer der UNO'},{w:'Nationalist',e:'jemand, der einen eigenen Staat für sein Volk anstrebt'},{w:'tribal',e:'zum Stamm gehörend, auf Stämmen beruhend'}],
questions:[{q:'Was war Choibun?',correct:'Ein Bündnis kurdischer Exil-Organisationen, das den Widerstand koordinieren wollte',wrong:['Eine türkische Partei','Eine religiöse Bruderschaft','Ein kurdischer Stamm'],kurmanji:'hevalbendî = Bündnis'},{q:'Warum scheiterte der Ararat-Aufstand?',correct:'Iran schloss ein Abkommen mit der Türkei, und die Flucht- und Versorgungswege wurden abgeschnitten',wrong:['Die Kurden hatten zu viele Waffen','Die Armenier verrieten die Kurden','Es gab einen strengen Winter'],kurmanji:'sînor = Grenze'}],

{title:'Umsiedlung und Dersim 1937/38',
text:'1934 trat ein Gesetz in Kraft, das, ohne sie beim Namen zu nennen, auf die Kurden zielte: <strong>«Personen ohne Verbundenheit mit türkischer Kultur»</strong> sollten umgesiedelt werden, sodass die Türken überall die Bevölkerungsmehrheit bildeten. Stammesführer und Scheichs sollten von ihren Gefolgschaften getrennt werden. Der letzte grosse Aufstand fand 1937/38 in <strong>Dersim</strong> (heute Tunceli) statt: Die alevitischen Kurden der Region strebten unter dem Geistlichen <strong>Seyyid Rıza</strong> Selbstverwaltung an. Drei Armeekorps gingen mit äusserster Härte vor; viele Dörfer wurden dem Erdboden gleichgemacht, Hilferufe verhallten ungehört. Das Scheitern von Dersim markierte den Beginn einer rund <strong>zwanzig Jahre dauernden Phase des erzwungenen Schweigens</strong>: Das Wort «Kurde» geriet in Acht und Bann; mitunter sprach man von «Bergtürken». Erst 2011 entschuldigte sich Ministerpräsident Erdoğan öffentlich für das Dersim-Massaker.',
glossary:[{kw:'Dersim',tr:'Dêrsim'},{kw:'Alevit',tr:'Elewî'},{kw:'Verbannung',tr:'sirgûn'},{kw:'Schweigen',tr:'bêdengî'}],
wb:[{w:'Aleviten',e:'religiöse Gemeinschaft mit eigenen Traditionen, vom sunnitischen Islam verschieden'},{w:'Selbstverwaltung',e:'eine Region regelt ihre Angelegenheiten selbst, bleibt aber Teil des Staates'},{w:'in Acht und Bann',e:'verboten und geächtet, niemand darf es verwenden'},{w:'Massaker',e:'Massentötung wehrloser Menschen'}],
questions:[{q:'Worauf zielte das Umsiedlungsgesetz von 1934?',correct:'Die Türken sollten überall die Bevölkerungsmehrheit bilden',wrong:['Kurden sollten eigene Provinzen erhalten','Alle Nomaden sollten Häuser bekommen','Armenier sollten zurückkehren dürfen'],kurmanji:'sirgûn = Verbannung'},{q:'Was folgte auf die Niederschlagung von Dersim?',correct:'Rund zwanzig Jahre erzwungenes Schweigen, das Wort «Kurde» war verbannt',wrong:['Eine kurdische Autonomie','Freie Wahlen im Osten','Die Rückkehr des Kalifats'],kurmanji:'bêdengî = Schweigen'}],
task:{type:'reflect',text:'Nach Dersim durfte das Wort «Kurde» jahrzehntelang nicht öffentlich verwendet werden, man sagte «Bergtürken». Was bedeutet es für Menschen, wenn sie ihre eigene Identität nicht nennen dürfen? Schreib drei Gedanken auf.'}},

{title:'Vom Einparteienstaat zum Mehrparteiensystem',
text:'Bis 1945 herrschte die Republikanische Volkspartei (CHP) allein. Ab 1946 brachte das <strong>Mehrparteiensystem</strong> frischen Wind: Die Demokratische Partei (DP) mobilisierte als erste die Bevölkerung des Ostens. Agas und Scheichs, trotz aller Gesetze keineswegs verschwunden, kehrten in die Politik zurück; sogar ein Enkel von Scheich Said wurde DP-Abgeordneter. Die <strong>medresen</strong>, religiöse Schulen und Kristallisationspunkte kurdischer Sprache, lebten im Verborgenen wieder auf. Die fünfziger Jahre brachten Erleichterungen: weniger Militärkontrollen, etwas Infrastruktur. Doch nach dem <strong>Militärputsch vom 27. Mai 1960</strong> folgten erneut Deportationen von Führungspersonen und eine Kampagne gegen die kurdische Kultur. Staatspräsident Gürsel schrieb, es gebe <strong>keine eigenständige kurdische Identität</strong>: Das «Kurdentum» werde von feindlichen Mächten aufgehetzt, um die nationale Einheit zu erschüttern. Die Leugnung der Kurden wurde zur Staatsdoktrin.',
glossary:[{kw:'medrese',tr:'medrese'},{kw:'Wahl',tr:'hilbijartin'},{kw:'Partei',tr:'partî'},{kw:'Leugnung',tr:'înkar'}],
wb:[{w:'Einparteienherrschaft',e:'nur eine Partei ist erlaubt und regiert allein'},{w:'Militärputsch',e:'gewaltsame Machtübernahme durch die Armee'},{w:'Staatsdoktrin',e:'offizielle Lehrmeinung des Staates, an der nicht gezweifelt werden darf'},{w:'Infrastruktur',e:'Grundausstattung eines Landes: Strassen, Strom, Schulen, Spitäler'}],
questions:[{q:'Was änderte sich ab 1946?',correct:'Mehrparteiensystem, kurdische Eliten wurden in die Parteipolitik integriert',wrong:['Die Kurden erhielten Autonomie','Die CHP verbot alle Parteien','Die Türkei wurde Monarchie'],kurmanji:'hilbijartin = Wahl'},{q:'Was behauptete Staatspräsident Gürsel nach dem Putsch von 1960?',correct:'Es gebe keine eigenständige kurdische Identität, das «Kurdentum» sei von Feinden aufgehetzt',wrong:['Die Kurden sollten einen eigenen Staat erhalten','Kurdisch werde Amtssprache','Die Armee schütze die kurdische Kultur'],kurmanji:'înkar = Leugnung'}],

{id:'tuerkei2',title:'Die Türkei: PKK und der lange Krieg',desc:'1960 bis heute: linke Bewegung, PKK, Friedensprozess',
sections:[
{title:'Die Ost-Versammlungen und die linke Bewegung',
text:'Ab Mitte der sechziger Jahre wurden grössere Teile der kurdischen Bevölkerung politisch mobilisiert. Auf den <strong>«Ost-Versammlungen»</strong> (Doğu mitingleri) von 1967 wurden Forderungen laut nach mehr Schulen, wirtschaftlicher Entwicklung und einem Ende der Repression. «Der Osten ist eine Schande für die Türkei des 20. Jahrhunderts», hiess es. Kurdische Intellektuelle und Studenten hielten Ansprachen auf Kurdisch; einige fanden sich in den <strong>«Revolutionären Ost-Kulturklubs» (DDKO)</strong> zusammen, der ersten legalen Organisation mit einem klaren Bekenntnis zur kurdischen Identität, 1971 nach der Militärintervention geschlossen. In Zeitschriften wie <em>Barış Dünyası</em> wurde diskutiert, dass das «Ostproblem» nicht mit Verboten oder Gewalt zu lösen sei. Da das Wort Kurdistan tabu war, sprach man vom <strong>«Doğu»</strong>, dem Osten. Auftrieb gab auch der Irak: Als Barzani dort Autonomie forderte, war dies Wasser auf die Mühlen kurdischer Studenten in der Türkei.',
glossary:[{kw:'Osten',tr:'rojhilat'},{kw:'Zeitung',tr:'rojname'},{kw:'Student',tr:'xwendekar'},{kw:'Gedicht',tr:'helbest'}],
wb:[{w:'Repression',e:'Unterdrückung durch den Staat (Verbote, Verhaftungen, Gewalt)'},{w:'Intellektuelle',e:'Menschen, die beruflich denken und schreiben: Schriftsteller, Professoren, Studenten'},{w:'Tabu',e:'etwas, worüber man nicht sprechen darf'}],
questions:[{q:'Was forderten die Ost-Versammlungen von 1967?',correct:'Schulen, wirtschaftliche Entwicklung und ein Ende der Repression',wrong:['Einen unabhängigen Staat','Den Anschluss an den Irak','Die Rückkehr des Sultans'],kurmanji:'rojhilat = Osten'},{q:'Wie umgingen Zeitschriften das Tabu-Wort Kurdistan?',correct:'Sie sprachen vom «Doğu», dem Osten',wrong:['Sie schrieben auf Englisch','Sie benutzten Geheimschrift','Sie schwiegen ganz'],kurmanji:'rojname = Zeitung'}],

{title:'Die Gründung der PKK',
text:'Nach dem Militärputsch von 1980 wurden alle radikalen Gruppierungen zerschlagen. Nur die <strong>PKK</strong> (Arbeiterpartei Kurdistans) wurde schnell wieder aktiv: Ihre Kader waren <strong>nach Syrien geflohen</strong> und nahmen von dort den bewaffneten Kampf auf. Die Partei war ganz auf ihren Vorsitzenden <strong>Abdullah Öcalan</strong> zugeschnitten und folgte marxistisch-leninistischen Prinzipien; sie begriff Kurdistan als eine <strong>türkische Kolonie</strong>, die durch bewaffneten Kampf befreit werden müsse. Im August 1984 begannen die ersten Angriffe in den Provinzen Hakkari und Şırnak. Der Krieg forderte <strong>über 30&thinsp;000 Tote</strong>; mehrere tausend Dörfer wurden zwangsevakuiert oder verlassen. Beide Seiten erzählten denselben Krieg verschieden: Für den Staat war es ein Kampf gegen «separatistische Terroristen», für die PKK ein Kampf gegen «Kolonialisten» und «Staatsterror». Später rückte die PKK von der Forderung nach einem unabhängigen Staat ab und spricht seither von «demokratischem Konföderalismus».',
glossary:[{kw:'Guerilla',tr:'gerîla'},{kw:'Krieg',tr:'şer'},{kw:'Partei',tr:'partî'},{kw:'Führung',tr:'serokatî'}],
wb:[{w:'marxistisch-leninistisch',e:'kommunistische Ideologie nach Marx und Lenin'},{w:'Kolonie',e:'Gebiet, das von einem fremden Staat beherrscht und ausgebeutet wird'},{w:'Kader',e:'geschulte Kernmitglieder einer Partei'},{w:'demokratischer Konföderalismus',e:'Selbstverwaltung über lokale Räte statt eines eigenen Staates'}],
questions:[{q:'Warum konnte die PKK nach dem Putsch von 1980 weitermachen?',correct:'Ihre Kader waren nach Syrien geflohen und kämpften von dort',wrong:['Sie war vom Militär erlaubt','Sie hatte im Parlament Sitze','Sie versteckte sich in Istanbul'],kurmanji:'partî = Partei'},{q:'Wie begriff die PKK Kurdistan in ihrer Ideologie?',correct:'Als türkische Kolonie, die durch bewaffneten Kampf befreit werden müsse',wrong:['Als autonome Region der Türkei','Als Teil des Irak','Als religiöses Zentrum'],kurmanji:'şer = Krieg'}],
task:{type:'reflect',text:'Über 30&thinsp;000 Menschen starben in diesem Krieg: Soldaten, Kämpferinnen und Kämpfer, Zivilisten. Der Staat nennt ihn «Kampf gegen Terroristen», die PKK «Befreiungskampf». Warum ist es wichtig, beide Erzählungen zu kennen, bevor man urteilt?'}},

{title:'Die Dorfwächter (korucu)',
text:'1985 änderte die Regierung ihre Strategie und bildete in den kurdischen Dörfern eine Miliz gegen die PKK: die <strong>Dorfwächter</strong> (türkisch <em>korucu</em>, kurdisch <em>cerdevan</em>), bezahlt aus der Staatskasse. In einigen Gegenden standen sie unter der Führung eines Stammesführers, andere wurden direkt von der Armee instruiert. Das System erinnert an die <strong>Hamidiye-Regimenter</strong> des 19. Jahrhunderts, eine erstaunliche Kontinuität im staatlichen Umgang mit der Kurdenfrage: Kurden gegen Kurden. Die Folge war eine <strong>Vertiefung der Spaltung</strong> in der Bevölkerung: Dorf gegen Dorf, Familie gegen Familie. Die Haltung zur PKK wurde kompliziert: Mitunter sympathisierten Dorfwächter insgeheim mit der PKK und unterstützten sie sogar. Für die PKK-Kämpfer bürgerte sich der vorsichtige Ausdruck <em>dagdakiler</em> ein, «die in den Bergen».',
glossary:[{kw:'Dorfwächter',tr:'cerdevan'},{kw:'Dorf',tr:'gund'},{kw:'Waffe',tr:'çek'},{kw:'Spaltung',tr:'dubendî'}],
wb:[{w:'Miliz',e:'bewaffnete Gruppe aus der Bevölkerung, keine reguläre Armee'},{w:'Kontinuität',e:'etwas setzt sich über lange Zeit unverändert fort'},{w:'Euphemismus',e:'beschönigendes Wort für etwas Unangenehmes'}],
questions:[{q:'Was war das korucu-System?',correct:'Eine staatlich bezahlte Dorfmiliz aus Kurden im Kampf gegen die PKK',wrong:['Eine PKK-Jugendorganisation','Eine Schulreform','Ein Bewässerungsprojekt'],kurmanji:'cerdevan = Dorfwächter'},{q:'An welche frühere Einrichtung erinnert das System?',correct:'An die Hamidiye-Regimenter: Kurden wurden gegen Kurden eingesetzt',wrong:['An die Janitscharen','An die Unabhängigkeitsgerichte','An die medresen'],kurmanji:'dubendî = Spaltung'}],
task:{type:'parent',text:'Im Irak gab es ähnliche Milizen (Dschahsch). Frage deine Eltern: Kennen sie Geschichten von Menschen, die zwischen den Fronten standen: beim Staat angestellt und doch mit den Kurden verbunden? Wie denken sie darüber?'}},

{title:'Das Dorf Sisin: ein Fallbeispiel',
text:'Ein Ethnologe beschreibt das Bergdorf <strong>Sisin in der Provinz Hakkari</strong>: 1982 lebten dort rund 250 Personen in 23 Haushalten. Sie lebten von Kleinvieh und vom «illegalen» Grenzhandel mit dem Irak und Iran. Mit der Gendarmerie verband die Bauern eine Art <strong>erzwungene Symbiose</strong>: Man misstraute sich, war aber im Bergwinter aufeinander angewiesen. Ab 1986 wurden die Männer von Sisin <strong>Dorfwächter</strong>, fast als erste ihres Stammes, wofür sie kritisiert wurden. Im Juni 1994 kam es zu einer schweren Auseinandersetzung mit der PKK; ein junger Dorfwächter fiel, vier wurden als Geiseln genommen. Der Kommandeur verlor das «Vertrauen» in das Dorf: Die Bewohner mussten die <strong>Waffen abgeben und das Dorf verlassen</strong>. Die Häuser rissen sie selbst ab, um die Balken mitzunehmen. <strong>Sisin existiert nicht mehr.</strong> Die Lehre des Ethnologen: Menschen können nicht einfach als «PKK-Anhänger» oder «Verräter» einsortiert werden. Sie handeln pragmatisch und versuchen, den Krieg zu überleben.',
glossary:[{kw:'Dorf',tr:'gund'},{kw:'Schmuggel',tr:'qaçax'},{kw:'Grenze',tr:'sînor'},{kw:'Leben',tr:'jiyan'}],
wb:[{w:'Ethnologe',e:'Wissenschaftler, der Kulturen und Lebensweisen von Menschen erforscht'},{w:'Symbiose',e:'Zusammenleben zum gegenseitigen Nutzen'},{w:'pragmatisch',e:'praktisch handelnd, nach dem, was funktioniert, nicht nach Ideologie'},{w:'Ideologie',e:'festes Weltbild mit politischen Zielen'}],
questions:[{q:'Warum mussten die Bewohner Sisin 1994 verlassen?',correct:'Nach Kämpfen mussten sie die Waffen abgeben und durften nicht unbewaffnet bleiben',wrong:['Wegen eines Erdbebens','Sie wanderten freiwillig nach Istanbul aus','Die PKK kaufte das Dorf'],kurmanji:'gund = Dorf'},{q:'Was zeigt das Beispiel Sisin?',correct:'Menschen zwischen den Fronten handeln pragmatisch, um zu überleben, nicht aus Ideologie',wrong:['Alle Dorfbewohner waren PKK-Anhänger','Alle Dorfbewohner waren regierungstreu','Das Dorfleben war unpolitisch'],kurmanji:'jiyan = Leben'}],
task:{type:'reflect',text:'«Personen können nicht einfach als PKK-Anhänger oder Verräter gesehen werden. Sie versuchen, den Krieg zu überleben.» Was bedeutet dieser Satz für dich? Wie schnell urteilen wir über Menschen in einem Konflikt, und was übersehen wir dabei?'}},

{title:'Özal und die kurdischen Parteien',
text:'Die Jahre 1991/92 brachten eine Aufweichung der verhärteten Fronten. Ministerpräsident Demirel sprach davon, die <strong>«kurdische Realität»</strong> müsse anerkannt werden. Konkreter wurde Staatspräsident <strong>Özal</strong>: Auf seine Initiative wurde das Sprachverbotsgesetz von 1983 im Jahr <strong>1991 aufgehoben</strong>, der mündliche Gebrauch des Kurdischen war wieder legal. Özal wagte sogar das Wort «Föderation». Gleichzeitig begann die Verbotskette der prokurdischen Parteien: Die <strong>HEP</strong> kam 1991 huckepack mit den Sozialdemokraten ins Parlament und wurde verboten; die Nachfolgerin <strong>DEP</strong> wurde 1994 aufgelöst, sieben Abgeordnete, darunter <strong>Leyla Zana</strong>, wurden zu langen Haftstrafen verurteilt. Die <strong>HADEP</strong> scheiterte 1995 mit 4,2% an der 10-Prozent-Hürde. Der Konflikt wurde zugleich unübersichtlicher: Militär, Geheimapparate, PKK, Parteien, Menschenrechtsvereine und dazu mafiöse Strukturen, die vom Krieg profitierten.',
glossary:[{kw:'Sprache',tr:'ziman'},{kw:'Verbot',tr:'qedexe'},{kw:'Parlament',tr:'parlamento'},{kw:'Realität',tr:'rastî'}],
wb:[{w:'Föderation',e:'Bundesstaat: Teilgebiete behalten eigene Rechte (wie Kantone in der Schweiz)'},{w:'10-Prozent-Hürde',e:'Parteien mit weniger als 10% der Stimmen kommen nicht ins Parlament'},{w:'mafiöse Strukturen',e:'kriminelle Netzwerke nach Art der Mafia'}],
questions:[{q:'Was wurde 1991 auf Initiative Özals aufgehoben?',correct:'Das Sprachverbotsgesetz, der mündliche Gebrauch des Kurdischen wurde legal',wrong:['Die Verfassung','Das Parteienverbot der PKK','Die Wehrpflicht'],kurmanji:'ziman = Sprache'},{q:'Was geschah mit den prokurdischen Parteien HEP und DEP?',correct:'Sie wurden verboten, Abgeordnete wie Leyla Zana kamen ins Gefängnis',wrong:['Sie gewannen die Wahlen','Sie regierten mit der CHP','Sie wurden nie gegründet'],kurmanji:'qedexe = Verbot'}],

{title:'Friedensprozess, HDP und die Lage heute',
text:'1999 wurde <strong>Öcalan</strong> verhaftet; die Bilder des Gefesselten lösten unter Kurden das Gefühl einer kollektiven Erniedrigung aus. Das Todesurteil wurde 2002 in eine lebenslange Haftstrafe umgewandelt. Unter der AKP gab es, auch im Zug der EU-Beitrittsverhandlungen, eine grössere Offenheit: die «Kurdische Öffnung» von 2009, Geheimgespräche in Oslo, ab Ende 2012 Verhandlungen mit Öcalan, im <strong>März 2013 offizielle Friedensgespräche</strong> und ein Waffenstillstand, der bis Juli 2015 weitgehend hielt. Im Juni 2015 übersprang die <strong>HDP die 10-Prozent-Hürde</strong> und wurde drittgrösste Partei. Das war der Beweis, dass eine prokurdische Partei auch für Nicht-Kurden wählbar ist. Danach eskalierte der Konflikt erneut: Krieg in kurdischen Städten wie Silopi, Cizre und Nusaybin; beide Seiten warfen sich den Bruch des Waffenstillstands vor. Von einer Verleugnung kurdischer Identität kann heute kaum mehr die Rede sein: Laut einer KONDA-Studie leben über 11 Millionen Kurden in der Türkei. Eine politische Lösung aber steht weiter aus.',
glossary:[{kw:'Frieden',tr:'aştî'},{kw:'Waffenstillstand',tr:'agirbest'},{kw:'Wahl',tr:'hilbijartin'},{kw:'Hoffnung',tr:'hêvî'}],
wb:[{w:'Eskalation',e:'ein Konflikt wird stufenweise heftiger'},{w:'Waffenstillstand',e:'vereinbartes Ende der Kämpfe, noch kein Frieden'},{w:'kollektiv',e:'gemeinsam, alle betreffend'}],
questions:[{q:'Was begann im März 2013?',correct:'Offizielle Friedensgespräche mit der PKK, mit Waffenstillstand bis Juli 2015',wrong:['Der Beitritt der Türkei zur EU','Ein neuer Militärputsch','Die Unabhängigkeit Kurdistans'],kurmanji:'aştî = Frieden'},{q:'Was bewies das HDP-Ergebnis vom Juni 2015?',correct:'Eine prokurdische Partei kann landesweit überzeugen, auch für Nicht-Kurden',wrong:['Die Kurden boykottierten die Wahl','Nur Kurden wählten die HDP','Die HDP scheiterte an der Hürde'],kurmanji:'hilbijartin = Wahl'}],
task:{type:'reflect',text:'Zweimal schien der Frieden nah, Anfang der neunziger Jahre und 2013, und beide Male kam der Krieg zurück. Was braucht es deiner Meinung nach für einen dauerhaften Frieden? Notiere drei Bedingungen.'}}
]},

{id:'irak',title:'Der Irak: Von Scheich Mahmud zur Autonomie',desc:'1918 bis heute: Briten, Barzani, Anfal, De-facto-Staat',
sections:[
{title:'Die Briten und die Mosul-Frage',
text:'Das britische Interesse an Mesopotamien beruhte auf seiner strategischen Lage am Weg nach Indien. Im geheimen <strong>Sykes-Picot-Abkommen</strong> von 1916 war die Region um Mosul zunächst Frankreich zugeschlagen worden, ein Zugeständnis, das die Briten bald bereuten: Mosul war der Hauptlieferant von <strong>Weizen</strong> für Bagdad, und das Interesse an seinen <strong>Ölquellen</strong> wuchs. Nur zwei Tage nach dem Waffenstillstand von Mudros (1918) besetzten sie kurzerhand die Provinz. Auf der Konferenz von San Remo (1920) erhielt England das Mandat über Mesopotamien. In Süd-Kurdistan verfolgten die Briten eine Politik <strong>indirekter Herrschaft</strong>: Stammesführer übernahmen Verwaltungsposten mit beträchtlichen Privilegien und mussten dafür Steuern eintreiben. Die Methode war billig, aber ziemlich erfolglos. Experten wie Major Soane, der verkleidet zwei Jahre durch Kurdistan gereist war und mehrere Dialekte sprach, berieten die Verwaltung.',
glossary:[{kw:'Mosul',tr:'Mûsil'},{kw:'Öl',tr:'neft'},{kw:'Weizen',tr:'genim'},{kw:'Herrschaft',tr:'desthilat'}],
wb:[{w:'Mandat',e:'Auftrag des Völkerbunds an eine Grossmacht, ein Gebiet zu verwalten'},{w:'strategisch',e:'militärisch und politisch wichtig gelegen'},{w:'indirekte Herrschaft',e:'Herrschen über einheimische Führer statt mit eigener Verwaltung'},{w:'Privilegien',e:'Sonderrechte, die andere nicht haben'}],
questions:[{q:'Warum war Mosul für die Briten so wichtig?',correct:'Wegen der Ölquellen und als Weizenlieferant für Bagdad',wrong:['Wegen der schönen Landschaft','Als Badeort am Meer','Wegen der Goldminen'],kurmanji:'neft = Öl'},{q:'Wie herrschten die Briten in Süd-Kurdistan?',correct:'Indirekt, über Stammesführer mit Privilegien',wrong:['Mit einer riesigen Besatzungsarmee','Über gewählte Parlamente','Gar nicht'],kurmanji:'desthilat = Herrschaft'}],
task:null},

{title:'Scheich Mahmud und Sulaimaniya',
text:'Ende 1918 ernannten die Briten <strong>Scheich Mahmud Barzandschi</strong>, das Oberhaupt einer dem Qadiriya-Orden verpflichteten Familie, zum Gouverneur von Sulaimaniya. Mahmud verstand sich als Führer aller Kurden und stärkte seine Macht durch Patronage. Schon 1919 erhob er sich gegen die Briten, wurde geschlagen und ins Exil geschickt. 1922 riefen ihn die Briten zurück, als Gegengewicht zur türkischen Kalifatspropaganda. Mahmud akzeptierte keine Beschränkungen, erklärte sich selbst zum <strong>«Herrscher von Kurdistan»</strong> und wurde schliesslich endgültig in die Flucht geschlagen. Seine Stadt blieb besonders: <strong>Sulaimaniya</strong>, einst Zentrum des Baban-Emirats, pflegte eine lebendige Erinnerung an vergangene kurdische Macht. Der <strong>Sorani-Dialekt</strong> wurde hier als offizielle Sprache gefördert, mit Zeitung, Grammatik und Schulbüchern. Der Kurdenexperte Edmonds beschrieb die Überzeugung der Einwohner, ihre Stadt sei dazu bestimmt, <strong>Hauptstadt eines kurdischen Staates</strong> zu werden.',
glossary:[{kw:'Sulaimaniya',tr:'Silêmanî'},{kw:'Scheich',tr:'şêx'},{kw:'Gouverneur',tr:'walî'},{kw:'Hauptstadt',tr:'paytext'}],
wb:[{w:'Orden (Qadiriya)',e:'religiöse Bruderschaft im Islam'},{w:'Patronage',e:'Macht durch Beschützen und Belohnen von Gefolgsleuten'},{w:'Emirat',e:'Fürstentum, das von einem Emir (Fürsten) regiert wird'},{w:'Dialekt',e:'regionale Form einer Sprache'}],
questions:[{q:'Wozu ernannten die Briten Scheich Mahmud 1918?',correct:'Zum Gouverneur von Sulaimaniya',wrong:['Zum König des Irak','Zum Kalifen','Zum General der türkischen Armee'],kurmanji:'walî = Gouverneur'},{q:'Warum war Sulaimaniya besonders?',correct:'Als Erbin des Baban-Emirats sahen die Einwohner ihre Stadt als künftige Hauptstadt Kurdistans',wrong:['Es war die grösste Stadt der Welt','Dort lebten keine Kurden','Die Briten bauten dort einen Hafen'],kurmanji:'Silêmanî = Sulaimaniya'}],
task:{type:'parent',text:'In der Nähe von Sulaimaniya (Silêmanî) liegt Surdash. Frage deine Eltern: Was wissen sie über die Stadt und die Region? War jemand aus der Familie dort, und welche Geschichten gibt es darüber?'}},

{title:'Völkerbund, Unabhängigkeit und Extreme',
text:'Weil die Mosul-Frage auch in Lausanne nicht gelöst wurde, kam sie vor den Völkerbund. Dessen Kommission stellte 1925 fest, dass die meisten Einwohner nicht unter türkischer Herrschaft leben wollten, und sprach <strong>Mosul dem Irak zu</strong>, unter der Bedingung, dass die Wünsche der Kurden Beachtung finden müssten. Der Vertrag zwischen Grossbritannien und dem Irak von 1930 enthielt dann aber <strong>keine Garantien kurdischer Rechte</strong>. In einer Petition an den Völkerbund empörten sich die Kurden, sie seien «der Gnade der Araber» ausgeliefert. 1932 wurde der Irak unabhängig. Die Geschichte der Kurden im Irak ist seither durch <strong>Extreme</strong> gekennzeichnet: Einerseits konnten sie sich, anders als in der Türkei, kulturell und sprachlich frei betätigen und ihnen wurde immer wieder Autonomie zugesagt. Andererseits waren sie in keinem Nachbarstaat einer solchen Repression <strong>bis hin zur Massenvernichtung</strong> ausgesetzt. Und nur hier entstand später ein De-facto-Kurdenstaat.',
glossary:[{kw:'Vertrag',tr:'peyman'},{kw:'Unabhängigkeit',tr:'serxwebûn'},{kw:'Versprechen',tr:'soz'},{kw:'Anerkennung',tr:'nasîn'}],
wb:[{w:'Petition',e:'schriftliche Bitte oder Beschwerde an eine Behörde oder Organisation'},{w:'Garantie',e:'verbindliche Zusicherung'},{w:'de facto',e:'tatsächlich so, auch wenn es offiziell nicht anerkannt ist'}],
questions:[{q:'Unter welcher Bedingung sprach der Völkerbund Mosul dem Irak zu?',correct:'Die Wünsche der Kurden mussten Beachtung finden',wrong:['Mosul musste türkisch bleiben','Die Kurden mussten auswandern','Der Irak musste das Öl an Frankreich abgeben'],kurmanji:'peyman = Vertrag'},{q:'Was kennzeichnet die Geschichte der Kurden im Irak?',correct:'Extreme: kulturelle Anerkennung einerseits, Repression bis zur Massenvernichtung andererseits',wrong:['Ununterbrochener Frieden','Vollständige Assimilation','Keine politische Rolle'],kurmanji:'serxwebûn = Unabhängigkeit'}],

{title:'Mustafa Barzani',
text:'<strong>Mulla Mustafa Barzani</strong>, bis zu seinem Tod 1979 die bekannteste Figur der kurdischen Bewegung, stand in einer Tradition charismatischer Scheichs. Nach dem gescheiterten Aufstand seines Bruders Ahmad wurde die Familie 1933 in Sulaimaniya unter Hausarrest gestellt. Hier kam Barzani mit nationalistischem Gedankengut in Berührung. 1943 kehrte er heim, führte neue Aufstände und wurde nach Iran vertrieben, wo er zum General der Republik Mahabad wurde. Auf seine Anweisung wurde die <strong>Demokratische Partei Kurdistans (DPK)</strong> gegründet; er liess sich in Abwesenheit zum Vorsitzenden küren. Nach dem Fall Mahabads gelang ihm mit seinen Kämpfern ein abenteuerlicher Marsch in die <strong>Sowjetunion, wo er von 1947 bis 1958 Asyl</strong> fand. Erst der Putsch Qasims öffnete ihm die Rückkehr. Die städtischen Nationalisten steckten in einem Dilemma: Sie mussten Barzani als <strong>nationalen Helden</strong> feiern und störten sich zugleich an seiner Rolle als traditioneller Stammesscheich, dessen Macht auf seinen Kämpfern beruhte.',
glossary:[{kw:'Peschmerga',tr:'pêşmerge'},{kw:'Führer',tr:'serok'},{kw:'Exil',tr:'sirgûn'},{kw:'Rückkehr',tr:'vegera'}],
wb:[{w:'charismatisch',e:'mit besonderer Ausstrahlung, die Menschen mitreisst'},{w:'Hausarrest',e:'Verbot, das eigene Haus zu verlassen'},{w:'Asyl',e:'Schutz, den ein Staat verfolgten Menschen gewährt'},{w:'Dilemma',e:'Zwickmühle: beide Möglichkeiten haben grosse Nachteile'}],
questions:[{q:'Wo fand Barzani von 1947 bis 1958 Asyl?',correct:'In der Sowjetunion',wrong:['In den USA','In der Türkei','In Ägypten'],kurmanji:'sirgûn = Exil'},{q:'Was war das Dilemma der städtischen kurdischen Nationalisten?',correct:'Sie feierten Barzani als Helden, kritisierten aber seine traditionelle Stammespolitik',wrong:['Sie kannten Barzani nicht','Sie wollten zur Türkei gehören','Sie lehnten die kurdische Sprache ab'],kurmanji:'serok = Führer'}],
task:{type:'parent',text:'Frage deine Eltern: Welche Geschichten kennen sie über Mulla Mustafa Barzani und die Peschmerga? Wie wird er in eurer Familie und eurer Region gesehen?'}},

{title:'Das Abkommen von 1970 und die Niederlage 1975',
text:'Nach der Machtübernahme des Baath gab es zunächst Zuckerbrot: Kurdisch an Schulen, eine Universität in Sulaimaniya, Newroz als Feiertag. Am <strong>11. März 1970</strong> unterzeichneten Barzani und Saddam Husain ein Abkommen: Kurdisch als offizielle Sprache, Teilhabe an der Regierung, Selbstverwaltung: Elemente einer echten <strong>Autonomie</strong>. Doch Bagdad hielt sich nicht daran; auf Barzani wurden Anschläge verübt. Das Muster wiederholte sich immer wieder: <strong>Jede neue Regierung hofierte die Kurden; sass sie fest im Sattel, liess sie sie fallen.</strong> Das Autonomiegesetz von 1974 lehnten die Kurden ab; es kam zum Krieg. Die Kurden waren stark im Guerillakrieg, hatten aber keine schweren Waffen; der Schah von Iran dosierte seine Hilfe genau. Im <strong>März 1975</strong> einigten sich Iran und Irak in Algier über die Grenze im Schatt al-Arab. Im Gegenzug stellte Iran die Hilfe ein. Der kurdische Kampf brach <strong>sofort zusammen</strong>; über 100&thinsp;000 Menschen zogen nach Iran. Danach: zerstörte Dörfer, Umsiedlungen, Arabisierung.',
glossary:[{kw:'Abkommen',tr:'peyman'},{kw:'Autonomie',tr:'xweserî'},{kw:'Verrat',tr:'xiyanet'},{kw:'Flüchtling',tr:'penaber'}],
wb:[{w:'Baath',e:'arabisch-nationalistische Partei, die in Irak und Syrien herrschte'},{w:'Guerillakrieg',e:'Kleinkrieg aus dem Hinterhalt statt offener Schlachten'},{w:'Arabisierung',e:'Politik, ein Gebiet arabischer zu machen: Sprache, Namen, Bevölkerung'}],
questions:[{q:'Was versprach das Abkommen vom März 1970?',correct:'Kurdisch als offizielle Sprache und Selbstverwaltung, es wurde aber nicht umgesetzt',wrong:['Die Unabhängigkeit Kurdistans','Den Anschluss an Iran','Die Abschaffung der Steuern'],kurmanji:'xweserî = Autonomie'},{q:'Warum brach der kurdische Kampf 1975 zusammen?',correct:'Iran stellte nach dem Abkommen von Algier seine Unterstützung ein',wrong:['Die Kurden hatten keine Kämpfer mehr','Barzani wechselte zu Saddam','Die UNO verbot den Kampf'],kurmanji:'penaber = Flüchtling'}],

{title:'Anfal und Halabdscha',
text:'Im Iran-Irak-Krieg (1980–1988) unterstützte ein Teil der irakischen Kurden Iran. Bagdad vergalt dies mit brutaler Gewalt: Ganze Dörfer wurden dem Erdboden gleichgemacht, Massenverhaftungen und Folter waren an der Tagesordnung. Im <strong>März 1988</strong> setzte das Regime in <strong>Halabdscha Giftgas</strong> gegen die Bevölkerung ein. Rund <strong>5000 Menschen, überwiegend Zivilisten, starben</strong>. Halabdscha ist wie Srebrenica zum Synonym für einen Massenmord an der Zivilbevölkerung geworden. Die <strong>«Operation Anfal»</strong> ging weiter: Wer den Angriffen entkam, wurde umzingelt, in Sammellager transportiert oder umgebracht, Kinder nicht ausgenommen. Die Zahl der Toten wird auf <strong>150&thinsp;000 bis 200&thinsp;000</strong> geschätzt; Human Rights Watch stufte die Kampagnen als Genozid ein. Die internationale Gemeinschaft schwieg weitgehend, weil der Irak im Krieg gegen Iran vom Westen unterstützt wurde. Auch deutsche Firmen wurden beschuldigt, Substanzen zur Herstellung chemischer Waffen geliefert zu haben.',
glossary:[{kw:'Halabdscha',tr:'Helebce'},{kw:'Giftgas',tr:'gaza jehrî'},{kw:'Erinnerung',tr:'bîranîn'},{kw:'Gerechtigkeit',tr:'edalet'}],
wb:[{w:'Genozid',e:'Völkermord: die gezielte Vernichtung einer Volksgruppe'},{w:'Regime',e:'Herrschaftssystem; oft abwertend für eine Diktatur'},{w:'Sammellager',e:'Lager, in das Menschen zwangsweise gebracht werden'},{w:'Synonym',e:'Wort, das für etwas anderes steht und dasselbe bedeutet'}],
questions:[{q:'Was geschah im März 1988 in Halabdscha?',correct:'Ein Giftgasangriff tötete rund 5000 Menschen, überwiegend Zivilisten',wrong:['Eine Schlacht zwischen PUK und DPK','Ein Erdbeben','Die Stadt wurde unabhängig'],kurmanji:'Helebce = Halabdscha'},{q:'Wie reagierte die internationale Gemeinschaft auf Anfal?',correct:'Sie schwieg weitgehend, denn der Irak wurde im Krieg gegen Iran vom Westen unterstützt',wrong:['Mit einer sofortigen Militärintervention','Mit der Anerkennung Kurdistans','Mit einem Olympia-Boykott'],kurmanji:'edalet = Gerechtigkeit'}],
task:{type:'parent',text:'Anfal und Halabdscha sind für viele Familien aus dem irakischen Kurdistan Teil der eigenen Geschichte. Wenn deine Eltern darüber sprechen möchten: Was haben sie damals erlebt oder gehört? Es ist auch in Ordnung, wenn sie nicht darüber sprechen wollen.'}},

{title:'1991 bis heute: Autonomie und De-facto-Staat',
text:'Nach dem Kuwait-Krieg 1991 entlud sich die Wut der Bevölkerung in einem <strong>Aufstand</strong>. Sogar die regierungstreuen Dschahsch-Milizen wechselten die Seite. Auf die Niederschlagung folgte eine Massenflucht in die Türkei und nach Iran. Mit UN-Resolution 688 wurde eine <strong>Sicherheitszone nördlich des 36. Breitengrads</strong> eingerichtet: Zum ersten Mal erreichte ein kurdisches Gebiet eine international geduldete Autonomie. 1992 wählten die Kurden ein Parlament; DPK und PUK teilten alles im Proporz, was Klientelismus förderte und Mitte der neunziger Jahre in einen <strong>Bruderkrieg</strong> mündete, der erst 1998 in Washington beigelegt wurde. Nach dem Sturz Saddam Husains 2003 gehörten die Kurden zu den Gewinnern: <strong>Dschalal Talabani wurde Staatspräsident des Irak, Masud Barzani Präsident der Region Kurdistan</strong>. Es folgten Wirtschaftsboom, aber auch Korruption, gegen die die Bewegung Goran antrat. Ab 2014 wurden die <strong>Peschmerga</strong> im Kampf gegen den IS zum Bollwerk; Deutschland lieferte Waffen, die Region nahm weit über eine Million Flüchtlinge und Vertriebene auf.',
glossary:[{kw:'Aufstand',tr:'serhildan'},{kw:'Flucht',tr:'revîn'},{kw:'Regierung',tr:'hikûmet'},{kw:'Zukunft',tr:'pêşeroj'}],
wb:[{w:'UN-Resolution',e:'offizieller Beschluss des UNO-Sicherheitsrats'},{w:'Proporz',e:'Ämter werden nach festem Schlüssel zwischen Parteien verteilt'},{w:'Klientelismus',e:'Politiker versorgen ihre Anhänger mit Posten und Geld und erhalten dafür Loyalität'},{w:'Bollwerk',e:'starke Schutzmauer; hier im übertragenen Sinn: wichtigste Verteidigung'}],
questions:[{q:'Was entstand 1991 unter internationalem Schutz?',correct:'Eine Sicherheitszone, der Beginn der kurdischen Autonomie im Nordirak',wrong:['Ein unabhängiger Staat Kurdistan','Eine türkische Provinz','Eine UN-Kolonie'],kurmanji:'serhildan = Aufstand'},{q:'Welche Rolle spielten die Kurden ab 2014?',correct:'Die Peschmerga wurden zum Bollwerk gegen den IS und international unterstützt',wrong:['Sie verbündeten sich mit dem IS','Sie verliessen den Irak','Sie kämpften gegen die UNO'],kurmanji:'pêşmerge = Peschmerga'}],

{id:'iran-syrien',title:'Iran, Syrien und Mahabad',desc:'Simko, die Republik Mahabad, Rojava: Kurden in den Nachbarländern',
sections:[
{title:'Simko und die Schikak',
text:'Nach dem Ersten Weltkrieg herrschte in Iran Chaos: Die Qadscharen-Dynastie war schwach, fremde Truppen standen im Land. In Kurdistan stieg <strong>Ismail Aga</strong> auf, von den Angehörigen seines Stammes, den <strong>Schikak, Simko genannt</strong>. Er gebot über das Gebiet westlich des Urmiya-Sees und erreichte in den zwanziger Jahren eine weitgehende Selbständigkeit, gestärkt durch die Allianz mit dem Naqschbandi-Scheich Taha. Mal erhielt er Waffen von den Kemalisten, mal verhandelte er mit den Briten. Im Februar 1921 ergriff <strong>Reza Chan</strong> in Teheran die Macht; im Sommer 1922 wurde Simko besiegt und floh. 1924 begnadigt, war er bald wieder obenauf. Später schreckte der Staat vor seiner Liquidierung nicht zurück. Simko blieb im Kern ein <strong>Stammeschef und Abenteurer</strong>: Der Zulauf schwand, sobald sich Misserfolge einstellten, und selbst unter den Clanen der Schikak hatte er Gegner. Seine Geringschätzung der städtischen Kultur machte ihn blind für die Schwächen der reinen Stammesbasis.',
glossary:[{kw:'Aga',tr:'axa'},{kw:'Stamm',tr:'eşîr'},{kw:'Urmiya-See',tr:'Gola Wirmê'},{kw:'Macht',tr:'hêz'}],
wb:[{w:'Liquidierung',e:'verhüllendes Wort für gezielte Tötung'},{w:'begnadigen',e:'jemandem die Strafe erlassen'},{w:'Geringschätzung',e:'etwas oder jemanden für wenig wert halten'}],
questions:[{q:'Wer war Simko?',correct:'Ismail Aga, Führer des Schikak-Stammes westlich des Urmiya-Sees',wrong:['Ein persischer Schah','Ein britischer Offizier','Ein armenischer Händler'],kurmanji:'axa = Aga'},{q:'Warum verlor Simko immer wieder an Macht?',correct:'Seine Stammesbasis war unbeständig, bei Misserfolgen fielen die Anhänger ab',wrong:['Er hatte kein Geld','Er sprach kein Kurdisch','Er lebte im Ausland'],kurmanji:'hêz = Macht'}],
task:null},

{title:'Reza Schah: Zentralisierung und Stämme',
text:'Wie Mustafa Kemal in der Türkei unternahm <strong>Reza Schah Pahlawi</strong> (ab 1925) den Versuch einer sprachlichen und kulturellen Homogenisierung. Am dringlichsten war die <strong>Zentralisierung</strong>: die Unterdrückung der tribalen Autonomie und die Beschränkung des Nomadismus. Die Stämme wurden <strong>entwaffnet</strong>, an den Grenzen am schwierigsten, denn Waffen liessen sich in den Irak schaffen und wieder abholen. Weitere Mittel: Umsiedlungen, Konfiskation von Herden, Beschränkung der Weidewanderungen. Das traf nicht nur das Stammesleben, sondern auch die Wirtschaft: In Städten, die von den Lieferungen der viehzüchtenden Stämme abhingen, kam es zu <strong>Versorgungsengpässen</strong>. Gegen Ende der dreissiger Jahre, fast zeitgleich mit der Türkei, waren die Kurden in Iran weitgehend unterworfen. Die Macht der Stammesführer beruhte nun vor allem auf Landbesitz und guten Verbindungen nach Teheran. Die Grenze blieb ein doppeltes Spiel: Iran und die Briten gewährten gegenseitig den Rebellen der anderen Seite Asyl.',
glossary:[{kw:'Schah',tr:'şah'},{kw:'Nomade',tr:'koçer'},{kw:'Herde',tr:'kerî'},{kw:'Grenze',tr:'sînor'}],
wb:[{w:'Homogenisierung',e:'alle gleich machen wollen: eine Sprache, eine Kultur, ein Volk'},{w:'Konfiskation',e:'staatliche Beschlagnahmung von Eigentum'},{w:'Nomadismus',e:'Leben ohne festen Wohnsitz, mit den Herden umherziehend'}],
questions:[{q:'Was war das dringlichste Ziel Reza Schahs?',correct:'Zentralisierung: tribale Autonomie unterdrücken, Nomadismus beschränken',wrong:['Die Förderung der Stämme','Der Beitritt zum Völkerbund','Die Einführung des Kurdischen als Amtssprache'],kurmanji:'koçer = Nomade'},{q:'Welche Folge hatte die Konfiskation der Herden?',correct:'Versorgungsengpässe in den Städten, die von den Stämmen beliefert wurden',wrong:['Mehr Fleischexporte','Sinkende Preise','Bessere Strassen'],kurmanji:'kerî = Herde'}],
task:{type:'reflect',text:'Türkei und Iran gingen in den dreissiger Jahren fast gleichzeitig und mit ähnlichen Mitteln gegen die Kurden vor: Entwaffnung, Umsiedlung, Sprachpolitik. Zufall oder System? Was hatten die neuen Nationalstaaten gemeinsam?'}},

{title:'Komala und die Republik Mahabad',
text:'Im Zweiten Weltkrieg besetzten britische und sowjetische Truppen Iran; Reza Schah musste abdanken. In diesem Machtvakuum gründete eine Gruppe von Beamten, Lehrern, Kleinhändlern und Offizieren in Mahabad die geheime <strong>«Gesellschaft zur Wiedererweckung Kurdistans» (Komala, 1942)</strong> mit der Zeitschrift <em>Nischtiman</em> («Heimat»). 1944 trafen sich kurdische Aktivisten aus Iran, Irak und der Türkei am Berg Dalanpur; eine Karte Gross-Kurdistans wurde 1945 sogar der UNO-Gründungsversammlung vorgelegt. Eine kurdische Oper (eine Mutter als Symbol der Heimat, drangsaliert von drei fremden Männern) stiftete Gemeinschaftsgefühl. Im Herbst 1945 wurde die Komala, nicht ohne sowjetisches Zutun, in die <strong>DPKI</strong> umgewandelt. Am <strong>22. Januar 1946 rief Qadi Muhammad die «Republik Kurdistan»</strong> in Mahabad aus, auf dem Kopf einen Turban, am Leib eine Uniform sowjetischen Stils. Kurdisch wurde offizielle Sprache, eine Druckerei eingerichtet. Barzani stand mit rund tausend Kämpfern bereit; in Mahabad wurde 1946 sein Sohn <strong>Masud</strong> geboren.',
glossary:[{kw:'Mahabad',tr:'Mehabad'},{kw:'Heimat',tr:'nîştiman'},{kw:'Republik',tr:'komar'},{kw:'Mutter',tr:'dayik'}],
wb:[{w:'Machtvakuum',e:'niemand hat die Kontrolle, es entsteht Raum für neue Kräfte'},{w:'Aktivist',e:'jemand, der sich aktiv für eine politische Sache einsetzt'},{w:'geheime Gesellschaft',e:'Organisation, die im Verborgenen arbeitet, weil sie verboten wäre'}],
questions:[{q:'Wann wurde die Republik Kurdistan in Mahabad ausgerufen?',correct:'Am 22. Januar 1946 durch Qadi Muhammad',wrong:['1923 durch Atatürk','1958 durch Qasim','1979 durch Chomeini'],kurmanji:'komar = Republik'},{q:'Was waren die wichtigsten Leistungen der Republik?',correct:'Kulturelle: Kurdisch als offizielle Sprache, Schulen, eine kurdische Druckerei',wrong:['Militärische Eroberungen bis Bagdad','Der Bau von Fabriken','Ein Bündnis mit den USA'],kurmanji:'nîştiman = Heimat'}],
task:{type:'parent',text:'Die Republik Mahabad ist ein grosses Symbol kurdischer Geschichte. Frage deine Eltern: Kennen sie Lieder, Bilder oder Geschichten über Mahabad und Qadi Muhammad?'}},

{title:'Das Ende von Mahabad',
text:'Die Republik war kleiner, als der Name vermuten lässt: praktisch ein <strong>Stadtstaat</strong> und zugleich ein Ableger der von den Sowjets geschützten Aserbaidschanischen Volksregierung. Die Sowjets unterstützten nur halbherzig: Es gab eine Druckpresse und Uniformen, aber <strong>so gut wie keine der versprochenen Waffen</strong>. Militärisch hing die Regierung von den Stämmen ab, die stärker waren als ihre kleine Armee, eine problematische Abhängigkeit; die reichen Bazar-Händler blieben reserviert. Im Frühjahr 1946 erhielt die Sowjetunion die geforderten <strong>Ölkonzessionen</strong> und zog ihre Truppen ab. Damit fiel der Schutzschirm: Im <strong>Dezember 1946 wurde Mahabad kampflos eingenommen</strong>; Qadi Muhammad wurde verhaftet und im <strong>März 1947 hingerichtet</strong>. Barzani schlug sich mit seinen Leuten in die Sowjetunion durch. Mahabad wird oft als einziger kurdischer Staat der Geschichte bezeichnet. Die Charakterisierung ist ungenau, doch als <strong>Symbol</strong> wirkt die kurze Republik bis heute.',
glossary:[{kw:'Ende',tr:'dawî'},{kw:'Gefängnis',tr:'zindan'},{kw:'Held',tr:'leheng'},{kw:'Erinnerung',tr:'bîr'}],
wb:[{w:'Konzession',e:'staatliche Erlaubnis, z.B. das Recht, Öl zu fördern'},{w:'Stadtstaat',e:'Staat, der nur aus einer Stadt und ihrer Umgebung besteht'},{w:'Bazar',e:'traditioneller orientalischer Markt; Bazar-Händler waren einflussreiche Kaufleute'}],
questions:[{q:'Warum fiel die Republik Mahabad?',correct:'Die Sowjetunion zog nach Erhalt der Ölkonzessionen ihre Truppen ab, der Schutz fiel weg',wrong:['Die Türkei marschierte ein','Eine Hungersnot brach aus','Barzani stürzte Qadi Muhammad'],kurmanji:'dawî = Ende'},{q:'Was geschah mit Qadi Muhammad?',correct:'Er wurde verhaftet und im März 1947 hingerichtet',wrong:['Er floh nach Europa','Er wurde Schah von Iran','Er regierte bis 1979'],kurmanji:'zindan = Gefängnis'}],
task:{type:'reflect',text:'Die Republik Mahabad bestand kein ganzes Jahr und ist trotzdem das wichtigste Symbol kurdischer Staatlichkeit. Warum können auch «gescheiterte» Ereignisse so viel Kraft für spätere Generationen haben?'}},

{title:'Die Islamische Republik und die DPKI',
text:'Den Sturz des Schahs 1979 begrüssten viele Kurden, der Islamischen Republik gegenüber blieben sie skeptisch. Bei einem Treffen verlangte Chomeini von Scheich Hoseini «Sicherheit und Stabilität in Kurdistan»; Hoseini erwiderte: «In Ordnung, aber ich verlange die <strong>Autonomie Kurdistans</strong> von Ihnen.» Es kam zu Kämpfen mit den Revolutionsgarden (<em>pasdaran</em>). Die neue Verfassung lehnte das Konzept ethnischer Minderheiten ab; ihre schiitische Prägung grenzte die sunnitischen Kurden zusätzlich aus. Die <strong>DPKI</strong> unter <strong>Abdul-Rahman Qasemlu</strong>, einem in Prag promovierten Sozialwissenschaftler, vertrat seit 1973 den Slogan: <strong>«Demokratie für Iran, Autonomie für Kurdistan»</strong>. Im Iran-Irak-Krieg wurde sie zerrieben. Als Qasemlu nach Kriegsende Gespräche mit Teheran aufnahm, wurde er <strong>1989 in Wien ermordet</strong>; sein Nachfolger Scharafkindi 1992 in Berlin. Das «Mykonos»-Urteil stellte fest, dass iranische Behörden die Morde angeordnet hatten. Bis heute wechseln Repression und vorsichtige Hoffnung, etwa unter den Präsidenten Chatami und Rohani.',
glossary:[{kw:'Demokratie',tr:'demokrasî'},{kw:'Autonomie',tr:'xweserî'},{kw:'Recht',tr:'maf'},{kw:'Sicherheit',tr:'ewlehî'}],
wb:[{w:'Verfassung',e:'Grundgesetz eines Staates'},{w:'Revolutionsgarden',e:'eigene Armee der Islamischen Republik Iran (pasdaran)'},{w:'promoviert',e:'hat an einer Universität den Doktortitel erworben'},{w:'ethnisch',e:'eine Volksgruppe betreffend'}],
questions:[{q:'Was war der Slogan der DPKI unter Qasemlu?',correct:'«Demokratie für Iran, Autonomie für Kurdistan»',wrong:['«Unabhängigkeit oder Tod»','«Ein Volk, ein Reich»','«Alle Macht den Räten»'],kurmanji:'xweserî = Autonomie'},{q:'Wie endeten Qasemlus Verhandlungsversuche?',correct:'Er wurde 1989 in Wien ermordet, die Spur führte nach Teheran',wrong:['Mit einem Autonomieabkommen','Er wurde Präsident Irans','Er zog sich ins Privatleben zurück'],kurmanji:'maf = Recht'}],
task:null},

{title:'Syrien: Staatenlose im eigenen Land',
text:'In Syrien leben schätzungsweise 1,2 bis 1,5 Millionen Kurden (8 bis 10% der Bevölkerung), vor allem in der <strong>Dschazira</strong> im Nordosten, der Kornkammer des Landes, sowie in Damaskus und Aleppo. Unter dem französischen Mandat zeitweise gefördert, gerieten sie mit dem Aufstieg des Panarabismus unter Druck. 1962 wurde in der Provinz al-Hasaka ein Sonderzensus durchgeführt: <strong>Zehntausende Kurden verloren die Staatsangehörigkeit</strong> und galten fortan als <em>adschanib</em>, «Fremde» im eigenen Land: ohne Wahlrecht, ohne staatsbürgerliche Rechte, ohne Anspruch auf medizinische Versorgung. Kurdische Schulen waren verboten, kurdische Bücher durften nicht gedruckt, kurdische Namen nicht registriert werden; entlang der türkischen Grenze wurden gezielt arabische Dörfer angesiedelt. Ab den achtzigern duldete das Regime die <strong>PKK</strong> im Land: Kampf für Kurden anderswo statt Rechte für die eigenen. Erst im <strong>April 2011</strong>, zu Beginn des Aufstands, wurde das Gesetz aufgehoben und der Status von Hunderttausenden legalisiert: Assad wollte die Kurden ruhigstellen.',
glossary:[{kw:'Fremder',tr:'biyanî'},{kw:'Pass',tr:'pasaport'},{kw:'Verbot',tr:'qedexe'},{kw:'Bürger',tr:'hemwelatî'}],
wb:[{w:'Zensus',e:'Volkszählung'},{w:'Panarabismus',e:'Idee, alle Araber in einem grossen Staat zu vereinen'},{w:'legalisieren',e:'etwas rechtlich erlauben und gültig machen'}],
questions:[{q:'Was bedeutete der Status adschanib?',correct:'«Fremde» im eigenen Land, ohne Wahlrecht und staatsbürgerliche Rechte',wrong:['Ein Adelstitel','Eine Steuerbefreiung','Doppelte Staatsbürgerschaft'],kurmanji:'biyanî = Fremder'},{q:'Warum hob Assad das Gesetz im April 2011 auf?',correct:'Er wollte die Kurden zu Beginn des Aufstands ruhigstellen',wrong:['Die UNO zwang ihn dazu','Aus Überzeugung für Minderheitenrechte','Die Türkei verlangte es'],kurmanji:'hemwelatî = Bürger'}],
task:{type:'reflect',text:'Stell dir vor, du bist im Land geboren, darfst aber weder wählen noch einen Pass besitzen, wie die adschanib in Syrien. Was würde das für deinen Alltag konkret bedeuten? Notiere drei Folgen.'}},

{title:'Rojava und der Bürgerkrieg',
text:'Nach Ausbruch des Bürgerkriegs im Frühjahr 2011 zog sich die syrische Armee kampflos aus den kurdischen Gebieten zurück. In das Vakuum stiess die <strong>PYD</strong>, eine 2003 von PKK-nahen Kadern gegründete Partei. Im <strong>Januar 2014</strong> richtete sie eine autonome Verwaltung in den Kantonen <strong>Afrin, Kobane und Cizire</strong> ein. Die Region wird <strong>Rojava</strong> («West-Kurdistan») genannt. Ihre Volksverteidigungseinheiten <strong>YPG</strong> wurden weltberühmt durch die erfolgreiche <strong>Verteidigung von Kobane gegen den IS</strong> (September 2014 bis Februar 2015) und durch den Einsatz für die vom IS bedrohten Yeziden am Sindschar. Als verlässlichster Teil der Anti-IS-Koalition genossen die Kurden amerikanische Unterstützung, ein merkwürdiges Zweckbündnis, denn die Schwesterpartei PKK gilt in den USA als Terrororganisation. Die Türkei wiederum will ein zusammenhängendes Rojava verhindern. Innerkurdisch konkurriert die PYD mit dem Barzani-nahen Kurdischen Nationalrat. Klar ist: Ohne die Kurden sind Verhandlungen über Syriens Zukunft sinnlos.',
glossary:[{kw:'Rojava',tr:'Rojava (Westen)'},{kw:'Verteidigung',tr:'parastin'},{kw:'Volk',tr:'gel'},{kw:'Kobane',tr:'Kobanî'}],
wb:[{w:'Kanton',e:'selbstverwalteter Gebietsteil, wie die Kantone in der Schweiz'},{w:'Zweckbündnis',e:'Zusammenarbeit nur aus Nutzen, ohne gemeinsame Überzeugungen'},{w:'Koalition',e:'Bündnis mehrerer Staaten oder Parteien für ein gemeinsames Ziel'}],
questions:[{q:'Welche drei Kantone riefen 2014 ihre Autonomie aus?',correct:'Afrin, Kobane und Cizire',wrong:['Mosul, Erbil und Kirkuk','Damaskus, Aleppo und Homs','Diyarbakır, Van und Hakkari'],kurmanji:'Rojava = Westen'},{q:'Wodurch wurde die YPG weltweit bekannt?',correct:'Durch die Verteidigung von Kobane gegen den IS',wrong:['Durch ein Fussballturnier','Durch Ölexporte','Durch die Eroberung von Damaskus'],kurmanji:'parastin = Verteidigung'}],
task:{type:'parent',text:'Kobane war 2014/15 in allen Nachrichten. Frage deine Eltern: Wie haben sie diese Zeit erlebt? Hat der Krieg in Syrien oder im Irak Verwandte oder Bekannte eurer Familie betroffen?'}}

{id:'stamm',title:'Stamm, Familie und Gesellschaft',desc:'Mal, Eşiret, Haushalt: wie die kurdische Gesellschaft funktioniert',
sections:[
{title:'Mal, Qabile, Eşiret',
text:'Die Grundeinheit der kurdischen Stammesorganisation heisst <strong>mal</strong>. Das Wort bedeutet sowohl Haushalt als auch <em>lineage</em>: eine patrilineare Abstammungsgruppe, die sich auf einen realen oder fiktiven Vorfahren zurückführt. Die Zugehörigkeit zu einem Stamm wird über das mal definiert; je mehr Mitglieder ein mal hat, desto einflussreicher ist es. Die Zugehörigkeit verpflichtet: gemeinsam Weiderechte verteidigen, einander bei Hochzeiten beschenken, im Konfliktfall zusammenstehen. Mehrere mals bilden ein <strong>ocax oder qabile</strong> («Clan», in der Regel 4 bis 8 mals), zurückgeführt auf Brüder oder Vettern. Die höchste Stufe ist die <strong>eşiret</strong> («Stamm»): Ihr wichtigstes Kriterium ist die tatsächliche oder gemeinsam beanspruchte Abstammung, und <strong>allein die eşiret regelt die Nutzung der Weiderechte</strong>. Sie ist damit die einzige territorial festlegbare Einheit der Stammesorganisation. Daneben gab es immer auch Nichtstammesgruppen, etwa abhängige Bauern (<em>reaya</em>).',
glossary:[{kw:'Haushalt / Lineage',tr:'mal'},{kw:'Clan',tr:'qebîle'},{kw:'Stamm',tr:'eşîret'},{kw:'Familie',tr:'bavik'}],
wb:[{w:'patrilinear',e:'die Abstammung wird über die Linie der Väter gezählt'},{w:'fiktiv',e:'erfunden, nicht wirklich, aber von allen geglaubt'},{w:'territorial',e:'auf ein bestimmtes Gebiet bezogen'}],
questions:[{q:'Was bedeutet das kurdische Wort mal?',correct:'Haushalt und zugleich Abstammungsgruppe, die kleinste Einheit des Stammes',wrong:['Nur ein Gebäude','Eine Steuerart','Ein religiöses Fest'],kurmanji:'mal = Haushalt'},{q:'Was kann allein die eşiret regeln?',correct:'Die Nutzung der Weiderechte, sie ist die einzige territoriale Einheit',wrong:['Hochzeiten','Den Schulunterricht','Die Steuern des Staates'],kurmanji:'eşîret = Stamm'}],
task:{type:'parent',text:'Frage deine Eltern: Zu welchem mal, welcher qabile und welcher eşiret gehört eure Familie? Welche Namen kennen sie noch, und was bedeuten sie?'}},

{title:'Segmentäre Opposition und Führertypen',
text:'Die Stammesorganisation beruht auf dem Prinzip der <strong>segmentären Opposition</strong>: Brüder halten zusammen gegen die Vettern, alle Vettern gegen entferntere Verwandte, der ganze Stamm gegen andere Stämme, so die Idealvorstellung. In der Praxis ist das flexibler: Bei Konflikten entscheiden Nähe, Heiratsbeziehungen und das Geschick der Führer, wer sich mit wem verbündet; oft spalten sich Stämme in zwei Blöcke («links»/«rechts»). Auch die <strong>Führertypen</strong> hängen vom Verhältnis zum Staat ab: Wenn Stamm und Staat sich anerkennen, ist der Führer ein <strong>Vermittler</strong>, der Dispute schlichtet. Der <strong>«Bandit»</strong>, der seine Anhänger an Beutezügen beteiligt, entsteht, wenn der Staat stark genug ist, die Autonomie der Stämme zu verhindern, aber zu schwach, den Banditen festzusetzen. Neben den Agas standen religiöse Führer: <strong>Scheichs und Sayyids</strong>. Als im 19. Jahrhundert die kurdischen Fürsten (Mirs) abgeschafft wurden, füllten gerade die Scheichs das Machtvakuum, als Vermittler zwischen den streitenden Stämmen.',
glossary:[{kw:'Führer',tr:'serok'},{kw:'Aga',tr:'axa'},{kw:'Scheich',tr:'şêx'},{kw:'Streit',tr:'pevçûn'}],
wb:[{w:'segmentäre Opposition',e:'je nach Konflikt verbünden sich andere Gruppen: Brüder gegen Vettern, der Stamm gegen Fremde'},{w:'Disput',e:'Streit, Auseinandersetzung'},{w:'Panislamismus',e:'Politik, alle Muslime unter einer Führung zu vereinen'}],
questions:[{q:'Wann entsteht der «Bandit» als Führertyp?',correct:'Wenn der Staat stark genug ist, Stammesautonomie zu verhindern, aber zu schwach, den Banditen festzusetzen',wrong:['Wenn es keinen Staat gibt','Wenn der Stamm reich ist','Wenn der Führer studiert hat'],kurmanji:'serok = Führer'},{q:'Warum gewannen die Scheichs im 19. Jahrhundert an Macht?',correct:'Nach der Abschaffung der Mirs füllten sie als Vermittler das Machtvakuum',wrong:['Sie kauften sich die Macht','Die Briten ernannten sie','Sie besiegten die Osmanen im Krieg'],kurmanji:'şêx = Scheich'}],
task:{type:'reflect',text:'Scheich Said, Scheich Mahmud, die Barzanis: Auffallend viele kurdische Führer waren religiöse Scheichs. Warum hatten gerade religiöse Führer die Kraft, verfeindete Stämme zu vereinen?'}},

{title:'Haushalt und Familie',
text:'Das gemeinsame Wohnen im Haushalt ist die <strong>ideale Form des Zusammenlebens</strong> in der kurdischen Gesellschaft. Haushalte durchlaufen einen <strong>Zyklus</strong>: Nach der Heirat bleiben die Söhne mit ihren Frauen zunächst im Haushalt des Vaters, so entstehen Drei-Generationen-Familien. Irgendwann folgt die Teilung, auf Kurmandschi <strong><em>mal cud bûn</em></strong>, ein oft konfliktreicher, schmerzvoller Prozess, denn geteilt werden nicht nur Land, Haus und Vieh, sondern auch das soziale Kapital: Ruf und Ansehen. Die Teilung wird hinausgeschoben, wenn die Produktion viele Arbeitskräfte braucht, etwa für Heuernte und Viehwirtschaft. <strong>Frauen wechseln mit der Heirat den Haushalt</strong>. Ihre Mobilität knüpft und pflegt die Verwandtschaftsnetze zwischen Dörfern, Städten und sogar Ländern. Die durchschnittliche Haushaltsgrösse lag in der Türkei bei 4,8 Personen, in der GAP-Region bei 6, in Bergdörfern bis zu 10. In den Städten sind die Haushalte kleiner, aber oft kinderreiche Kernfamilien.',
glossary:[{kw:'Heirat',tr:'zewac'},{kw:'Haushalt getrennt',tr:'mal cud bûn'},{kw:'Bruder',tr:'bira'},{kw:'Frau',tr:'jin'}],
wb:[{w:'soziales Kapital',e:'Ansehen und Beziehungen, die einem im Leben weiterhelfen'},{w:'Kernfamilie',e:'nur Eltern und ihre Kinder'},{w:'Rentabilität',e:'ob sich etwas wirtschaftlich lohnt'}],
questions:[{q:'Was bedeutet mal cud bûn?',correct:'Die Teilung des Haushalts, ein konfliktreicher Prozess, bei dem auch Ansehen geteilt wird',wrong:['Eine Hochzeitsfeier','Der Bau eines neuen Hauses','Ein religiöses Fest'],kurmanji:'mal cud bûn'},{q:'Wann wird die Teilung eines Haushalts hinausgeschoben?',correct:'Wenn die Produktion viele Arbeitskräfte braucht, etwa für Heuernte und Vieh',wrong:['Wenn die Familie reich ist','Wenn der Staat es verbietet','Im Winter'],kurmanji:'bira = Bruder'}],
task:{type:'parent',text:'Frage deine Eltern oder Grosseltern: Wie gross war der Haushalt, in dem sie aufgewachsen sind? Wer wohnte alles unter einem Dach? Vergleiche es mit eurer Familie heute.'}},

{title:'Nomaden, zoma und die Viehwirtschaft',
text:'Die wichtigste Existenzgrundlage vieler kurdischer Gebiete war die <strong>seminomadische Weidewirtschaft</strong>, ergänzt durch Getreide- und Gartenanbau: im Sommer auf der Bergweide, im Winter im Dorf. Die Sommersiedlung heisst <strong>zoma</strong> (auch <em>zozan</em>, türkisch <em>yayla</em>); die Weiden werden vom Stamm gemeinsam genutzt, die Stammeszugehörigkeit sichert das Nutzungsrecht, vererbt vom Vater auf den Sohn. zoma-Gruppen sind flexibel und spiegeln die sozialen Allianzen: Im Dorf Sisin spaltete ein Konflikt um einen Brautraub die Gemeinschaft in neue zoma-Gruppen. Seit den achtziger Jahren erlebt diese Lebensform einen <strong>raschen Niedergang</strong>: Urbanisierung und Modernisierung untergruben die Grundlagen; Förderung blieb aus; die schärfere <strong>Grenzkontrolle</strong> beendete den einträglichen Viehhandel mit Irak und Iran; und das <strong>Weideverbot</strong> im Konflikt mit der PKK stürzte die Viehwirtschaft in die Krise. Tiere haben heute oft eher die Funktion einer Absicherung: Bei einer Hochzeit oder in der Not wird verkauft.',
glossary:[{kw:'Bergweide',tr:'zozan'},{kw:'Kleinvieh',tr:'pez'},{kw:'Sommer',tr:'havîn'},{kw:'Winter',tr:'zivistan'}],
wb:[{w:'seminomadisch',e:'halb sesshaft: im Sommer mit den Herden unterwegs, im Winter im Dorf'},{w:'Existenzgrundlage',e:'das, wovon eine Familie lebt'},{w:'Brautraub',e:'Entführung einer Frau zur Heirat, oft Auslöser schwerer Konflikte'}],
questions:[{q:'Was ist eine zoma?',correct:'Eine Sommer-Weidesiedlung in den Bergen',wrong:['Ein Wintervorrat','Ein Hochzeitsbrauch','Eine Steuer'],kurmanji:'zozan = Bergweide'},{q:'Warum ging die Viehwirtschaft seit den achtziger Jahren zurück?',correct:'Weideverbot im Konflikt, Grenzkontrollen und fehlende Förderung',wrong:['Die Schafe starben an einer Seuche aus','Fleisch wurde verboten','Die Berge wurden verkauft'],kurmanji:'pez = Kleinvieh'}],
task:null},

{title:'GAP und die Debatte um die Unterentwicklung',
text:'Das <strong>Südost-Anatolien-Projekt (GAP)</strong> ist ein gigantisches Bewässerungs- und Energieprojekt in acht Provinzen: über 75&thinsp;000 Quadratkilometer, fast 10% der Türkei, grösser als Belgien, Dänemark, die Niederlande und Luxemburg zusammen. Ziel: das <strong>West-Ost-Gefälle</strong> abbauen. Doch die Zahlen blieben krass: 1996 betrug das jährliche Pro-Kopf-Einkommen in der Türkei 2138 Dollar, <strong>in Diyarbakır 283 Dollar</strong>; fast die Hälfte der Haushalte lag unter dem Mindestlohn. Warum? Der Soziologe <strong>Besikçi</strong> sah eine gezielte Unterdrückung der Kurden als ethnische Gruppe. Kritiker hielten dagegen: Kapitalistische Entwicklung verlaufe ohne Rücksicht auf Ethnizität ungleich, und auch <strong>kurdische Eliten</strong> (Agas, Scheichs, Grossgrundbesitzer) profitierten von der Ausbeutung. Der Soziologe Özer, der selbst im GAP arbeitete, meinte: Die Regierungen hätten die Industrialisierung der Region <strong>bewusst gebremst</strong>, weil sie den kurdischen Nationalismus hätte stärken können; die Gewinne der Energieerzeugung wurden nicht in der Region reinvestiert.',
glossary:[{kw:'Wasser',tr:'av'},{kw:'Staudamm',tr:'bendav'},{kw:'Armut',tr:'feqîrî'},{kw:'Arbeit',tr:'kar'}],
wb:[{w:'West-Ost-Gefälle',e:'grosser Unterschied in Wohlstand und Entwicklung zwischen Westen und Osten des Landes'},{w:'Pro-Kopf-Einkommen',e:'durchschnittliches Einkommen pro Person'},{w:'Soziologe',e:'Wissenschaftler, der die Gesellschaft erforscht'},{w:'Elite',e:'kleine, mächtige Führungsschicht'}],
questions:[{q:'Was ist das GAP?',correct:'Ein riesiges Bewässerungs- und Energieprojekt in Südost-Anatolien',wrong:['Eine kurdische Partei','Ein Militärbündnis','Ein Schulreform-Programm'],kurmanji:'av = Wasser'},{q:'Worüber stritten Besikçi und seine Kritiker?',correct:'Ob ethnische Unterdrückung oder kapitalistische Entwicklung die Armut des Ostens erklärt',wrong:['Über die Schreibweise des Kurdischen','Über die Hauptstadt Kurdistans','Über Fussballresultate'],kurmanji:'feqîrî = Armut'}],
task:{type:'reflect',text:'Ist eine Region arm, weil sie vernachlässigt wird, oder wird sie vernachlässigt, weil dort eine Minderheit lebt? Welche Argumente aus dem Text sprechen für welche Sicht? Wo stehst du?'}},

{title:'Migration und Verstädterung',
text:'Seit den fünfziger Jahren wandern Menschen vom Land in die Städte; ab den achtziger Jahren beschleunigte sich die Bewegung dramatisch. Nach 1990 änderten sich die Gründe: In Diyarbakır nannte fast die <strong>Hälfte der zwangsmigrierten Haushalte den Krieg</strong> als Grund. Die Städte wurden dabei weniger zum Gegenpol des Dorflebens als zu dessen <strong>Fortsetzung</strong>: Verwandtschaft und <strong>hemşerilik</strong>, die Verbundenheit von Menschen aus demselben Herkunftsort, organisieren Wohnen und Arbeit; neben dem Hochhaus steht der traditionelle Backofen (<em>tandır</em>). Die Städte des Südostens sind oft <strong>Sprungbretter</strong> für die Weiterwanderung nach Istanbul, Izmir oder Mersin. Die Mehrheit der Kurden lebt aber weiterhin im Osten und Südosten. Wichtigster Grund für den Umzug ist die Hoffnung auf <strong>soziale Mobilität durch Bildung</strong>. Zugleich bleibt die Bindung an die Familie zentral: Wer aufsteigen will, kann es sich kaum leisten, die Verpflichtungen gegenüber Verwandten ganz abzulegen.',
glossary:[{kw:'Stadt',tr:'bajar'},{kw:'Wanderung',tr:'koçberî'},{kw:'Nachbar',tr:'cîran'},{kw:'Bildung',tr:'perwerde'}],
wb:[{w:'Zwangsmigration',e:'Menschen müssen ihre Heimat unfreiwillig verlassen'},{w:'soziale Mobilität',e:'Aufstieg (oder Abstieg) in der Gesellschaft, z.B. durch Bildung'},{w:'informell',e:'ohne offizielle Regeln oder Verträge'}],
questions:[{q:'Was bedeutet hemşerilik?',correct:'Die Verbundenheit von Menschen aus demselben Herkunftsort, die Basis für Wohnen und Arbeit in der Stadt',wrong:['Eine Sportart','Ein Steuergesetz','Ein religiöses Amt'],kurmanji:'koçberî = Wanderung'},{q:'Wie änderten sich die Migrationsgründe nach 1990?',correct:'Krieg und Vertreibung wurden zum Hauptgrund der Migration',wrong:['Alle zogen wegen des Klimas um','Es gab keine Migration mehr','Nur Reiche wanderten aus'],kurmanji:'bajar = Stadt'}],
task:{type:'parent',text:'Auch eure Familie hat Migration erlebt. Frage deine Eltern: Wer hat beim Ankommen am neuen Ort geholfen? Gab es Verwandte oder Landsleute (so etwas wie hemşerilik), die wichtig waren?'}}
]}
