<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ════════════════════════════════════════════════════════════
       APP-TITEL ändere auch den <title> und die h1 unten
  ════════════════════════════════════════════════════════════ -->
  <title>App-Name — Lernlust</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ══════════════════════════════════════════════════════════
       DESIGN-SYSTEM — diese Variablen NICHT ändern, damit alle
       Lernlust-Apps gleich aussehen.
    ══════════════════════════════════════════════════════════ */
    :root {
      --primary:   #FF6B6B;   /* Korallenrot   — Hauptaktionen   */
      --secondary: #4ECDC4;   /* Türkis        — Sekundär        */
      --accent:    #FFE66D;   /* Goldgelb      — Hervorhebung    */
      --success:   #95E1A3;   /* Mintgrün      — Richtig/Erfolg  */
      --danger:    #FF8B94;   /* Lachsrot      — Falsch/Warnung  */
      --purple:    #C3A6FF;   /* Lila          — Extra/Info      */

      --bg-light:  #FFF9F0;   /* Warmes Creme  — Seitenhintergrund */
      --bg-card:   #FFFFFF;   /* Weiss         — Karten          */
      --text-dark: #2D3436;   /* Fast Schwarz  — Fliesstext      */
      --text-muted:#636E72;   /* Grau          — Sekundärtext    */

      --shadow:       0 8px 32px rgba(0,0,0,0.10);
      --shadow-hover: 0 12px 48px rgba(0,0,0,0.15);
      --radius:    24px;
      --radius-sm: 16px;
      --radius-xs: 10px;
    }

    /* ── Reset & Base ───────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Animierter Hintergrund (immer behalten) ────────────── */
    .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bg-shape {
      position: absolute; border-radius: 50%;
      animation: float 18s ease-in-out infinite;
    }
    .bg-shape:nth-child(1) {
      width: 400px; height: 400px; top: -100px; right: -80px;
      background: radial-gradient(circle, rgba(255,107,107,0.15), transparent 70%);
    }
    .bg-shape:nth-child(2) {
      width: 350px; height: 350px; bottom: 10%; left: -100px;
      background: radial-gradient(circle, rgba(78,205,196,0.15), transparent 70%);
      animation-delay: -7s;
    }
    .bg-shape:nth-child(3) {
      width: 300px; height: 300px; top: 40%; right: 10%;
      background: radial-gradient(circle, rgba(255,230,109,0.18), transparent 70%);
      animation-delay: -13s;
    }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(20px,-25px) scale(1.04); }
      66%      { transform: translate(-15px,15px) scale(0.97); }
    }

    /* ── Haupt-Container ────────────────────────────────────── */
    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Header / Titel ─────────────────────────────────────── */
    .header {
      text-align: center;
      padding: 20px 0 8px;
    }
    .header h1 {
      font-family: 'Fredoka', cursive;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 4px;
    }
    .header .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Fortschritts-/Punkte-Anzeige (optional) */
    .score-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }
    .score-chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--bg-card);
      padding: 6px 16px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: var(--shadow);
    }

    /* ── Karte (Haupt-Inhaltsfläche) ────────────────────────── */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }

    /* ── Frage / Aufgabe ────────────────────────────────────── */
    .task-label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .task-display {
      font-family: 'Fredoka', cursive;
      font-size: 2.6rem;
      font-weight: 600;
      color: var(--text-dark);
      text-align: center;
      padding: 24px 0;
      line-height: 1.2;
    }

    /* ── Antwort-Grid (Mehrfachauswahl) ─────────────────────── */
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .answer-btn {
      font-family: 'Fredoka', cursive;
      font-size: 1.5rem;
      font-weight: 600;
      padding: 18px 12px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      background: #f8f9fa;
      color: var(--text-dark);
      transition: all 0.2s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }
    .answer-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      background: #f0f0f0;
    }
    .answer-btn.correct  { background: var(--success); color: #1a5c2a; }
    .answer-btn.wrong    { background: var(--danger);  color: #8b0000; }
    .answer-btn:disabled { cursor: not-allowed; opacity: 0.7; }

    /* ── Eingabefeld ────────────────────────────────────────── */
    .input-row {
      display: flex; gap: 10px; margin-top: 16px;
    }
    .answer-input {
      flex: 1;
      font-family: 'Fredoka', cursive;
      font-size: 2rem;
      font-weight: 600;
      text-align: center;
      padding: 14px;
      border: 3px solid #e0e0e0;
      border-radius: var(--radius-sm);
      color: var(--text-dark);
      transition: border-color 0.2s;
    }
    .answer-input:focus   { outline: none; border-color: var(--primary); }
    .answer-input.correct { border-color: var(--success); background: #f0fff4; }
    .answer-input.wrong   { border-color: var(--danger);  background: #fff5f5; }

    /* ── Feedback-Box ───────────────────────────────────────── */
    .feedback {
      text-align: center;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 1.05rem;
      margin-top: 14px;
      display: none;
    }
    .feedback.correct { background: #e6fff0; color: #1a6b35; display: block; }
    .feedback.wrong   { background: #fff0f0; color: #9b2020; display: block; }

    /* ── Buttons ────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 14px 28px;
      border-radius: 50px; border: none; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-weight: 800;
      font-size: 1rem; transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--primary); color: white;
      box-shadow: 0 4px 16px rgba(255,107,107,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255,107,107,0.5); }
    .btn-secondary {
      background: var(--secondary); color: white;
      box-shadow: 0 4px 16px rgba(78,205,196,0.4);
    }
    .btn-secondary:hover { transform: translateY(-2px); }
    .btn-accent {
      background: var(--accent); color: var(--text-dark);
      box-shadow: 0 4px 16px rgba(255,230,109,0.5);
    }
    .btn-ghost { background: #f0f0f0; color: var(--text-dark); }
    .btn-ghost:hover { background: #e4e4e4; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .btn-full { width: 100%; }
    .btn-lg { padding: 18px 36px; font-size: 1.1rem; }

    /* ── Fortschrittsbalken ─────────────────────────────────── */
    .progress-bar {
      background: #e9ecef;
      border-radius: 50px;
      height: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 50px;
      transition: width 0.5s ease;
    }

    /* ── Abschluss-Screen ───────────────────────────────────── */
    .complete-screen {
      text-align: center;
      padding: 20px 0;
    }
    .complete-emoji {
      font-size: 5rem;
      display: block;
      margin-bottom: 16px;
      animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop {
      from { transform: scale(0) rotate(-15deg); opacity: 0; }
      to   { transform: scale(1) rotate(0);      opacity: 1; }
    }
    .complete-title {
      font-family: 'Fredoka', cursive;
      font-size: 2.4rem;
      color: var(--text-dark);
      margin-bottom: 8px;
    }
    .complete-sub { color: var(--text-muted); margin-bottom: 24px; }
    .stars-row {
      display: flex; justify-content: center; gap: 10px;
      margin-bottom: 24px;
    }
    .star {
      font-size: 2.4rem;
      opacity: 0;
      animation: starPop 0.4s ease forwards;
    }
    .star:nth-child(1) { animation-delay: 0.2s; }
    .star:nth-child(2) { animation-delay: 0.4s; }
    .star:nth-child(3) { animation-delay: 0.6s; }
    @keyframes starPop {
      from { opacity: 0; transform: scale(0) rotate(-20deg); }
      to   { opacity: 1; transform: scale(1) rotate(0); }
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 400px) {
      .card { padding: 20px 16px; }
      .task-display { font-size: 2rem; }
      .answer-btn { font-size: 1.3rem; padding: 14px 8px; }
    }
  </style>
</head>
<body>

  <!-- Hintergrund-Animationen (immer behalten) -->
  <div class="bg-shapes">
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
  </div>

  <div class="container">

    <!-- ════════════ HEADER ════════════════════════════════ -->
    <div class="header">
      <h1>🎯 App-Titel</h1>
      <p class="subtitle">Kurze Beschreibung was die App macht</p>

      <!-- Punkte/Fortschritt (optional – entfernen wenn nicht gebraucht) -->
      <div class="score-bar">
        <div class="score-chip">
          <span>⭐</span>
          <span id="score">0</span>
        </div>
        <div class="score-chip">
          <span>🔥</span>
          <span id="streak">0</span>
        </div>
      </div>
    </div>

    <!-- ════════════ SCREEN: AUFGABE ═══════════════════════ -->
    <div id="screen-task">

      <!-- Fortschrittsbalken -->
      <div class="progress-bar" style="margin-bottom: 4px;">
        <div class="progress-fill" id="progress" style="width: 0%;"></div>
      </div>
      <p style="text-align:right; font-size:0.82rem; color:var(--text-muted);" id="progress-label">1 / 10</p>

      <div class="card">
        <!-- Aufgaben-Label -->
        <div class="task-label">Aufgabe</div>

        <!-- ── VARIANTE A: Grosse Aufgaben-Anzeige ── -->
        <div class="task-display" id="task-display">
          3 + 4 = ?
        </div>

        <!-- ── VARIANTE B: Antwort per Eingabefeld ── -->
        <!--
        <div class="input-row">
          <input type="number" id="answer-input" class="answer-input" placeholder="?" min="0" max="999" autocomplete="off">
          <button class="btn btn-primary" id="btn-check">
            <i class="fa-solid fa-check"></i>
          </button>
        </div>
        -->

        <!-- ── VARIANTE C: Antwort per Buttons (Multiple Choice) ── -->
        <div class="answer-grid" id="answer-grid">
          <button class="answer-btn" onclick="checkAnswer(this, true)">7</button>
          <button class="answer-btn" onclick="checkAnswer(this, false)">6</button>
          <button class="answer-btn" onclick="checkAnswer(this, false)">8</button>
          <button class="answer-btn" onclick="checkAnswer(this, false)">5</button>
        </div>

        <!-- Feedback -->
        <div class="feedback" id="feedback"></div>

        <!-- Weiter-Button (erscheint nach Antwort) -->
        <button class="btn btn-primary btn-full btn-lg" id="btn-next"
          style="margin-top: 20px; display: none;" onclick="nextTask()">
          Weiter <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>

    <!-- ════════════ SCREEN: ABSCHLUSS ═════════════════════ -->
    <div id="screen-complete" style="display: none;">
      <div class="card">
        <div class="complete-screen">
          <span class="complete-emoji">🏆</span>
          <div class="complete-title">Super gemacht!</div>
          <p class="complete-sub">Du hast alle Aufgaben gelöst!</p>
          <div class="stars-row">
            <span class="star">⭐</span>
            <span class="star">⭐</span>
            <span class="star">⭐</span>
          </div>
          <button class="btn btn-primary btn-lg" onclick="restart()">
            <i class="fa-solid fa-rotate-right"></i> Nochmal spielen
          </button>
        </div>
      </div>
    </div>

  </div><!-- /container -->

<script>
  // ══════════════════════════════════════════════════════════════
  // AUFGABEN-DATEN
  // Hier die Aufgaben definieren. Jedes Objekt hat:
  //   question: was angezeigt wird
  //   correct:  richtige Antwort
  //   wrong:    Array mit falschen Antworten
  // ══════════════════════════════════════════════════════════════
  const TASKS = [
    { question: '3 + 4 = ?', correct: 7,  wrong: [6, 8, 5]  },
    { question: '5 + 6 = ?', correct: 11, wrong: [10, 12, 9] },
    { question: '8 + 3 = ?', correct: 11, wrong: [10, 12, 9] },
    { question: '7 + 2 = ?', correct: 9,  wrong: [8, 10, 7]  },
    { question: '4 + 4 = ?', correct: 8,  wrong: [7, 9, 6]   },
  ];

  // ── State ─────────────────────────────────────────────────────
  let taskIndex = 0;
  let score     = 0;
  let streak    = 0;
  let answered  = false;

  // ── Aufgabe anzeigen ──────────────────────────────────────────
  function showTask() {
    if (taskIndex >= TASKS.length) {
      showComplete(); return;
    }
    answered = false;
    const t = TASKS[taskIndex];
    document.getElementById('progress').style.width =
      `${(taskIndex / TASKS.length) * 100}%`;
    document.getElementById('progress-label').textContent =
      `${taskIndex + 1} / ${TASKS.length}`;
    document.getElementById('task-display').textContent = t.question;
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('btn-next').style.display = 'none';

    // Antworten mischen
    const all = shuffle([t.correct, ...t.wrong]);
    const grid = document.getElementById('answer-grid');
    grid.querySelectorAll('.answer-btn').forEach((btn, i) => {
      btn.textContent = all[i];
      btn.className   = 'answer-btn';
      btn.disabled    = false;
      btn.onclick     = () => checkAnswer(btn, all[i] === t.correct);
    });
  }

  // ── Antwort prüfen ────────────────────────────────────────────
  function checkAnswer(btn, isCorrect) {
    if (answered) return;
    answered = true;
    const fb = document.getElementById('feedback');

    if (isCorrect) {
      btn.classList.add('correct');
      score++; streak++;
      fb.textContent = '✅ Richtig! Super!';
      fb.className   = 'feedback correct';
    } else {
      btn.classList.add('wrong');
      streak = 0;
      // Richtige Antwort zeigen
      const correct = TASKS[taskIndex].correct.toString();
      document.querySelectorAll('.answer-btn').forEach(b => {
        if (b.textContent == correct) b.classList.add('correct');
      });
      fb.textContent = `❌ Leider falsch. Richtig wäre: ${correct}`;
      fb.className   = 'feedback wrong';
    }

    // Alle Buttons sperren
    document.querySelectorAll('.answer-btn').forEach(b => b.disabled = true);

    // Punktestand aktualisieren
    document.getElementById('score').textContent  = score;
    document.getElementById('streak').textContent = streak;

    // Weiter-Button zeigen
    document.getElementById('btn-next').style.display = 'block';
  }

  // ── Nächste Aufgabe ───────────────────────────────────────────
  function nextTask() {
    taskIndex++;
    showTask();
  }

  // ── Abschluss ─────────────────────────────────────────────────
  function showComplete() {
    document.getElementById('screen-task').style.display     = 'none';
    document.getElementById('screen-complete').style.display = 'block';
  }

  // ── Neustart ──────────────────────────────────────────────────
  function restart() {
    taskIndex = 0; score = 0; streak = 0; answered = false;
    document.getElementById('score').textContent  = 0;
    document.getElementById('streak').textContent = 0;
    document.getElementById('screen-task').style.display     = 'block';
    document.getElementById('screen-complete').style.display = 'none';
    showTask();
  }

  // ── Hilfsfunktionen ───────────────────────────────────────────
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── Start ─────────────────────────────────────────────────────
  showTask();
</script>
</body>
</html>
