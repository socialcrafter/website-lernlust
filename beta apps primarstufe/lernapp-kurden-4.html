<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Kurden im Mittelalter — Lernlust</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --color-bg: #ffffff;
  --color-surface: #fef6e4;
  --color-black: #000000;
  --color-text: #000000;
  --color-primary: #e67e22;
  --color-secondary: #f72585;
  --color-tertiary: #4cc9f0;
  --color-accent: #7209b7;
  --border-thick: 4px solid var(--color-black);
  --border-medium: 3px solid var(--color-black);
  --border-thin: 2px solid var(--color-black);
  --shadow-brutal: 8px 8px 0 var(--color-black);
  --shadow-medium: 6px 6px 0 var(--color-black);
  --shadow-small: 4px 4px 0 var(--color-black);
  --font-sans: -apple-system, BlinkMacSystemFont, "Arial Black", "Arial", sans-serif;
  --font-body: 'Source Sans 3', 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: "Courier New", Courier, monospace;
  --font-display: "Arial Black", "Arial", sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);font-size:18px;line-height:1.6;
  color:var(--color-text);background:var(--color-bg);overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:900;line-height:1.1;margin-bottom:1rem;text-transform:uppercase;letter-spacing:-0.02em}
h1{font-size:clamp(2rem,6vw,3rem)}
h2{font-size:clamp(1.4rem,3vw,2rem)}
h3{font-size:clamp(1.1rem,2vw,1.4rem)}
p{margin-bottom:1rem;font-weight:500}
.app{width:100%;max-width:540px;min-height:100vh;margin:0 auto;padding:0 16px 48px}
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--color-surface);
  border-bottom:var(--border-thick);
  padding:12px 0;
  display:flex;align-items:center;justify-content:space-between;
  margin:0 -16px;padding-left:16px;padding-right:16px;
}
.topbar-back{
  background:none;border:none;font-family:var(--font-sans);font-size:14px;font-weight:900;
  color:var(--color-black);cursor:pointer;display:flex;align-items:center;gap:6px;
  text-transform:uppercase;letter-spacing:0.5px;
}
.topbar-back:hover{color:var(--color-primary)}
.topbar-title{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--color-primary)}
.topbar-right{font-family:var(--font-mono);font-size:12px;color:var(--color-black);font-weight:700}
.progress-track{height:6px;background:#e0e0e0;border-bottom:var(--border-medium);margin:0 -16px}
.progress-fill{height:100%;background:var(--color-primary);transition:width .4s ease}
.screen{display:none;flex-direction:column;gap:16px;padding-top:20px}
.screen.active{display:flex}
.eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--color-primary)}
.card{background:var(--color-bg);border:var(--border-thick);padding:24px;box-shadow:var(--shadow-brutal)}
.card-surface{background:var(--color-surface);border:var(--border-thick);padding:24px;box-shadow:var(--shadow-brutal)}
.read-text{font-family:var(--font-body);font-size:19px;line-height:1.85;color:var(--color-text);font-weight:400}
.read-text strong{color:var(--color-primary);font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.read-text em{font-style:italic;color:#555}
.tts-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--color-bg);border:var(--border-medium);
  padding:8px 14px;color:var(--color-black);font-size:13px;font-weight:900;
  cursor:pointer;transition:all .15s;font-family:var(--font-sans);
  text-transform:uppercase;letter-spacing:.5px;box-shadow:var(--shadow-small);
}
.tts-btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--color-black)}
.tts-btn.speaking{background:var(--color-primary);color:var(--color-black)}
.glossary{border:var(--border-thick);border-color:var(--color-accent);background:rgba(114,9,183,0.06);padding:14px 16px}
.glossary-label{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--color-accent);margin-bottom:8px}
.glossary-row{font-size:15px;color:var(--color-text);display:flex;gap:6px;align-items:baseline;line-height:1.8}
.glossary-row .kw{font-weight:900;color:var(--color-text)}
.glossary-row .eq{color:#999;font-family:var(--font-mono);font-size:13px}
.glossary-row .tr{color:var(--color-accent);font-weight:700;font-family:var(--font-mono)}
.btn{
  border:var(--border-thick);font-family:var(--font-sans);font-size:15px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  gap:8px;transition:all .15s;width:100%;padding:14px 20px;
  text-transform:uppercase;letter-spacing:.5px;box-shadow:var(--shadow-medium);
}
.btn:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--color-black)}
.btn-primary{background:var(--color-primary);color:var(--color-black)}
.btn-secondary{background:var(--color-bg);color:var(--color-black)}
.btn-accent{background:var(--color-accent);color:#fff}
.btn-accent:hover{background:#5a0791}
.btn-tertiary{background:var(--color-tertiary);color:var(--color-black)}
.btn-green{background:#2d6b3a;color:#fff}
.btn-secondary-pink{background:var(--color-secondary);color:#fff}
.module-card{
  background:var(--color-bg);border:var(--border-thick);padding:24px;cursor:pointer;
  transition:all .15s;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-brutal);
}
.module-card:hover{transform:translate(4px,4px);box-shadow:4px 4px 0 var(--color-black)}
.module-card .num{font-family:var(--font-display);font-size:48px;font-weight:900;color:var(--color-primary);line-height:1}
.module-card h2{font-size:19px}
.module-card p{font-size:14px;color:#555;line-height:1.5;font-family:var(--font-body)}
.module-card.done{border-color:#2d6b3a}.module-card.done .num{color:#2d6b3a}
.parent-task{border:var(--border-thick);border-color:var(--color-secondary);background:rgba(247,37,133,0.06);padding:20px;box-shadow:var(--shadow-medium)}
.parent-task .pt-icon{font-size:28px;margin-bottom:4px}
.parent-task .pt-label{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--color-secondary);margin-bottom:8px}
.parent-task .pt-text{font-family:var(--font-body);font-size:17px;line-height:1.7;color:var(--color-text);font-weight:500}
.parent-answer{border:2px dashed var(--color-secondary);background:rgba(247,37,133,0.04);padding:12px 14px;margin-top:8px}
.parent-answer textarea{
  width:100%;border:var(--border-medium);padding:10px;font-family:var(--font-body);
  font-size:16px;line-height:1.6;resize:vertical;min-height:70px;background:var(--color-bg);
}
.parent-answer textarea:focus{outline:none;box-shadow:var(--shadow-small)}
.chunk-nav{display:flex;gap:8px;justify-content:center;margin:4px 0}
.chunk-dot{width:10px;height:10px;background:var(--color-bg);border:2px solid var(--color-black);cursor:pointer;transition:all .15s}
.chunk-dot.on{background:var(--color-primary);border-color:var(--color-primary);transform:scale(1.2)}
.chunk-dot.visited{background:var(--color-black)}
.question-text{font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--color-text);line-height:1.3;text-transform:none}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans-btn{
  background:var(--color-bg);border:var(--border-medium);
  padding:14px 10px;font-family:var(--font-body);font-size:16px;font-weight:700;
  color:var(--color-text);cursor:pointer;min-height:66px;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;
  transition:all .1s;box-shadow:var(--shadow-small);
}
.ans-btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--color-black)}
.ans-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--color-black)}
.ans-btn.correct{background:#2d6b3a;border-color:#2d6b3a;color:#fff;box-shadow:var(--shadow-small)}
.ans-btn.wrong{background:var(--color-secondary);border-color:var(--color-secondary);color:#fff;box-shadow:var(--shadow-small);animation:shake .3s ease}
.ans-btn.revealed{background:#e8f5e9;border-color:#2d6b3a;color:#1b5e20;box-shadow:var(--shadow-small)}
.feedback{border:var(--border-thick);padding:14px 16px;font-size:15px;font-weight:700;display:none;gap:10px;align-items:flex-start;line-height:1.5;font-family:var(--font-body)}
.feedback.show{display:flex}
.feedback.ok{background:#e8f5e9;border-color:#2d6b3a;color:#1b5e20}
.feedback.ko{background:#ffebee;border-color:var(--color-secondary);color:#880e4f}
.kurmanji-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(114,9,183,0.08);border:2px solid var(--color-accent);
  padding:3px 10px;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--color-accent);
}
.streak{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:13px;font-weight:700;
  background:var(--color-surface);border:var(--border-medium);padding:4px 10px;box-shadow:var(--shadow-small);
}
.result-stars{display:flex;gap:4px;justify-content:center;margin:16px 0}
.result-stars .star{font-size:36px;color:#e0e0e0;transition:color .3s}
.result-stars .star.earned{color:var(--color-primary)}
.score-text{font-family:var(--font-display);font-size:56px;font-weight:900;color:var(--color-primary);text-align:center}
.score-label{text-align:center;color:#555;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.start-hero{padding:40px 0 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.start-hero .sub{font-size:16px;color:var(--color-black);line-height:1.65;max-width:440px;font-weight:600}
.start-box{border:var(--border-thick);background:var(--color-surface);padding:20px;text-align:center;box-shadow:var(--shadow-brutal);font-size:15px;color:var(--color-black);line-height:1.7;font-weight:600}
.start-tag{background:var(--color-black);color:var(--color-surface);padding:4px 12px;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:2px;border:var(--border-thin);display:inline-block;margin-bottom:4px}
.fulltext-mod{border:var(--border-thick);border-left:8px solid var(--color-primary);background:var(--color-surface);padding:24px;margin-bottom:24px}
.fulltext-mod.mod-2{border-left-color:var(--color-secondary)}
.fulltext-mod.mod-3{border-left-color:var(--color-tertiary)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease}
@media(max-width:400px){
  .ans-grid{grid-template-columns:1fr}
  h1{font-size:1.8rem}
  .read-text{font-size:17px}
  .module-card:hover{transform:translate(2px,2px);box-shadow:6px 6px 0 var(--color-black)}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const MODULES=[
  {
    id:'islam',title:'Die Araber und der Islam',desc:'7. bis 11. Jh. — Eroberung, Islamisierung, Zusammenleben',
    sections:[
      {
        title:'Arabische Eroberung und Nihawand',
        text:'Die Geschichte der Kurden gewinnt erst mit dem Aufstieg des Islams in der ersten Hälfte des 7. Jahrhunderts klarere Konturen. Ihre Eroberungszüge führten die muslimischen Araber aus dem Südwesten Richtung Norden — durch Palästina, Syrien und in den Irak. Das Gebiet der Kurden gehörte damals zum sassanidischen Persien und zum Byzantinischen Reich. Die Araber besiegten das persische Heer <strong>642 bei Nihawand</strong> im Zagros-Gebirge südlich von Hamadan und sicherten sich die Kontrolle über Persien. Doch die Menschen in diesen Gebieten wurden nicht wirklich «unterworfen» und kamen kaum in näheren Kontakt zu den neuen Herren. Die Bergwelt Kurdistans war für die beduinischen Araber und ihre Kamele für einen längeren Aufenthalt nicht geeignet. Zudem sahen sie keine Notwendigkeit, das dünn besiedelte Bergland dauerhaft in Besitz zu nehmen.',
        glossary:[{kw:'Sassaniden',tr:'Sasaniyan'},{kw:'Persien',tr:'Îran'},{kw:'Nihawand',tr:'Nehawend'},{kw:'Byzanz',tr:'Bîzans'}],
        questions:[
          {q:'Wo besiegten die Araber das persische Heer 642?',correct:'Bei Nihawand im Zagros-Gebirge',wrong:['Bei Jerusalem','Bei Bagdad','Bei Erbil'],kurmanji:'Nehawend = Nihawand'},
          {q:'Warum blieben die Araber nicht im kurdischen Bergland?',correct:'Es war für sie und ihre Kamele zu unwirtlich, und es gab keine reichen Städte',wrong:['Die Kurden waren militärisch zu stark','Der Koran verbot es','Es gab keine Wasserquellen'],kurmanji:'çiyayî = Bergland'}
        ],
        parentTask:'Frage deine Eltern oder Grosseltern: Welche Geschichten haben sie über die arabische Eroberung oder die Ausbreitung des Islam gehört? In welchen Städten lebten damals unsere Vorfahren?'
      },
      {
        title:'Randlage und Steuerzahlung',
        text:'Kurdistan blieb — wie auch in späteren Jahrhunderten — in einer <strong>Randlage</strong>. Es bildete die Peripherie von Reichen, deren Zentren und Verwaltungen anderswo lagen. Die Umayyaden mit der Hauptstadt Damaskus und die Abbasiden mit Bagdad begnügten sich damit, dass die Kurden die Grundsteuer bezahlten. Für deren Einziehung waren die Führer der Nomadenstämme verantwortlich. Die Wirtschaft der Kurden — vor allem Nomadismus mit Schaf- und Ziegenherden — wurde durch die Araber kaum verändert.',
        glossary:[{kw:'Damaskus',tr:'Şam'},{kw:'Bagdad',tr:'Bexda'},{kw:'Steuer',tr:'bace'},{kw:'Nomade',tr:'koçer'}],
        questions:[
          {q:'Warum begnügten sich die Abbasiden mit der Steuerzahlung der Kurden?',correct:'Kurdistan lag am Rand des Reiches, die Zentren waren anderswo',wrong:['Die Kurden waren militärisch zu stark','Der Kalif wollte die Kurden beschützen','Die Steuern waren so hoch, dass mehr nicht nötig war'],kurmanji:'bace = Steuer'},
          {q:'Wie lebten die meisten Kurden zu dieser Zeit?',correct:'Als Nomaden mit Schaf- und Ziegenherden',wrong:['Als Händler in grossen Städten','Als Bauern auf festem Land','Als Krieger im Heer der Araber'],kurmanji:'koçer = Nomade'}
        ],
        parentTask:'Frage deine Eltern: Wie heisst die Stadt oder das Dorf, aus dem unsere Familie stammt? War das eher in den Bergen oder in der Ebene?'
      },
      {
        title:'Islamisierung der Kurden',
        text:'Die wichtigste Folge der arabischen Eroberung war die <strong>Islamisierung</strong> der Kurden. Sie geschah nicht von heute auf morgen und nicht mit Gewalt. Vermutlich nahmen zunächst nur kurdische Große den Islam an, die in Beziehungen zu den Umayyaden-Kalifen in Damaskus traten. Die Übernahme des Islams dürfte vor allem damit zu erklären sein, dass er den Mentalitäten und Normen der Kurden entsprach — und dass Muslime <strong>weniger Steuern</strong> zahlten. Die Annahme war nicht auf einen Schlag und massenhaft, sondern eine allmähliche Anpassung an geänderte Verhältnisse.',
        glossary:[{kw:'Islam',tr:'Îslam'},{kw:'Christen',tr:'Xirîstiyan'},{kw:'Juden',tr:'Cihû'},{kw:'Zoroastrier',tr:'Zerdeştî'}],
        questions:[
          {q:'Wie wurde die Islamisierung der Kurden beschrieben?',correct:'Allmählich und meist freiwillig — nicht mit Gewalt',wrong:['Mit Zwang und Feuer','Über Nacht alle gleichzeitig','Nur die Oberschicht wurde muslimisch'],kurmanji:'Îslam = Islam'},
          {q:'Warum nahmen viele Kurden den Islam an?',correct:'Er passte zu ihrer Lebensweise und Muslime zahlten weniger Steuern',wrong:['Sie wurden dazu gezwungen','Es gab keine andere Religion','Sie wollten Arabisch sprechen'],kurmanji:'bace = Steuer'}
        ],
        parentTask:'Frage deine Eltern: Wie wird in eurer Familie über den Islam gesprochen? Welche Bedeutung hat der Glaube im Alltag?'
      },
      {
        title:'Zusammenleben der Völker',
        text:'Die Kurden waren nicht das einzige Volk, das muslimisch wurde — auch Perser und später Türken. Im Vorderen Orient lebten <strong>Kurden, Araber, Perser und Türken</strong> zusammen. Regionen des Zweistromlandes und Kurdistan waren ein Mosaik verschiedener ethnischer und sprachlicher Elemente. Wenn Menschen überhaupt als Individuen wahrgenommen wurden, dann in erster Linie als <strong>Muslime</strong> und nicht als Kurden, Perser oder Araber. Dem Islam waren ethnische Diskriminierungen fremd, was aber Gefühle ethnischer Zusammengehörigkeit und Vorurteile nicht ausschloss.',
        glossary:[{kw:'Araber',tr:'Ereb'},{kw:'Perser',tr:'Farisî'},{kw:'Türken',tr:'Tirk'},{kw:'Muslime',tr:'Misilman'}],
        questions:[
          {q:'Wie wurden Menschen im islamischen Reich hauptsächlich wahrgenommen?',correct:'Als Muslime, nicht als Kurden, Perser oder Araber',wrong:['Als Krieger oder Bauern','Nach ihrer ethnischen Herkunft','Nach ihrem Reichtum'],kurmanji:'Misilman = Muslime'},
          {q:'Was schloss der Islam nicht aus?',correct:'Ethnische Vorurteile und Spannungen',wrong:['Alle Kriege','Jede Form von Zusammenarbeit','Den Bau von Moscheen'],kurmanji:'Ereb = Araber'}
        ],
        parentTask:'Frage deine Eltern: Welche verschiedenen Völker und Sprachen gibt es in eurer Heimatregion? Welche Sprachen werden dort gesprochen?'
      }
    ]
  },
  {
    id:'saladin',title:'Seldschuken und Saladin',desc:'11. bis 12. Jh. — Ein kurdischer Feldherr erobert Jerusalem',
    sections:[
      {
        title:'Die Seldschuken',
        text:'Die <strong>Seldschuken</strong>, ein türkisches Nomadenvolk aus den Steppen Zentralasiens, eroberten im 11. Jahrhundert Bagdad und grosse Teile des Vorderen Orients. Unter Führung von Tughril Beg beendeten sie 1055 die Buyiden-Herrschaft. Die kurdischen Kleinherrschaften mussten sich dem neuen Reich unterordnen oder wurden in sein Verwaltungssystem eingebunden. Die <strong>Marwaniden</strong>, eine kurdische Dynastie mit Zentrum in Diyarbakır, verloren ihre Unabhängigkeit.',
        glossary:[{kw:'Seldschuken',tr:'Selçûkî'},{kw:'Diyarbakır',tr:'Amed'},{kw:'Marwaniden',tr:'Merwanî'},{kw:'Zentralasien',tr:'Asyaya Navîn'}],
        questions:[
          {q:'Wer eroberte Bagdad im 11. Jahrhundert?',correct:'Die Seldschuken unter Tughril Beg',wrong:['Die Mongolen unter Hülegü','Die Araber unter dem Kalifen','Die Kreuzfahrer'],kurmanji:'Selçûkî = Seldschuken'},
          {q:'Was passierte mit den kurdischen Kleinherrschaften unter den Seldschuken?',correct:'Sie mussten sich unterordnen oder wurden eingegliedert',wrong:['Sie wurden vollständig vernichtet','Sie blieben völlig unabhängig','Sie wanderten nach Persien aus'],kurmanji:'Merwanî = Marwaniden'}
        ],
        parentTask:'Frage deine Eltern: Habt ihr von den Seldschuken gehört? Gibt es in eurer Region historische Stätten aus dieser Zeit?'
      },
      {
        title:'Saladins Herkunft',
        text:'Der berühmteste Herrscher kurdischer Abstammung ist <strong>Saladin</strong> (Salah ad-Din). Sein Vater Ayyub und sein Onkel Schirkuh stammten aus der Gegend von <strong>Erbil</strong> im heutigen Nordirak — dem Kernland der Kurden. Sie arbeiteten als Söldner im Irak und stiegen in Tikrit zu einigem Einfluss auf. 1152 schlossen sie sich dem Zengidenfürsten <strong>Nur ad-Din</strong> an, der in Syrien als Gegner der Kreuzfahrer bekannt war. Nach Nur ad-Dins Tod übernahm Saladin die Macht in Ägypten und erhielt vom Kalifen die Bestätigung seiner Herrschaft über Ägypten, Palästina und Syrien.',
        glossary:[{kw:'Saladin',tr:'Selahedîn'},{kw:'Erbil',tr:'Hewlêr'},{kw:'Tikrit',tr:'Tikrît'},{kw:'Kreuzfahrer',tr:'Xaçparêz'}],
        questions:[
          {q:'Woher stammte Saladins Familie?',correct:'Aus der Gegend von Erbil (Hewlêr) im Nordirak',wrong:['Aus Bagdad','Aus Mekka','Aus Kairo'],kurmanji:'Hewlêr = Erbil'},
          {q:'Welchem Fürsten schloss sich Saladins Familie an?',correct:'Nur ad-Din, dem Gegner der Kreuzfahrer in Syrien',wrong:['Selim I.','Hülegü','Dschingis Khan'],kurmanji:'Xaçparêz = Kreuzfahrer'}
        ],
        parentTask:'Frage deine Eltern: Habt ihr von Saladin gehört? Welche Geschichten kennt ihr über ihn? Was heisst «Erbil» auf Kurdisch in eurer Familie?'
      },
      {
        title:'Hittin und Jerusalem 1187',
        text:'1187 besiegte Saladin die Kreuzfahrer in der Schlacht von <strong>Hittin</strong> und eroberte <strong>Jerusalem</strong> zurück. Dies machte ihn im gesamten islamischen und christlichen Raum berühmt. Von kurdischen Nationalisten wird Saladin oft als Vorbild gesehen — doch sein Ayyubiden-Staat war kein kurdischer Nationalstaat: Die Herrschaftssprache war Arabisch, und im Militär dienten Kurden, Türken und andere Ethnien. <strong>Saladin identifizierte sich in erster Linie als muslimischer Herrscher, nicht als Kurde.</strong>',
        glossary:[{kw:'Hittin',tr:'Hetîn'},{kw:'Jerusalem',tr:'Orşelîm'},{kw:'Ayyubiden',tr:'Eyyûbî'},{kw:'Schlacht',tr:'şer'}],
        questions:[
          {q:'Was eroberte Saladin 1187 zurück?',correct:'Jerusalem',wrong:['Bagdad','Diyarbakır','Konstantinopel'],kurmanji:'Orşelîm = Jerusalem'},
          {q:'War Saladin ein kurdischer Nationalist?',correct:'Nein — sein Staat war multiethnisch, die Herrschaftssprache war Arabisch',wrong:['Ja — er gründete Kurdistan','Ja — es dienten nur Kurden im Militär','Er war kein Muslim'],kurmanji:'Eyyûbî = Ayyubiden'}
        ],

let S={screen:'start',mi:0,si:0,qi:0,streak:0,results:[],answered:false,visited:{},parentSaved:{}};
function load(){try{const s=localStorage.getItem('lernapp-kurden-v4');if(s){const p=JSON.parse(s);Object.assign(S,p)}}catch(e){}}
function save(){try{localStorage.setItem('lernapp-kurden-v4',JSON.stringify(S))}catch(e){}}
function resetAll(){S={screen:'start',mi:0,si:0,qi:0,streak:0,results:[],answered:false,visited:{},parentSaved:{}};save();render()}

function render(){
  const app=document.getElementById('app');
  switch(S.screen){
    case 'start':app.innerHTML=rStart();break;
    case 'modules':app.innerHTML=rModules();break;
    case 'read':app.innerHTML=rRead();break;
    case 'quiz':app.innerHTML=rQuiz();break;
    case 'parent':app.innerHTML=rParent();break;
    case 'result':app.innerHTML=rResult();break;
    case 'allDone':app.innerHTML=rAllDone();break;
    case 'fulltext':app.innerHTML=rFulltext();break;
    default:app.innerHTML=rStart();
  }
  window.scrollTo(0,0);
}

function rStart(){
  const has=S.visited&&Object.keys(S.visited).length>0;
  return `<div class="screen active fade-in">
    <div class="start-hero">
      <div class="start-tag">Geschichte Sek II</div>
      <h1>Die Kurden im Mittelalter</h1>
      <div class="sub">Lies die Originaltexte, teste dein Wissen — und sprich mit deinen Eltern darüber.</div>
    </div>
    <div class="start-box">
      3 Module · Originaltexte + Quizfragen<br>Mit Vorlesefunktion, Kurmanji-Glossar<br>und Elternaufgaben
    </div>
    <button class="btn btn-primary" onclick="go('modules')"><i class="fa-solid fa-book-open"></i> Loslegen</button>
    <button class="btn btn-tertiary" onclick="go('fulltext')"><i class="fa-solid fa-scroll"></i> Gesamttext lesen</button>
    ${has?`<button class="btn btn-secondary" onclick="resetAll()" style="margin-top:4px"><i class="fa-solid fa-rotate-left"></i> Neu starten</button>`:''}
  </div>`;
}

function rModules(){
  const d=S.visited||{};
  return `<div class="screen active fade-in">
    <div class="topbar">
      <button class="topbar-back" onclick="go('start')"><i class="fa-solid fa-arrow-left"></i> Start</button>
      <div class="topbar-title">Module</div>
      <div class="topbar-right">${Object.keys(d).filter(k=>d[k]&&d[k].done).length}/3</div>
    </div>
    ${MODULES.map((m,i)=>{
      const done=d[m.id]&&d[m.id].done;
      const stars=done?Math.min(3,Math.round(d[m.id].correct/(m.sections.length*2)*3)):0;
      return `<div class="module-card ${done?'done':''}" onclick="startMod(${i})">
        <div class="num">${i+1}</div>
        <h2>${m.title}</h2>
        <p>${m.desc}</p>
        ${done?`<div style="display:flex;align-items:center;gap:8px;margin-top:4px;font-family:var(--font-mono);font-size:13px"><span style="color:#2d6b3a;font-weight:900">${d[m.id].correct}/${m.sections.length*2}</span><span>${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

function rRead(){
  const mod=MODULES[S.mi];
  const sec=mod.sections[S.si];
  const total=mod.sections.length;
  const pct=((S.si+1)/total)*100;
  return `<div class="screen active fade-in">
    <div class="topbar">
      <button class="topbar-back" onclick="go('modules')"><i class="fa-solid fa-arrow-left"></i> Module</button>
      <div class="topbar-title">Modul ${S.mi+1}</div>
      <div class="topbar-right">${S.si+1}/${total}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="eyebrow">${mod.title}</div>
    <h2 style="text-transform:none">${sec.title}</h2>
    <div class="card">
      <div class="read-text">${sec.text}</div>
    </div>
    <button class="tts-btn" onclick="speakText()"><i class="fa-solid fa-volume-high"></i> Vorlesen</button>
    <div class="glossary">
      <div class="glossary-label">Kurmanji / کوردی</div>
      ${sec.glossary.map(g=>`<div class="glossary-row"><span class="kw">${g.kw}</span><span class="eq">=</span><span class="tr">${g.tr}</span></div>`).join('')}
    </div>
    <div class="chunk-nav">
      ${mod.sections.map((_,i)=>`<div class="chunk-dot ${i===S.si?'on':''} ${i<S.si?'visited':''}" onclick="goSec(${i})"></div>`).join('')}
    </div>
    <button class="btn btn-primary" onclick="startQuiz()"><i class="fa-solid fa-brain"></i> Zum Quiz (${sec.questions.length} Fragen)</button>
    ${S.si>0?`<button class="btn btn-secondary" onclick="prevSec()"><i class="fa-solid fa-arrow-left"></i> Zurück</button>`:''}
  </div>`;
}

  const mod=MODULES[S.mi];
  const sec=mod.sections[S.si];
  const q=sec.questions[S.qi];
  const total=sec.questions.length;
  const pct=((S.qi+1)/total)*100;
  const cc=S.results.filter(r=>r).length;
  return `<div class="screen active fade-in">
    <div class="topbar">
      <button class="topbar-back" onclick="S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()"><i class="fa-solid fa-arrow-left"></i> Text</button>

      <div class="topbar-right">${S.qi+1}/${total}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between">

      <div style="font-family:var(--font-mono);font-size:12px;font-weight:700">${cc} von ${S.results.length} richtig</div>
    </div>
    <div class="card-surface">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">

      <div class="ans-grid" id="ans-grid" style="margin-top:12px">
        ${shuf([{t:q.correct,ok:true},...q.wrong.map(w=>({t:w,ok:false}))]).map(a=>`<button class="ans-btn" data-c="${a.ok}" onclick="ans(this,${a.ok})">${a.t}</button>`).join('')}
      </div>
      <div class="feedback ok" id="fb-ok" style="margin-top:12px"><span style="font-size:18px">✓</span><span>Richtig! ${q.kurmanji}</span></div>
      <div class="feedback ko" id="fb-ko" style="margin-top:12px"><span style="font-size:18px">→</span><span>Richtig: <strong>${q.correct}</strong></span></div>
      <button class="btn btn-primary" id="nq-btn" style="display:none;margin-top:12px" onclick="nextQ()">Nächste Frage <i class="fa-solid fa-arrow-right"></i></button>

function rParent(){
  const sec=MODULES[S.mi].sections[S.si];
  const key=`${S.mi}-${S.si}`;
  const saved=S.parentSaved[key]||'';
  return `<div class="screen active fade-in">
    <div class="topbar">
      <button class="topbar-back" onclick="S.screen='read';save();render()"><i class="fa-solid fa-arrow-left"></i> Zurück</button>

}

function rResult(){
  const mod=MODULES[S.mi];
  const sec=mod.sections[S.si];
  const total=sec.questions.length;
  const c=S.results.filter(r=>r).length;
  const pct=Math.round(c/total*100);
  const s=Math.min(3,Math.round(c/total*3));
  const isLast=S.si>=mod.sections.length-1;
  return `<div class="screen active fade-in" style="justify-content:center;align-items:center;min-height:80vh">
    <div class="card" style="text-align:center;padding:36px 24px;max-width:420px">
      <div class="eyebrow">Abschnitt ${S.si+1}</div>
      <h2 style="margin-bottom:16px;text-transform:none">${sec.title}</h2>
      <div class="result-stars">${[1,2,3].map(i=>`<div class="star ${i<=s?'earned':''}">★</div>`).join('')}</div>
      <div class="score-text">${c}/${total}</div>
      <div class="score-label" style="margin-bottom:8px">${pct}% richtig</div>
      <div style="font-family:var(--font-body);font-size:15px;color:#555;margin-bottom:20px">${c>=total-1?'Sehr gut!':c>=Math.ceil(total/2)?'Gut, weiter so!':'Übe nochmal, du schaffst es!'}</div>
      ${!isLast
        ?`<button class="btn btn-primary" onclick="nextSec()">Nächster Abschnitt <i class="fa-solid fa-arrow-right"></i></button>`

      <button class="btn btn-secondary" onclick="retrySec()" style="margin-top:4px"><i class="fa-solid fa-rotate-left"></i> Nochmal</button>
      <button class="btn btn-secondary" onclick="go('modules')" style="margin-top:4px"><i class="fa-solid fa-th-large"></i> Übersicht</button>
    </div>

function rAllDone(){
  let totalC=0,totalQ=0;
  Object.values(S.visited).forEach(v=>{if(v&&v.done){totalC+=v.correct;totalQ+=v.questions}});
  const pct=totalQ?Math.round(totalC/totalQ*100):0;
  return `<div class="screen active fade-in" style="justify-content:center;align-items:center;min-height:80vh">
    <div class="card" style="text-align:center;padding:36px 24px;max-width:420px">
      <div style="font-size:48px;margin-bottom:12px">🏆</div>
      <h2>Alle Module geschafft!</h2>
      <div class="score-text">${totalC}/${totalQ}</div>
      <div class="score-label">${pct}% richtig insgesamt</div>
      <p style="color:#555;margin:12px 0 20px;line-height:1.6;font-family:var(--font-body)">Du hast alle drei Module durchgearbeitet.</p>
      <button class="btn btn-primary" onclick="resetAll()"><i class="fa-solid fa-rotate-left"></i> Von vorne</button>
      <button class="btn btn-secondary" style="margin-top:4px" onclick="go('modules')"><i class="fa-solid fa-th-large"></i> Module</button>
    </div>
  </div>`;
}

function rFulltext(){
  let html=`<div class="screen active fade-in">
    <div class="topbar">
      <button class="topbar-back" onclick="go('start')"><i class="fa-solid fa-arrow-left"></i> Start</button>
      <div class="topbar-title">Gesamttext</div>
      <div class="topbar-right"></div>
    </div>
    <h1 style="font-size:24px">Die Kurden im Mittelalter</h1>
    <p style="color:#555;font-size:15px;margin-bottom:16px;font-weight:600">Der vollständige Text aller drei Module zum Durchlesen.</p>`;
  MODULES.forEach((mod,mi)=>{
    const cls=mi===0?'':mi===1?'mod-2':'mod-3';
    html+=`<div class="fulltext-mod ${cls}">
      <h2 style="font-size:18px;margin-bottom:12px">Modul ${mi+1}: ${mod.title}</h2>`;

      html+=`<div style="margin-bottom:24px">
        <h3 style="font-size:15px;margin-bottom:8px;text-transform:none;letter-spacing:0">${sec.title}</h3>
        <div class="read-text" style="font-size:17px;margin-bottom:8px">${sec.text}</div>
        <button class="tts-btn" onclick="speakFullSec(${mi},${si})"><i class="fa-solid fa-volume-high"></i> Vorlesen</button>
        <div class="glossary" style="margin-top:8px">
          <div class="glossary-label">Kurmanji</div>
          ${sec.glossary.map(g=>`<div class="glossary-row"><span class="kw">${g.kw}</span><span class="eq">=</span><span class="tr">${g.tr}</span></div>`).join('')}

  return html;

function go(s){S.screen=s;S.answered=false;save();render()}
function startMod(i){S.mi=i;S.si=0;S.screen='read';save();render()}
function nextSec(){S.si++;S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function prevSec(){S.si=Math.max(0,S.si-1);S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function goSec(i){S.si=i;S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function startQuiz(){S.qi=0;S.streak=0;S.results=[];S.answered=false;S.screen='quiz';save();render()}

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function ans(btn,ok){
  if(S.answered)return;
  S.answered=true;
  const btns=document.querySelectorAll('#ans-grid .ans-btn');
  btns.forEach(b=>b.disabled=true);
  if(ok){
    btn.classList.add('correct');S.streak++;S.results.push(true);
    document.getElementById('fb-ok').classList.add('show');speak('Richtig!');
  }else{
    btn.classList.add('wrong');S.streak=0;S.results.push(false);
    btns.forEach(b=>{if(b.dataset.c==='true')b.classList.add('revealed')});
    document.getElementById('fb-ko').classList.add('show');speak('Leider falsch.');
  }
  document.getElementById('nq-btn').style.display='flex';save();
}

function nextQ(){
  const sec=MODULES[S.mi].sections[S.si];
  S.qi++;S.answered=false;
  if(S.qi>=sec.questions.length){S.screen='parent'}
  save();render();
}

function finishSec(){
  const mod=MODULES[S.mi];
  const sec=mod.sections[S.si];
  const total=sec.questions.length;
  const c=S.results.filter(r=>r).length;
  if(!S.visited[S.mi])S.visited[S.mi]={};
  S.visited[S.mi][S.si]={correct:c,total:total};
  S.screen='result';S.answered=false;save();render();
}

function retrySec(){S.screen='read';S.qi=0;S.results=[];S.answered=false;startQuiz()}

function finishMod(){
  const mod=MODULES[S.mi];
  let modCorrect=0,modTotal=0;
  mod.sections.forEach((sec,si)=>{
    const total=sec.questions.length;modTotal+=total;
    if(S.visited[S.mi]&&S.visited[S.mi][si]){modCorrect+=S.visited[S.mi][si].correct}
  });
  if(!S.visited)S.visited={};
  S.visited[mod.id]={done:true,correct:modCorrect,questions:modTotal};
  const allDone=MODULES.every(m=>S.visited&&S.visited[m.id]&&S.visited[m.id].done);
  if(allDone){S.screen='allDone'}else{S.mi=S.mi<MODULES.length-1?S.mi+1:0;S.si=0;S.screen='modules'}
  save();render();
}

function saveParent(){
  const key=`${S.mi}-${S.si}`;
  const ta=document.getElementById('parent-input');
  if(ta){S.parentSaved[key]=ta.value;save()}
}

function speakText(){
  const sec=MODULES[S.mi].sections[S.si];
  speak(sec.text.replace(/<[^>]+>/g,''));
}
function speakQ(){speak(MODULES[S.mi].sections[S.si].questions[S.qi].q)}
function speakFullSec(mi,si){
  const sec=MODULES[mi].sections[si];
  speak(sec.text.replace(/<[^>]+>/g,''));
}

function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='de-CH';u.rate=0.85;
  u.onstart=()=>document.querySelectorAll('.tts-btn').forEach(b=>b.classList.add('speaking'));
  u.onend=()=>document.querySelectorAll('.tts-btn').forEach(b=>b.classList.remove('speaking'));
  window.speechSynthesis.speak(u);
}

load();render();
</script>
</body>
