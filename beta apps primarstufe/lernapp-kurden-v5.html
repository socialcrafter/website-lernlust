<!doctype html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Kurden im Mittelalter — Lernlust</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --color-bg:#ffffff;--color-surface:#fef6e4;--color-black:#000000;--color-text:#000000;
  --color-primary:#e67e22;--color-secondary:#f72585;--color-tertiary:#4cc9f0;--color-accent:#7209b7;
  --border-thick:4px solid var(--color-black);--border-medium:3px solid var(--color-black);--border-thin:2px solid var(--color-black);
  --shadow-brutal:8px 8px 0 var(--color-black);--shadow-medium:6px 6px 0 var(--color-black);--shadow-small:4px 4px 0 var(--color-black);
  --font-sans:-apple-system,BlinkMacSystemFont,"Arial Black","Arial",sans-serif;
  --font-body:'Source Sans 3','Source Sans Pro',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:"Courier New",Courier,monospace;--font-display:"Arial Black","Arial",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);font-size:18px;line-height:1.6;color:var(--color-text);background:var(--color-bg);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:900;line-height:1.1;margin-bottom:1rem;text-transform:uppercase;letter-spacing:-0.02em}
h1{font-size:clamp(2rem,6vw,3rem)}h2{font-size:clamp(1.4rem,3vw,2rem)}h3{font-size:clamp(1.1rem,2vw,1.4rem)}
p{margin-bottom:1rem;font-weight:500}
.app{width:100%;max-width:540px;min-height:100vh;margin:0 auto;padding:0 16px 48px;position:relative}
.topbar{position:sticky;top:0;z-index:50;background:var(--color-surface);border-bottom:var(--border-thick);padding:12px 0;display:flex;align-items:center;justify-content:space-between;margin:0 -16px;padding-left:16px;padding-right:16px}
.topbar-back{background:none;border:none;font-family:var(--font-sans);font-size:14px;font-weight:900;color:var(--color-black);cursor:pointer;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.5px}
.topbar-back:hover{color:var(--color-primary)}
.topbar-title{font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--color-primary)}
.topbar-right{font-family:var(--font-mono);font-size:12px;color:var(--color-black);font-weight:700}
.progress-track{height:6px;background:#e0e0e0;border-bottom:var(--border-medium);margin:0 -16px}
.progress-fill{height:100%;background:var(--color-primary);transition:width .4s ease}
.screen{display:none;flex-direction:column;gap:16px;padding-top:20px}
.screen.active{display:flex}
.eyebrow{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--color-primary)}
.card{background:var(--color-bg);border:var(--border-thick);padding:24px;box-shadow:var(--shadow-brutal)}
.card-surface{background:var(--color-surface);border:var(--border-thick);padding:24px;box-shadow:var(--shadow-brutal)}
.read-text{font-family:var(--font-body);font-size:19px;line-height:1.85;color:var(--color-text);font-weight:400}
.read-text strong{color:var(--color-primary);font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}
.read-text em{font-style:italic;color:#555}
.tts-btn{display:inline-flex;align-items:center;gap:8px;background:var(--color-bg);border:var(--border-medium);padding:8px 14px;color:var(--color-black);font-size:13px;font-weight:900;cursor:pointer;transition:all .15s;font-family:var(--font-sans);text-transform:uppercase;letter-spacing:.5px;box-shadow:var(--shadow-small)}
.tts-btn:hover{transform:translate(3px,3px);box-shadow:0 0 0 var(--color-black)}
.tts-btn.speaking{background:var(--color-primary);color:var(--color-black)}
.glossary{border:var(--border-thick);border-color:var(--color-accent);background:rgba(114,9,183,.06);padding:14px 16px}
.glossary-label{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--color-accent);margin-bottom:8px}
.glossary-row{font-size:15px;color:var(--color-text);display:flex;gap:6px;align-items:baseline;line-height:1.8}
.glossary-row .kw{font-weight:900;color:var(--color-text)}.glossary-row .eq{color:#999;font-family:var(--font-mono);font-size:13px}.glossary-row .tr{color:var(--color-accent);font-weight:700;font-family:var(--font-mono)}
.btn{border:var(--border-thick);font-family:var(--font-sans);font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;width:100%;padding:14px 20px;text-transform:uppercase;letter-spacing:.5px;box-shadow:var(--shadow-medium)}
.btn:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--color-black)}
.btn-primary{background:var(--color-primary);color:var(--color-black)}.btn-secondary{background:var(--color-bg);color:var(--color-black)}
.btn-accent{background:var(--color-accent);color:#fff}.btn-accent:hover{background:#5a0791}
.btn-tertiary{background:var(--color-tertiary);color:var(--color-black)}.btn-green{background:#2d6b3a;color:#fff}
.module-card{background:var(--color-bg);border:var(--border-thick);padding:24px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-brutal)}
.module-card:hover{transform:translate(4px,4px);box-shadow:4px 4px 0 var(--color-black)}
.module-card .num{font-family:var(--font-display);font-size:48px;font-weight:900;color:var(--color-primary);line-height:1}
.module-card h2{font-size:19px}.module-card p{font-size:14px;color:#555;line-height:1.5;font-family:var(--font-body)}
.module-card.done{border-color:#2d6b3a}.module-card.done .num{color:#2d6b3a}
.parent-task{border:var(--border-thick);border-color:var(--color-secondary);background:rgba(247,37,133,.06);padding:20px;box-shadow:var(--shadow-medium)}
.parent-task .pt-icon{font-size:28px;margin-bottom:4px}
.parent-task .pt-label{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--color-secondary);margin-bottom:8px}
.parent-task .pt-text{font-family:var(--font-body);font-size:17px;line-height:1.7;color:var(--color-text);font-weight:500}
.parent-answer{border:2px dashed var(--color-secondary);background:rgba(247,37,133,.04);padding:12px 14px;margin-top:8px}
.parent-answer textarea{width:100%;border:var(--border-medium);padding:10px;font-family:var(--font-body);font-size:16px;line-height:1.6;resize:vertical;min-height:70px;background:var(--color-bg)}
.parent-answer textarea:focus{outline:none;box-shadow:var(--shadow-small)}
.chunk-nav{display:flex;gap:8px;justify-content:center;margin:4px 0;flex-wrap:wrap}
.chunk-dot{width:10px;height:10px;background:var(--color-bg);border:2px solid var(--color-black);cursor:pointer;transition:all .15s}
.chunk-dot.on{background:var(--color-primary);border-color:var(--color-primary);transform:scale(1.2)}.chunk-dot.visited{background:var(--color-black)}
.question-text{font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--color-text);line-height:1.3;text-transform:none}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans-btn{background:var(--color-bg);border:var(--border-medium);padding:14px 10px;font-family:var(--font-body);font-size:16px;font-weight:700;color:var(--color-text);cursor:pointer;min-height:66px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;transition:all .1s;box-shadow:var(--shadow-small)}
.ans-btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--color-black)}
.ans-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--color-black)}
.ans-btn.correct{background:#2d6b3a;border-color:#2d6b3a;color:#fff;box-shadow:var(--shadow-small)}
.ans-btn.wrong{background:var(--color-secondary);border-color:var(--color-secondary);color:#fff;box-shadow:var(--shadow-small);animation:shake .3s ease}
.ans-btn.revealed{background:#e8f5e9;border-color:#2d6b3a;color:#1b5e20;box-shadow:var(--shadow-small)}
.feedback{border:var(--border-thick);padding:14px 16px;font-size:15px;font-weight:700;display:none;gap:10px;align-items:flex-start;line-height:1.5;font-family:var(--font-body)}
.feedback.show{display:flex}.feedback.ok{background:#e8f5e9;border-color:#2d6b3a;color:#1b5e20}.feedback.ko{background:#ffebee;border-color:var(--color-secondary);color:#880e4f}
.kurmanji-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(114,9,183,.08);border:2px solid var(--color-accent);padding:3px 10px;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--color-accent)}
.streak{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:13px;font-weight:700;background:var(--color-surface);border:var(--border-medium);padding:4px 10px;box-shadow:var(--shadow-small)}
.result-stars{display:flex;gap:4px;justify-content:center;margin:16px 0}.result-stars .star{font-size:36px;color:#e0e0e0;transition:color .3s}.result-stars .star.earned{color:var(--color-primary)}
.score-text{font-family:var(--font-display);font-size:56px;font-weight:900;color:var(--color-primary);text-align:center}
.score-label{text-align:center;color:#555;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.start-hero{padding:40px 0 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.start-hero .sub{font-size:16px;color:var(--color-black);line-height:1.65;max-width:440px;font-weight:600}
.start-box{border:var(--border-thick);background:var(--color-surface);padding:20px;text-align:center;box-shadow:var(--shadow-brutal);font-size:15px;color:var(--color-black);line-height:1.7;font-weight:600}
.start-tag{background:var(--color-black);color:var(--color-surface);padding:4px 12px;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:2px;border:var(--border-thin);display:inline-block;margin-bottom:4px}
.fulltext-mod{border:var(--border-thick);border-left:8px solid var(--color-primary);background:var(--color-surface);padding:24px;margin-bottom:24px}
.fulltext-mod.mod-2{border-left-color:var(--color-secondary)}.fulltext-mod.mod-3{border-left-color:var(--color-tertiary)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease}
@media(max-width:400px){.ans-grid{grid-template-columns:1fr}h1{font-size:1.8rem}.read-text{font-size:17px}.module-card:hover{transform:translate(2px,2px);box-shadow:6px 6px 0 var(--color-black)}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const MODULES=[
{id:'islam',title:'Die Araber und der Islam',desc:'7. bis 11. Jh. — Eroberung, Islamisierung, Zusammenleben',
sections:[
{title:'Arabische Eroberung und Nihawand',
text:'Die Geschichte der Kurden gewinnt erst mit dem Aufstieg des Islams in der ersten Hälfte des 7. Jahrhunderts klarere Konturen. Ihre Eroberungszüge (<em>ghazwa</em>) führten die muslimischen Araber aus dem Südwesten (Hedschas) und dem Innern der Arabischen Halbinsel Richtung Norden (Ägypten, Syrien) und Nordosten (Irak, Persien). Zu diesem Zeitpunkt gehörte Kurdistan — freilich nicht unter diesem Namen — zur Einflusssphäre des Byzantinischen, vor allem aber des persischen <strong>Sassaniden-Reiches</strong>. Um die Mitte des Jahrhunderts wurden die Siedlungsgebiete der Kurden dem rasch expandierenden islamisch-arabischen Reich der «rechtgeleiteten Kalifen» (632–661) und der <strong>Umayyaden</strong> (661–749) einverleibt. Die Vorstöße wurden bis an den Kaukasus und nach Aserbaidschan getragen; die Niederlage des sassanidischen Heeres im Jahre <strong>642 bei Nihawand</strong> im Zagros-Gebirge südlich von Hamadan sicherte den Muslimen die Kontrolle Persiens.',
glossary:[{kw:'Sassaniden',tr:'Sasaniyan'},{kw:'Persien',tr:'Îran'},{kw:'Nihawand',tr:'Nehawend'},{kw:'Umayyaden',tr:'Emewî'}],
questions:[{q:'Wo besiegten die Araber das persische Heer 642?',correct:'Bei Nihawand im Zagros-Gebirge',wrong:['Bei Jerusalem','Bei Bagdad','Bei Erbil'],kurmanji:'Nehawend = Nihawand'},{q:'Wem gehörte Kurdistan vor der arabischen Eroberung?',correct:'Dem Sassaniden-Reich und Byzanz',wrong:['Den Mongolen','Den Osmanen','Den Kreuzfahrern'],kurmanji:'Sasaniyan = Sassaniden'}],
parentTask:'Frage deine Eltern oder Grosseltern: Welche Geschichten haben sie über die arabische Eroberung oder die Ausbreitung des Islam gehört? In welchen Städten lebten damals unsere Vorfahren?'},

{title:'Randlage und bergige Unzugänglichkeit',
text:'Das heisst aber nicht, dass die Menschen in diesen Gebieten (Kurdistan, Armenien, Mesopotamien, Persien) wirklich «unterworfen» wurden und in näheren Kontakt zu den neuen Herren kamen. Die Angriffe der Muslime hatten vielmehr Expeditionscharakter. Sie verweilten nicht länger als irgend nötig in den Bergregionen Irans. Die Bergwelt Kurdistans war für die beduinischen Araber und ihre Tiere (<strong>Kamele</strong>) für einen längeren Aufenthalt nicht geeignet. Zudem sahen sie die Notwendigkeit nicht, das dünn besiedelte und schwer zugängliche Bergland dauerhaft in Besitz zu nehmen. Zur Errichtung einer direkten Herrschaft hätte es eines gewaltigen militärischen Aufgebots bedurft; darüber hinaus gab es hier — im Gegensatz zu den Städten — keine Reichtümer zu «erwerben». Das Beute-Machen, ein traditioneller Zug beduinischen Lebens, der mit Eroberungsideologie gepaart war, stellte einen bedeutsamen Anreiz bei der Eroberung weiter Teile des Vorderen Orients dar.',
glossary:[{kw:'Beduinen',tr:'bedewî'},{kw:'Kamele',tr:'ştêr'},{kw:'Expedition',tr:'sefer'},{kw:'Bergland',tr:'çiyayî'}],
questions:[{q:'Warum blieben die Araber nicht im kurdischen Bergland?',correct:'Es war zu unwirtlich, und es gab keine reichen Städte zu erbeuten',wrong:['Die Kurden waren militärisch zu stark','Der Koran verbot es','Es gab keine Wasserquellen'],kurmanji:'çiyayî = Bergland'},{q:'Was war ein Hauptanreiz für die arabischen Eroberungen?',correct:'Das Beute-Machen in den wohlhabenden Städten',wrong:['Die Verbreitung von Demokratie','Der Bau von Moscheen','Die_landwirtschaftliche Kolonisation'],kurmanji:'sefer = Expedition'}],
parentTask:'Frage deine Eltern: Wie heisst die Stadt oder das Dorf, aus dem unsere Familie stammt? War das eher in den Bergen oder in der Ebene?'},

{title:'Kurdistan als Peripherie',
text:'Die Eroberer waren vielmehr von den wohlhabenden, städtischen Zentren fasziniert, in deren Nachbarschaft sie ihre Lager (<em>amsar</em>) aufschlugen. <strong>Kurdistan blieb in einer Randlage</strong>, es bildete die Peripherie von Reichen, deren Zentren und Verwaltungen anderswo lagen. Die Umayyaden mit der Hauptstadt Damaskus und die sie ablösende Dynastie der Abbasiden-Kalifen (749–1258) mit Bagdad als Sitz begnügten sich wohl damit, dass die Kurden die Grundsteuer bezahlten, für deren Einziehung die Führer der Nomadenstämme verantwortlich waren. Die Wirtschaft der Kurden — vor allem <strong>Nomadismus mit Schaf- und Ziegenherden</strong> — wurde durch die Araber kaum beeinträchtigt. Vereinzelt verpflichteten sich die Muslime sogar vertraglich dazu, die Wanderungen nicht zu stören.',
glossary:[{kw:'Damaskus',tr:'Şam'},{kw:'Bagdad',tr:'Bexda'},{kw:'Steuer',tr:'bace'},{kw:'Nomade',tr:'koçer'}],
questions:[{q:'Warum begnügten sich die Abbasiden mit der Steuerzahlung der Kurden?',correct:'Kurdistan lag am Rand des Reiches, die Zentren waren anderswo',wrong:['Die Kurden waren militärisch zu stark','Der Kalif wollte die Kurden beschützen','Die Steuern waren so hoch, dass mehr nicht nötig war'],kurmanji:'bace = Steuer'},{q:'Wie lebten die meisten Kurden zu dieser Zeit?',correct:'Als Nomaden mit Schaf- und Ziegenherden',wrong:['Als Händler in grossen Städten','Als Bauern auf festem Land','Als Krieger im Heer der Araber'],kurmanji:'koçer = Nomade'}],
parentTask:'Frage deine Eltern: Wie lebten die Kurden früher? Was wisst ihr über die nomadische Lebensweise?'},

{title:'Islamisierung der Kurden',
text:'Die wichtigste Folge der arabischen Eroberung war die <strong>Islamisierung</strong> der Kurden. Leider sind unsere Kenntnisse über diesen Prozess äusserst dürftig. Vermutlich nahmen zunächst nur einige kurdische Große den Islam an, die in Beziehungen zu den Umayyaden-Kalifen in Damaskus traten. Die Übernahme des Islams dürfte vor allem damit zu erklären sein, dass er den Mentalitäten und den Normen der Kurden entsprach — und dass <strong>Muslime weniger Steuern zahlten</strong>. Gewiss hat es eine Abwehr der Einheimischen gegeben, die zum Teil mit der Tatsache zu erklären ist, dass Kurden dem Heer der Sassaniden angehörten. Aber die These von der «gewaltsamen Islamisierung» lässt sich nur mit der Einschränkung aufrechterhalten, dass die Ausbreitung des Islams allein unter den Nicht-Muslimen in Kurdistan zwingend vorgeschrieben war (<em>dschihad</em>). Die heutige Existenz von Nicht-Muslimen in Kurdistan deutet darauf hin, dass die Expansion des Islams zumal in abgelegenere Regionen begrenzt war.',
glossary:[{kw:'Islam',tr:'Îslam'},{kw:'Dschihad',tr:'cihad'},{kw:'Christen',tr:'Xirîstiyan'},{kw:'Zoroastrier',tr:'Zerdeştî'}],
questions:[{q:'Wie wurde die Islamisierung der Kurden beschrieben?',correct:'Allmählich und meist freiwillig — nicht mit Gewalt',wrong:['Mit Zwang und Feuer','Über Nacht alle gleichzeitig','Nur die Oberschicht wurde muslimisch'],kurmanji:'Îslam = Islam'},{q:'Warum nahmen viele Kurden den Islam an?',correct:'Er passte zu ihrer Lebensweise und Muslime zahlten weniger Steuern',wrong:['Sie wurden dazu gezwungen','Es gab keine andere Religion','Sie wollten Arabisch sprechen'],kurmanji:'bace = Steuer'}],
parentTask:'Frage deine Eltern: Wie wird in eurer Familie über den Islam gesprochen? Welche Bedeutung hat der Glaube im Alltag?'},

{title:'Dhimmi — Schutzfür Nicht-Muslime',
text:'Von Bedeutung ist auch, dass die Bevölkerung mit der existierenden Herrschaft — Byzanz und Sassaniden — nicht zufrieden war, weil <strong>nestorianische Christen als Monophysiten</strong> von der byzantinischen Staatskirche verfolgt wurden. Unter der sassanidischen Staatsreligion, dem Zoroastrismus, erging es Christen nicht besser. Von den Muslimen hatten Andersgläubige eher eine Erleichterung zu erwarten: Sie mussten sich zwar unterwerfen, aber nicht konvertieren. Christen und Juden waren in den Augen der Muslime Anhänger anerkannter Religionen. Diesen sogenannten <strong>Schriftbesitzern</strong> (<em>ahl al-kitab</em>) war lediglich eine im Vergleich zu Muslimen höhere Abgabenlast auferlegt. Dafür wurde den Andersgläubigen der Status von «Schutzbefohlenen» (<em>dhimmi</em>) zuteil. Die Steuerbelastung war unter islamischer Herrschaft, selbst für Nicht-Muslime, geringer als in Byzanz und im sassanidischen Persien.',
glossary:[{kw:'Dhimmi',tr:'zimmî'},{kw:'Schriftbesitzer',tr:'ehlê kitêb'},{kw:'Zoroastrismus',tr:'Zerdeştî'},{kw:'Byzanz',tr:'Bîzans'}],
questions:[{q:'Was war der dhimmi-Status?',correct:'Schutzbefohlener — Nicht-Muslime zahlten mehr Steuern, durften aber ihren Glauben behalten',wrong:['Zwangskonvertierung zum Islam','Sklavenstatus für Christen','Militärdienst für Nicht-Muslime'],kurmanji:'zimmî = Dhimmi'},{q:'Warum waren manche Christen unter islamischer Herrschaft erleichtert?',correct:'Sie waren von den Byzantinern verfolgt worden und zahlten nun weniger Steuern',wrong:['Weil sie jetzt Muslime wurden','Weil sie keine Steuern mehr zahlten','Weil die Araber die Kirchen zerstörten'],kurmanji:'Bîzans = Byzanz'}],
parentTask:'Frage deine Eltern: Was wisst ihr über das Zusammenleben verschiedener Religionen in eurer Heimatregion? Gab es Christen, Jesiden oder andere Gruppen?'},

{title:'Zusammenleben der Völker',
text:'Die Kurden sind nicht das einzige Volk im Vorderen Orient gewesen, das sich dem Islam zuwandte. Die Iraner, die bis zur arabisch-islamischen Eroberung überwiegend dem Zoroastrismus anhingen, wurden ebenso Muslime wie die <strong>Türken</strong>, deren vorislamische Glaubensvorstellungen in erster Linie vom Schamanismus geprägt waren. Regionen des Zweistromlandes und Kurdistan und die angrenzenden Gebiete waren ein Mosaik verschiedener ethnischer und sprachlicher Elemente. Hier siedelten <strong>Kurden, Araber, Perser und bald auch Türken</strong>, die seit dem 9. Jahrhundert in wachsender Zahl von den Kalifen als Söldner angeworben wurden. Wenn Menschen überhaupt als Individuen wahrgenommen wurden, dann in erster Linie als <strong>Muslime und nicht als Kurden, Perser oder Araber</strong>. Streng genommen sind dem Islam ethnische Diskriminierungen fremd, was aber Gefühle ethnischer Zusammengehörigkeit, Partikularismen und ethnische Spannungen sowie Vorurteile nicht ausschloss.',
glossary:[{kw:'Araber',tr:'Ereb'},{kw:'Perser',tr:'Farisî'},{kw:'Türken',tr:'Tirk'},{kw:'Muslime',tr:'Misilman'}],
questions:[{q:'Wie wurden Menschen im islamischen Reich hauptsächlich wahrgenommen?',correct:'Als Muslime, nicht als Kurden, Perser oder Araber',wrong:['Als Krieger oder Bauern','Nach ihrer ethnischen Herkunft','Nach ihrem Reichtum'],kurmanji:'Misilman = Muslime'},{q:'Was schloss der Islam nicht aus?',correct:'Ethnische Vorurteile und Spannungen',wrong:['Alle Kriege','Jede Form von Zusammenarbeit','Den Bau von Moscheen'],kurmanji:'Ereb = Araber'}],
parentTask:'Frage deine Eltern: Welche verschiedenen Völker und Sprachen gibt es in eurer Heimatregion? Welche Sprachen werden dort gesprochen?'},

{title:'Kurdische Aufstände — Daisam ibn Ibrahim',
text:'Seit der Mitte des 8. Jahrhunderts befand sich das politische Lebenszentrum des Islams in Bagdad, wo die Abbasiden-Kalifen residierten. Ihr Einfluss reicht nicht aus, um regelmässig wiederkehrende <strong>Aufstände in der kurdischen Region</strong> zu verhindern, wobei es sich um Weigerungen handelte, Steuern zu entrichten, um Räuberunwesen oder bestimmte Formen sozialen Protestes. Kurz vor der Mitte des 10. Jahrhunderts hören wir von dem Aufstand eines gewissen <strong>Daisam ibn Ibrahim</strong>, eines Kurden oder Halbkurden, der einige charidschitische Kurdenstämme um sich geschart hatte. Die Charidschiten hatten sich bereits in der Mitte des 7. Jahrhunderts von den Schiiten abgespalten und bekämpften sowohl Sunniten als auch Schiiten, waren aber im 8. Jahrhundert nach der Machtübernahme der Abbasiden fast vollständig eliminiert worden. Auf diese Weise gelang es kurdischen Stämmen, mehr oder weniger kurzlebige und kleinräumige Herrschaften zu errichten.',
glossary:[{kw:'Daisam ibn Ibrahim',tr:'Dêsem bin Îbrahîm'},{kw:'Charidschiten',tr:'Xwarîcî'},{kw:'Abbasiden',tr:'Ebasî'},{kw:'Aufstand',tr:'serhildan'}],
questions:[{q:'Wer war Daisam ibn Ibrahim?',correct:'Ein kurdischer Aufständischer, der charidschitische Stämme führte',wrong:['Ein arabischer Kalif','Ein persischer Dichter','Ein mongolischer General'],kurmanji:'Dêsem bin Îbrahîm = Daisam'},{q:'Wer waren die Charidschiten?',correct:'Eine Gruppierung, die sich von Sunniten und Schiiten abspaltete',wrong:['Ein kurdischer Stamm','Die Herrscher in Bagdad','Mongolische Reiter'],kurmanji:'Xwarîcî = Charidschiten'}],
parentTask:'Frage deine Eltern: Habt ihr von kurdischen Aufständigen gehört? Welche Geschichten kennt ihr über Widerstand in der kurdischen Geschichte?'},

{title:'Hasanwaih und die Buyiden',
text:'Zentrifugale Tendenzen ermöglichten in der Mitte des 10. Jahrhunderts den Aufstieg der iranisch-schiitischen Dynastie der <strong>Buyiden</strong> (945–1055), die fortan die «starken Männer» in Bagdad waren. Ihnen gelang die «Befriedung» des nördlichen Mesopotamiens, wo die zahlreich vertretenen Kurden immer wieder als aufständisches Element von sich reden machten. <strong>Hasanwaih</strong> aus dem Stamm der Barzikan hatte sich dem Buyiden Rukn ad-Daula nützlich gemacht, der dafür manche den Kurden angelastete Auswüchse mit den Worten tolerierte: «Auch die Kurden müssen leben!» Nach dem Tode dieses in den Quellen gepriesenen Führers intervenierten die Buyiden zugunsten eines seiner Söhne und erhoben <strong>Badr ibn Hasanwaih</strong> zum Fürsten. Dabei war Badr keineswegs eine Marionette der Buyiden, waren doch diese selbst gespalten. Er konnte durch eine «Schaukelpolitik» Macht ausbauen. Wie sein Vater schützte er die Interessen der Bauern gegen übergriffige Nomaden und wurde vom Kalifen mit dem Ehrentitel «Schützer der Religion und des Staates» ausgezeichnet.',
glossary:[{kw:'Buyiden',tr:'Bûyî'},{kw:'Hasanwaih',tr:'Hesennewîh'},{kw:'Barzikan',tr:'Barzîkanî'},{kw:'Badr ibn Hasanwaih',tr:'Bedr bin Hesennewîh'}],
questions:[{q:'Wer waren die Buyiden?',correct:'Eine iranisch-schiitische Dynastie, die in Bagdad die Macht übernahm',wrong:['Ein kurdischer Stamm','Arabische Händler','Mongolische Eroberer'],kurmanji:'Bûyî = Buyiden'},{q:'Was sagte Rukn ad-Daula über die Kurden?',correct:'«Auch die Kurden müssen leben!»',wrong:['«Die Kurden sind unser Feind»','«Die Kurden sollen Steuern zahlen»','«Die Kurden sind zu gefährlich»'],kurmanji:'Hesennewîh = Hasanwaih'}],
parentTask:'Frage deine Eltern: Was wisst ihr über die Buyiden oder andere persische Dynastien in der kurdischen Geschichte?'}
]},

{id:'saladin',title:'Seldschuken und Saladin',desc:'11. bis 12. Jh. — Kurdische Dynastien und der berühmteste Feldherr',
sections:[
{title:'Schaddadiden und Marwaniden',
text:'In Nord-Aserbaidschan schwang sich die kurdische Dynastie der <strong>Schaddadiden</strong> (951–1031) zur Herrschaft auf. In ihrem Bestreben, Sicherheit und Ordnung herzustellen, wandten sich die Stadtbewohner an die in der Umgebung siedelnden wehrhaften Nomaden. Diese «Aufgabenverteilung» war für beide Seiten vorteilhaft: Die Nomaden profitierten finanziell, die Städter genossen Schutz und eine weitreichende Autonomie. Das oft als Gegensatz beschriebene Verhältnis <strong>Nomaden — Sesshafte</strong> konnte also durchaus Ausnahmen kennen.\n\nZu einer Art kurdischer Vorherrschaft avancierten die <strong>Marwaniden</strong>, die ihr Zentrum im Gebiet von Diyarbakır hatten. Etwa zur gleichen Zeit wie Badr gelang einem anderen Stammesführer der Kurden, einem gewissen <strong>Baz</strong>, der Aufstieg zu einem zeitweise gefährlichen Gegner der Buyiden. Er eroberte das Gebiet zwischen Mosul, Diyarbakır und Nusaibin und legte den Grundstein für eine etwa ein Jahrhundert währende Herrschaft. Nach seinem Tod im Jahre 990 folgten ihm die Söhne, die als die eigentlichen Begründer der Marwaniden-Dynastie gelten. Sie unterhielten gleichzeitig Beziehungen zu den Abbasiden in Bagdad, zu den schiitischen Gegen-Kalifen in Ägypten und zu Byzanz. Auf dem Höhepunkt ihrer Macht reichte das Territorium der Marwaniden, deren bedeutendster Herrscher <strong>Nasir ad-Daula</strong> genannt wurde, im Westen bis zum Van-See im Osten.',
glossary:[{kw:'Schaddadiden',tr:'Şedadî'},{kw:'Marwaniden',tr:'Merwanî'},{kw:'Diyarbakır',tr:'Amed'},{kw:'Nasir ad-Daula',tr:'Nêsirdewle'}],
questions:[{q:'Wie funktionierte die Beziehung zwischen Nomaden und Sesshaften bei den Schaddadiden?',correct:'Nomaden boten Schutz, Städter zahlten dafür — eine vorteilhafte Aufgabenverteilung',wrong:['Nomaden griffen die Städte ständig an','Städte vertrieben die Nomaden','Es gab keine Interaktion'],kurmanji:'Şedadî = Schaddadiden'},{q:'Wo lag das Zentrum der Marwaniden?',correct:'In Diyarbakır (Amed)',wrong:['In Bagdad','In Erbil','In Jerusalem'],kurmanji:'Amed = Diyarbakır'}],
parentTask:'Frage deine Eltern: Diyarbakır (Amed) war ein wichtiges Zentrum. Was wisst ihr über diese Stadt?'},

{title:'Die Seldschuken',
text:'Die <strong>Seldschuken</strong>, ein türkisches Nomadenvolk aus den Steppen Zentralasiens, hatten sich im 11. Jahrhundert unter dem Banner des Islam zu einer formidableen Militärmacht entwickelt. Unter Führung von <strong>Tughril Beg</strong> eroberten sie 1055 Bagdad und beendeten die Buyiden-Herrschaft. Die Seldschuken übernahmen die politische Macht, liessen den Abbasiden-Kalifen jedoch als religiöses Oberhaupt formell im Amt. Unter Alp Arslan und Malik Schah erreichte das Seldschukenreich seine grösste Ausdehnung, von Zentralasien bis zum Mittelmeer. Für Kurdistan begann mit den Seldschuken eine neue Ära. Die Region wurde Teil eines grossräumigen Reiches, das die kurdischen Kleinherrschaften entweder in sein Verwaltungssystem einband oder sie durch militärischen Druck zur Unterordnung zwang. Die Marwaniden verloren ihre Unabhängigkeit.',
glossary:[{kw:'Seldschuken',tr:'Selçûkî'},{kw:'Tughril Beg',tr:'Tûgrîl Beg'},{kw:'Alp Arslan',tr:'Alp Erslan'},{kw:'Zentralasien',tr:'Asyaya Navîn'}],
questions:[{q:'Wer eroberte Bagdad 1055?',correct:'Die Seldschuken unter Tughril Beg',wrong:['Die Mongolen unter Hülegü','Die Araber unter dem Kalifen','Die Kreuzfahrer'],kurmanji:'Selçûkî = Seldschuken'},{q:'Was passierte mit den kurdischen Kleinherrschaften unter den Seldschuken?',correct:'Sie mussten sich unterordnen oder wurden eingegliedert',wrong:['Sie wurden vollständig vernichtet','Sie blieben völlig unabhängig','Sie wanderten nach Persien aus'],kurmanji:'Merwanî = Marwaniden'}],
parentTask:'Frage deine Eltern: Habt ihr von den Seldschuken gehört? Gibt es in eurer Region historische Stätten aus dieser Zeit?'},

{title:'Saladins Herkunft',
text:'Den berühmtesten Herrscher kurdischer Abstammung stellt <strong>Saladin</strong> (Salah ad-Din) dar. Sein Vater Ayyub und sein Onkel Schirkuh stammten aus der Gegend von <strong>Erbil</strong> bzw. Dvin im armenischen Hochland, hatten sich als Söldner im Irak verdingt und waren in Tikrit, auf halbem Wege zwischen Bagdad und Mosul, zu einigem Einfluss gelangt. 1152 schlossen sie sich dem Zengidenfürsten <strong>Nur ad-Din</strong> an, der in Syrien einen Ruf als Gegner der Kreuzfahrer erworben hatte. Nach Nur ad-Dins Tod übernahm Saladin die Macht in Ägypten und erhielt vom Kalifen die Bestätigung seiner Herrschaft über Ägypten, Palästina und Syrien.',
glossary:[{kw:'Saladin',tr:'Selahedîn'},{kw:'Erbil',tr:'Hewlêr'},{kw:'Nur ad-Din',tr:'Nûredîn'},{kw:'Kreuzfahrer',tr:'Xaçparêz'}],
questions:[{q:'Woher stammte Saladins Familie?',correct:'Aus der Gegend von Erbil im Nordirak',wrong:['Aus Bagdad','Aus Mekka','Aus Kairo'],kurmanji:'Hewlêr = Erbil'},{q:'Welchem Fürsten schloss sich Saladins Familie an?',correct:'Nur ad-Din, dem Gegner der Kreuzfahrer in Syrien',wrong:['Selim I.','Hülegü','Dschingis Khan'],kurmanji:'Xaçparêz = Kreuzfahrer'}],
parentTask:'Frage deine Eltern: Habt ihr von Saladin gehört? Welche Geschichten kennt ihr über ihn? Was heisst «Erbil» auf Kurdisch in eurer Familie?'},

{title:'Hittin und Jerusalem 1187',
text:'1187 besiegte Saladin die Kreuzfahrer in der Schlacht von <strong>Hittin</strong> und eroberte <strong>Jerusalem</strong> zurück. Dies machte ihn im gesamten islamischen und christlichen Raum berühmt. Von kurdischen Nationalisten wird Saladin oft als Vorbild gesehen — doch sein Ayyubiden-Staat war kein kurdischer Nationalstaat: Die Herrschaftssprache war Arabisch, und im Militär dienten Kurden, Türken und andere Ethnien. Zwar waren zahlreiche Kurden im Militär des Staates tätig, aber die Ayyubiden rekrutierten auch Türken und andere Ethnien. <strong>Saladin identifizierte sich in erster Linie als muslimischer Herrscher, nicht als Kurde.</strong> Der Ayyubiden-Staat war ein typisches islamisches Herrschaftsgebilde seiner Zeit, in dem ethnische Zugehörigkeit eine untergeordnete Rolle spielte.',
glossary:[{kw:'Hittin',tr:'Hetîn'},{kw:'Jerusalem',tr:'Orşelîm'},{kw:'Ayyubiden',tr:'Eyyûbî'},{kw:'Schlacht',tr:'şer'}],
questions:[{q:'Was eroberte Saladin 1187 zurück?',correct:'Jerusalem',wrong:['Bagdad','Diyarbakır','Konstantinopel'],kurmanji:'Orşelîm = Jerusalem'},{q:'War Saladin ein kurdischer Nationalist?',correct:'Nein — sein Staat war multiethnisch, die Herrschaftssprache war Arabisch',wrong:['Ja — er gründete Kurdistan','Ja — nur Kurden im Militär','Er war kein Muslim'],kurmanji:'Eyyûbî = Ayyubiden'}],
parentTask:'Frage deine Eltern: Jerusalem ist für Muslime, Christen und Juden eine heilige Stadt. Was bedeutet Jerusalem für eure Familie? Habt ihr Geschichten darüber gehört?'}
]},

{id:'osmanen',title:'Osmanen und die Teilung Kurdistans',desc:'13. bis 20. Jh. — Mongolen, Osmanen, Safawiden, Lausanne',
sections:[
{title:'Die Mongolen',
text:'Die mongolische Invasion des 13. Jahrhunderts veränderte die politische Landschaft des Vorderen Orients grundlegend. 1258 eroberten die <strong>Mongolen</strong> unter Hülegü Bagdad und beendeten das Abbasiden-Kalifat. Kurdistan wurde in das <strong>Il-Khanat</strong> eingegliedert, die mongolische Herrschaft über Persien und Mesopotamien. Die Mongolen setzten auf ein System indirekter Herrschaft, bei dem lokale Dynasten als Vasallen fungierten, solange sie Steuern entrichteten und Truppen stellten. Für die kurdischen Bevölkerungen bedeutete die mongolische Herrschaft eine Zeit der Unsicherheit und der wechselnden Loyalitäten. Die mongolische Herrschaft führte auch zu <strong>Zerstörungen von Bewässerungssystemen und landwirtschaftlicher Infrastruktur</strong>, was die wirtschaftlichen Grundlagen der Region nachhaltig schädigte.',
glossary:[{kw:'Mongolen',tr:'Mongol'},{kw:'Hülegü',tr:'Hûlagû'},{kw:'Il-Khanat',tr:'Îlxan'},{kw:'Vasall',tr:'binemal'}],
questions:[{q:'Wer eroberte Bagdad 1258?',correct:'Die Mongolen unter Hülegü',wrong:['Die Araber','Die Seldschuken','Die Kreuzfahrer'],kurmanji:'Hûlagû = Hülegü'},{q:'Wie herrschten die Mongolen über Kurdistan?',correct:'Indirekt — kurdische Dynasten blieben als Vasallen an der Macht',wrong:['Sie vertrieben alle Kurden','Sie herrschten direkt aus Bagdad','Sie ignorierten Kurdistan komplett'],kurmanji:'binemal = Vasall'}],
parentTask:'Frage deine Eltern: Habt ihr Geschichten über die Mongolen gehört? Gibt es in eurer Heimatstadt alte Burgen oder Festungen?'},

{title:'Kurdische Kleinfürstentümer nach dem Il-Khanat',
text:'Nach dem Zerfall des Il-Khanats in der Mitte des 14. Jahrhunderts entstanden in Kurdistan verschiedene Kleinfürstentümer, die zwischen den grösseren Mächten lavierten. Die bedeutendsten waren die Dynastien der <strong>Erdelan</strong> im Gebiet von Sannandschaj, der <strong>Badinan</strong> um Amadiye und der <strong>Botan</strong> mit Zentrum in Dschisra ibn Umar. Diese Fürstentümer prägten die kurdische Gesellschaft bis weit in die osmanische Zeit hinein.',
glossary:[{kw:'Erdelan',tr:'Erdelan'},{kw:'Badinan',tr:'Badînan'},{kw:'Botan',tr:'Botan'},{kw:'Dschisra ibn Umar',tr:'Cizîra Botan'}],
questions:[{q:'Welche kurdischen Dynastien entstanden nach dem Il-Khanat?',correct:'Erdelan, Badinan und Botan',wrong:['Abbasiden und Umayyaden','Seldschuken und Mongolen','Ayyubiden und Fatimiden'],kurmanji:'Erdelan, Badînan û Botan'},{q:'Wann zerfiel das Il-Khanat?',correct:'In der Mitte des 14. Jahrhunderts',wrong:['642','1187','1923'],kurmanji:'Îlxan = Il-Khanat'}],
parentTask:'Frage deine Eltern: Kennt ihr die Namen Erdelan, Badinan oder Botan? Welche kurdischen Fürstentümer kennt ihr aus eurer Heimatregion?'},

{title:'Osmanen gegen Safawiden',
text:'Die osmanische Expansion seit dem 14. Jahrhundert und der Aufstieg der schiitischen <strong>Safawiden</strong> in Persien seit dem frühen 16. Jahrhundert brachten Kurdistan in eine geopolitisch prekäre Lage. Die Region wurde zur Pufferzone zwischen zwei rivalisierenden Grossmächten, die sich in religiöser wie politischer Hinsicht unversöhnlich gegenüberstanden. Die <strong>Sunniten</strong> unter osmanischer und die <strong>Schiiten</strong> unter safawidischer Führung kämpften um die Vorherrschaft, und Kurdistan lag genau an der Bruchlinie dieses Konflikts. Die kurdischen Fürsten wechselten oft die Seite, je nachdem, wer gerade stärker war.',
glossary:[{kw:'Osmanen',tr:'Osmanî'},{kw:'Safawiden',tr:'Sefewî'},{kw:'Sunniten',tr:'Sunî'},{kw:'Schiiten',tr:'Şîî'}],
questions:[{q:'Zwischen welchen zwei Mächten lag Kurdistan im 16. Jahrhundert?',correct:'Zwischen den Osmanen (sunnitisch) und den Safawiden (schiitisch)',wrong:['Byzanz und Araber','Mongolen und Kreuzfahrer','Römern und Persern'],kurmanji:'Osmanî û Sefewî'},{q:'Warum wechselten kurdische Fürsten oft die Seite?',correct:'Je nachdem, welche Grossmacht gerade stärker war',wrong:['Sie hatten keine eigene Meinung','Sie wollten immer Krieg führen','Der Koran gebot es ihnen'],kurmanji:'Sunî = Sunnit'}],
parentTask:'Frage deine Eltern: In eurer Heimatregion — gab es dort mehr Sunniten oder Schiiten? Was wisst ihr über die Unterschiede?'},

{title:'Tschaldiran 1514',
text:'Die <strong>Schlacht von Tschaldiran 1514</strong> war der Wendepunkt: Die Osmanen unter Selim I. besiegten die Safawiden unter Schah Ismail. Die kurdischen Fürsten, die sich rechtzeitig auf die osmanische Seite stellten, behielten ihre <strong>Autonomie als Vasallen</strong>. Die Osmanen unterschieden zwischen direkt verwalteten Provinzen und autonomen kurdischen Fürstentümern, denen weitreichende Selbstverwaltungsrechte zugestanden wurden. Dieser Status quo hatte für die Kurden Vor- und Nachteile: Einerseits bewahrte er eine gewisse Eigenständigkeit der kurdischen Gesellschaft und ermöglichte die Fortexistenz traditioneller Herrschaftsstrukturen. Andererseits verhinderte er die Entwicklung eines einheitlichen kurdischen Staatswesens und machte die kurdischen Fürsten zu Spielbällen der osmanisch-safawidischen Rivalität.',
glossary:[{kw:'Tschaldiran',tr:'Çaldiran'},{kw:'Selim I.',tr:'Selîm'},{kw:'Emirat',tr:'Mîrektî'},{kw:'Autonomie',tr:'xweserî'}],
questions:[{q:'Was passierte in der Schlacht von Tschaldiran 1514?',correct:'Die Osmanen besiegten die Safawiden',wrong:['Die Kurden wurden unabhängig','Die Mongolen eroberten Persien','Die Kreuzfahrer nahmen Jerusalem'],kurmanji:'Çaldiran = Tschaldiran'},{q:'Was war der Vorteil der kurdischen Fürsten unter osmanischer Herrschaft?',correct:'Sie behielten ihre lokale Autonomie — wenn sie loyal waren',wrong:['Sie wurden reich durch Handel','Sie mussten keine Steuern zahlen','Sie bekamen eigenes Militär vom Sultan'],kurmanji:'xweserî = Autonomie'}],
parentTask:'Frage deine Eltern: Was wisst ihr über die osmanische Zeit? Gibt es in eurer Familie Geschichten über die Osmanen?'},

{title:'Die kurdischen Emirate',
text:'Im 16. und 17. Jahrhundert konsolidierte sich die osmanische Herrschaft über den grössten Teil Kurdistans. Die osmanische Verwaltung erkannte die kurdischen <strong>Emirate als halbautonome Gebilde</strong> an, solange sie ihre Verpflichtungen gegenüber der Zentralmacht erfüllten: Steuerzahlungen, militärische Unterstützung im Kriegsfall und Anerkennung der osmanischen Oberhoheit. Das bekannteste dieser Emirate war das Fürstentum <strong>Botan</strong> unter der Herrschaft der Familie der Dschihir, das im 19. Jahrhundert unter Bedirhan Bey eine letzte Blüte erlebte. Die kurdische Bevölkerung litt unter den wiederholten Durchzügen beider Armeen, der Zerstörung von Siedlungen und der Unterbrechung des Handels. Gleichzeitig boten die unsicheren Verhältnisse manchen kurdischen Führern Gelegenheit, ihre Macht durch geschicktes Bündnismanagement auszubauen.',
glossary:[{kw:'Botan',tr:'Botan'},{kw:'Bedirhan Bey',tr:'Bedirxan Beg'},{kw:'Emirat',tr:'Mîrektî'},{kw:'Osmanen',tr:'Osmanî'}],
questions:[{q:'Was mussten kurdische Emirate den Osmanen leisten?',correct:'Steuerzahlungen, militärische Unterstützung und Anerkennung der Oberhoheit',wrong:['Nichts — sie waren völlig unabhängig','Nur Steuern','Sie mussten zum Islam konvertieren'],kurmanji:'Mîrektî = Emirat'},{q:'Welches Emitat erlebte unter Bedirhan Bey eine letzte Blüte?',correct:'Das Fürstentum Botan',wrong:['Erdelan','Badinan','Marwaniden'],kurmanji:'Bedirxan Beg = Bedirhan Bey'}],
parentTask:'Frage deine Eltern: Bedirhan Bey ist eine wichtige Figur. Habt ihr von ihm gehört? Was wisst ihr über die kurdischen Fürstentümer?'},

{title:'Zentralisierung — das Ende der Emirate',
text:'Die Tanzimat-Reformen ab 1839 zielten auf eine Modernisierung des Reiches und eine Vereinheitlichung der Verwaltung ab. Für die kurdischen Emirate bedeutete dies schrittweise den Verlust ihrer <strong>Autonomie</strong>. 1847 wurde das Emirat Botan nach einem langen militärischen Konflikt aufgelöst, und <strong>Bedirhan Bey</strong>, der letzte autonome Fürst von Botan, wurde nach Istanbul verbannt. Andere Emirate teilten dasselbe Schicksal. Die osmanische Zentralmacht wollte keine halbunabhängigen Fürstentümer mehr tolerieren, die als Quelle von Instabilität gelten konnten.',
glossary:[{kw:'Bedirhan Bey',tr:'Bedirxan Beg'},{kw:'Istanbul',tr:'Stenbol'},{kw:'Zentralisierung',tr:'navendîbûn'},{kw:'Tanzimat',tr:'Tanzîmat'}],
questions:[{q:'Wann verlor das Emirat Botan seine Autonomie?',correct:'1847 — Bedirhan Bey wurde nach Istanbul verbannt',wrong:['1514','1187','1923'],kurmanji:'Bedirxan Beg = Bedirhan Bey'},{q:'Warum hoben die Osmanen die kurdischen Emirate auf?',correct:'Sie wollten keine halbunabhängigen Fürstentümer mehr tolerieren und das Reich zentralisieren',wrong:['Die Kurden hatten einen Aufstand gewonnen','Die Briten zwangen sie dazu','Die Emirate waren bankrott'],kurmanji:'navendîbûn = Zentralisierung'}],
parentTask:'Frage deine Eltern: Was wisst ihr über die osmanischen Reformen und die kurdischen Fürstentümer? Hat eure Familie Geschichten über diese Zeit?'},

{title:'Das 19. Jahrhundert — neue Identitäten',
text:'Das 19. Jahrhundert war für Kurdistan eine Periode tiefgreifender Umbrüche. Die osmanischen Reformen veränderten die traditionellen Machtverhältnisse, und die zunehmende Einbindung des Osmanischen Reiches in das europäische Staatensystem hatte auch für die kurdischen Gebiete weitreichende Konsequenzen. Die Einführung des Titels eines «<strong>Kurden-Gouverneurs</strong>» (<em>Mutasarrif</em>) in einigen Provinzen war ein Versuch, die kurdische Bevölkerung enger an die osmanische Zentrale zu binden. Gleichzeitig entstanden neue kurdische Identitätsentwürfe, die sich nicht mehr ausschliesslich auf Stammeszugehörigkeit und lokale Fürstentümer bezogen, sondern ein kurdisches Nationalbewusstsein zu entwickeln begannen. Die ersten <strong>kurdischen Zeitungen und Organisationen</strong> entstanden in der zweiten Hälfte des 19. Jahrhunderts, zunächst im Exil in Istanbul und in europäischen Städten. Die wirtschaftliche Modernisierung erreichte Kurdistan nur zögerlich. Die Region blieb überwiegend agrarisch geprägt.',
glossary:[{kw:'Mutasarrif',tr:'mutesarif'},{kw:'Nationalbewusstsein',tr:'hişyarîya neteweyî'},{kw:'Zeitung',tr:'rochnama'},{kw:'Organisation',tr:'rganîzasyon'}],
questions:[{q:'Was entstand zum ersten Mal in der zweiten Hälfte des 19. Jahrhunderts?',correct:'Kurdische Zeitungen und Organisationen',wrong:['Ein kurdischer Staat','Die kurdische Sprache','Der Islam in Kurdistan'],kurmanji:'rochnama = Zeitung'},{q:'Was war der Titel «Kurden-Gouverneur» (Mutasarrif)?',correct:'Ein Versuch, die Kurden enger an die osmanische Zentrale zu binden',wrong:['Ein unabhängiger kurdischer Herrscher','Ein religiöser Titel','Ein militärischer Rang'],kurmanji:'mutesarif = Gouverneur'}],
parentTask:'Frage deine Eltern: Was wisst ihr über die Anfänge des kurdischen Nationalbewusstseins? Gibt es in eurer Familie Geschichten über diese Zeit?'},

{title:'Erster Weltkrieg und Sèvres',
text:'Der Ausbruch des <strong>Ersten Weltkriegs</strong> 1914 brachte das Ende des Osmanischen Reiches in Sichtweite. Die Jungtürken, die seit 1908 die Geschicke des Reiches bestimmten, hatten Kurdistan in die militärische Mobilisierung einbezogen und die kurdische Bevölkerung mit Rekrutierungen und Requisitionen stark belastet. Der <strong>Vertrag von Sèvres 1920</strong> sah die Schaffung eines unabhängigen kurdischen Staates vor, zumindest in einer vagen Formulierung, die eine Volksabstimmung über die Unabhängigkeit Kurdistans in Aussicht stellte. Doch der Vertrag von Sèvres wurde nie ratifiziert.',
glossary:[{kw:'Jungtürken',tr:'Cewentirkan'},{kw:'Erster Weltkrieg',tr:'Şerê Cîhanê yê Yekem'},{kw:'Sèvres',tr:'Sêvr'},{kw:'Volksabstimmung',tr:'referandûm'}],
questions:[{q:'Was sah der Vertrag von Sèvres 1920 vor?',correct:'Einen unabhängigen kurdischen Staat — zumindest in einer vagen Formulierung',wrong:['Die Teilung Kurdistans','Die Islamisierung der Kurden','Die Vertreibung der Kurden'],kurmanji:'Sêvr = Sèvres'},{q:'Warum wurde Sèvres nie ratifiziert?',correct:'Die türkische Nationalbewegung unter Mustafa Kemal leistete Widerstand',wrong:['Die Kurden lehnten ihn ab','Die Briten wollten ihn nicht','Der Papst intervenierte'],kurmanji:'Cewentirkan = Jungtürken'}],
parentTask:'Frage deine Eltern: Was wisst ihr über den Ersten Weltkrieg und seine Folgen für Kurdistan? Habt ihr Geschichten von Grosseltern darüber gehört?'},

{title:'Lausanne 1923 — Kurdistan wird aufgeteilt',
text:'Die türkische Nationalbewegung unter <strong>Mustafa Kemal</strong> erkämpfte im türkischen Befreiungskrieg die Revision der Sèvres-Bestimmungen. Der <strong>Vertrag von Lausanne 1923</strong>, der den Ersten Weltkrieg für die Türkei beendete, erwähnte die Kurden mit keinem Wort mehr. Das Gebiet Kurdistans wurde zwischen der neuen Türkei, dem britischen Irak und dem französischen Syrien aufgeteilt. Die Kurden — die grösste ethnische Gruppe ohne eigenen Staat — sahen sich in einem System von Nationalstaaten, das für ethnische Minderheiten wenig Platz vorsah. Die Aufteilung Kurdistans markiert den Beginn der modernen kurdischen Frage, die bis in die Gegenwart hineinreicht.',
glossary:[{kw:'Lausanne',tr:'Lozana'},{kw:'Mustafa Kemal',tr:'Mistefa Kemal'},{kw:'Nationalstaat',tr:'dewleta neteweyî'},{kw:'Staat',tr:'dewlet'}],
questions:[{q:'Was bestimmte der Vertrag von Lausanne 1923 für Kurdistan?',correct:'Kurdistan wurde zwischen Türkei, Irak und Syrien aufgeteilt',wrong:['Kurdistan wurde unabhängig','Die Osmanen behielten die Macht','Die Mongolen kehrten zurück'],kurmanji:'Lozana = Lausanne'},{q:'Warum war Lausanne für die Kurden ein Desaster?',correct:'Der Vertrag erwähnte die Kurden nicht — sie wurden grösste ethnische Gruppe ohne eigenen Staat',wrong:['Er gab den Kurden zu viel Autonomie','Er zwang sie zur Emigration','Er verbot die kurdische Sprache nicht'],kurmanji:'dewlet = Staat'}],
parentTask:'Frage deine Eltern: In welchem Land lebt unsere Familie heute? In welchen Ländern leben andere Kurden? Was bedeutet es für die Kurden, dass Kurdistan aufgeteilt wurde?'}
]}
];

let S={screen:'start',mi:0,si:0,qi:0,streak:0,results:[],answered:false,visited:{},parentSaved:{}};
function load(){try{const s=localStorage.getItem('lernapp-kurden-v5');if(s){Object.assign(S,JSON.parse(s))}}catch(e){}}
function save(){try{localStorage.setItem('lernapp-kurden-v5',JSON.stringify(S))}catch(e){}}
function resetAll(){S={screen:'start',mi:0,si:0,qi:0,streak:0,results:[],answered:false,visited:{},parentSaved:{}};save();render()}

function render(){
const app=document.getElementById('app');
switch(S.screen){
case 'start':app.innerHTML=rStart();break;
case 'modules':app.innerHTML=rModules();break;
case 'read':app.innerHTML=rRead();break;
case 'quiz':app.innerHTML=rQuiz();break;
case 'parent':app.innerHTML=rParent();break;
case 'result':app.innerHTML=rResult();break;
case 'allDone':app.innerHTML=rAllDone();break;
case 'fulltext':app.innerHTML=rFulltext();break;
default:app.innerHTML=rStart();}
window.scrollTo(0,0);
}

function rStart(){
const has=S.visited&&Object.keys(S.visited).length>0;
const totalSec=MODULES.reduce((a,m)=>a+m.sections.length,0);
return `<div class="screen active fade-in"><div class="start-hero"><div class="start-tag">Geschichte Sek II</div><h1>Die Kurden im<br>Mittelalter</h1><div class="sub">Lies die Originaltexte, teste dein Wissen — und sprich mit deinen Eltern darüber.</div></div><div class="start-box">${MODULES.length} Module · ${totalSec} Abschnitte · Originaltexte<br>Mit Vorlesefunktion, Kurmanji-Glossar<br>und Elternaufgaben</div><button class="btn btn-primary" onclick="go('modules')"><i class="fa-solid fa-book-open"></i> Loslegen</button><button class="btn btn-tertiary" onclick="go('fulltext')"><i class="fa-solid fa-scroll"></i> Gesamttext lesen</button>${has?`<button class="btn btn-secondary" onclick="resetAll()" style="margin-top:4px"><i class="fa-solid fa-rotate-left"></i> Neu starten</button>`:''}</div>`;}

function rModules(){
const d=S.visited||{};
return `<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="go('start')"><i class="fa-solid fa-arrow-left"></i> Start</button><div class="topbar-title">Module</div><div class="topbar-right">${MODULES.filter(m=>d[m.id]&&d[m.id].done).length}/${MODULES.length}</div></div>${MODULES.map((m,i)=>{const done=d[m.id]&&d[m.id].done;const stars=done?Math.min(3,Math.round(d[m.id].correct/(m.sections.length*2)*3)):0;return `<div class="module-card ${done?'done':''}" onclick="startMod(${i})"><div class="num">${i+1}</div><h2>${m.title}</h2><p>${m.desc}</p><p style="font-family:var(--font-mono);font-size:12px;color:#777;margin-top:4px">${m.sections.length} Abschnitte · ${m.sections.length*2} Fragen</p>${done?`<div style="display:flex;align-items:center;gap:8px;margin-top:4px;font-family:var(--font-mono);font-size:13px"><span style="color:#2d6b3a;font-weight:900">${d[m.id].correct}/${m.sections.length*2}</span><span>${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span></div>`:''}</div>`;}).join('')}</div>`;}

function rRead(){
const mod=MODULES[S.mi];const sec=mod.sections[S.si];const total=mod.sections.length;const pct=((S.si+1)/total)*100;
return `<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="go('modules')"><i class="fa-solid fa-arrow-left"></i> Module</button><div class="topbar-title">Modul ${S.mi+1}</div><div class="topbar-right">${S.si+1}/${total}</div></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div class="eyebrow">${mod.title}</div><h2 style="text-transform:none">${sec.title}</h2><div class="card"><div class="read-text">${sec.text}</div></div><button class="tts-btn" onclick="speakText()"><i class="fa-solid fa-volume-high"></i> Vorlesen</button><div class="glossary"><div class="glossary-label">Kurmanji / کوردی</div>${sec.glossary.map(g=>`<div class="glossary-row"><span class="kw">${g.kw}</span><span class="eq">=</span><span class="tr">${g.tr}</span></div>`).join('')}</div><div class="chunk-nav">${mod.sections.map((_,i)=>`<div class="chunk-dot ${i===S.si?'on':''} ${i<S.si?'visited':''}" onclick="goSec(${i})"></div>`).join('')}</div><button class="btn btn-primary" onclick="startQuiz()"><i class="fa-solid fa-brain"></i> Zum Quiz (${sec.questions.length} Fragen)</button>${S.si>0?`<button class="btn btn-secondary" onclick="prevSec()"><i class="fa-solid fa-arrow-left"></i> Zurück</button>`:''}</div>`;}

function rQuiz(){
const mod=MODULES[S.mi];const sec=mod.sections[S.si];const q=sec.questions[S.qi];const total=sec.questions.length;const pct=((S.qi+1)/total)*100;const cc=S.results.filter(r=>r).length;
return `<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()"><i class="fa-solid fa-arrow-left"></i> Text</button><div class="topbar-title">Quiz</div><div class="topbar-right">${S.qi+1}/${total}</div></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><div style="display:flex;align-items:center;justify-content:space-between"><div class="streak"><i class="fa-solid fa-fire" style="color:var(--color-primary)"></i> ${S.streak}</div><div style="font-family:var(--font-mono);font-size:12px;font-weight:700">${cc} von ${S.results.length} richtig</div></div><div class="card-surface"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px"><div class="eyebrow" style="margin:0">Frage ${S.qi+1}</div><div class="kurmanji-badge">${q.kurmanji}</div></div><div class="question-text">${q.q}</div><button class="tts-btn" onclick="speakQ()" style="margin-top:8px"><i class="fa-solid fa-volume-high"></i> Vorlesen</button><div class="ans-grid" id="ans-grid" style="margin-top:12px">${shuf([{t:q.correct,ok:true},...q.wrong.map(w=>({t:w,ok:false}))]).map(a=>`<button class="ans-btn" data-c="${a.ok}" onclick="ans(this,${a.ok})">${a.t}</button>`).join('')}</div><div class="feedback ok" id="fb-ok" style="margin-top:12px"><span style="font-size:18px">✓</span><span>Richtig! ${q.kurmanji}</span></div><div class="feedback ko" id="fb-ko" style="margin-top:12px"><span style="font-size:18px">→</span><span>Richtig: <strong>${q.correct}</strong></span></div><button class="btn btn-primary" id="nq-btn" style="display:none;margin-top:12px" onclick="nextQ()">Nächste Frage <i class="fa-solid fa-arrow-right"></i></button></div></div>`;}

function rParent(){
const sec=MODULES[S.mi].sections[S.si];const key=`${S.mi}-${S.si}`;const saved=S.parentSaved[key]||'';
return `<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="S.screen='read';save();render()"><i class="fa-solid fa-arrow-left"></i> Zurück</button><div class="topbar-title">Elternaufgabe</div><div class="topbar-right"></div></div><div class="parent-task"><div class="pt-icon">🏠</div><div class="pt-label">Zu Hause bearbeiten</div><div class="pt-text">${sec.parentTask}</div></div><div class="parent-answer"><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:6px">Deine Antwort / Notizen:</div><textarea id="parent-input" placeholder="Schreib hier auf, was du herausgefunden hast..." oninput="saveParent()">${saved}</textarea></div><button class="btn btn-green" onclick="finishSec()"><i class="fa-solid fa-check"></i> Antwort gespeichert — weiter</button><button class="btn btn-secondary" onclick="finishSec()"><i class="fa-solid fa-arrow-right"></i> Überspringen</button></div>`;}

function rResult(){
const mod=MODULES[S.mi];const sec=mod.sections[S.si];const total=sec.questions.length;const c=S.results.filter(r=>r).length;const pct=Math.round(c/total*100);const s=Math.min(3,Math.round(c/total*3));const isLast=S.si>=mod.sections.length-1;
return `<div class="screen active fade-in" style="justify-content:center;align-items:center;min-height:80vh"><div class="card" style="text-align:center;padding:36px 24px;max-width:420px"><div class="eyebrow">Abschnitt ${S.si+1}</div><h2 style="margin-bottom:16px;text-transform:none">${sec.title}</h2><div class="result-stars">${[1,2,3].map(i=>`<div class="star ${i<=s?'earned':''}">★</div>`).join('')}</div><div class="score-text">${c}/${total}</div><div class="score-label" style="margin-bottom:8px">${pct}% richtig</div><div style="font-family:var(--font-body);font-size:15px;color:#555;margin-bottom:20px">${c>=total-1?'Sehr gut!':c>=Math.ceil(total/2)?'Gut, weiter so!':'Übe nochmal, du schaffst es!'}</div>${!isLast?`<button class="btn btn-primary" onclick="nextSec()">Nächster Abschnitt <i class="fa-solid fa-arrow-right"></i></button>`:`<button class="btn btn-green" onclick="finishMod()">Modul abschliessen <i class="fa-solid fa-trophy"></i></button>`}<button class="btn btn-secondary" onclick="retrySec()" style="margin-top:4px"><i class="fa-solid fa-rotate-left"></i> Nochmal</button><button class="btn btn-secondary" onclick="go('modules')" style="margin-top:4px"><i class="fa-solid fa-th-large"></i> Übersicht</button></div></div>`;}

function rAllDone(){
let totalC=0,totalQ=0;Object.values(S.visited).forEach(v=>{if(v&&v.done){totalC+=v.correct;totalQ+=v.questions}});const pct=totalQ?Math.round(totalC/totalQ*100):0;
return `<div class="screen active fade-in" style="justify-content:center;align-items:center;min-height:80vh"><div class="card" style="text-align:center;padding:36px 24px;max-width:420px"><div style="font-size:48px;margin-bottom:12px">🏆</div><h2>Alle Module geschafft!</h2><div class="score-text">${totalC}/${totalQ}</div><div class="score-label">${pct}% richtig insgesamt</div><p style="color:#555;margin:12px 0 20px;line-height:1.6;font-family:var(--font-body)">Du hast alle ${MODULES.length} Module durchgearbeitet.</p><button class="btn btn-primary" onclick="resetAll()"><i class="fa-solid fa-rotate-left"></i> Von vorne</button><button class="btn btn-secondary" style="margin-top:4px" onclick="go('modules')"><i class="fa-solid fa-th-large"></i> Module</button></div></div>`;}

function rFulltext(){
let html=`<div class="screen active fade-in"><div class="topbar"><button class="topbar-back" onclick="go('start')"><i class="fa-solid fa-arrow-left"></i> Start</button><div class="topbar-title">Gesamttext</div><div class="topbar-right"></div></div><h1 style="font-size:24px">Die Kurden im Mittelalter</h1><p style="color:#555;font-size:15px;margin-bottom:16px;font-weight:600">Der vollständige Text aller ${MODULES.length} Module zum Durchlesen. ${MODULES.reduce((a,m)=>a+m.sections.length,0)} Abschnitte.</p>`;
MODULES.forEach((mod,mi)=>{const cls=mi===0?'':'mod-2';
html+=`<div class="fulltext-mod ${cls}"><h2 style="font-size:18px;margin-bottom:12px">Modul ${mi+1}: ${mod.title}</h2>`;
mod.sections.forEach((sec,si)=>{html+=`<div style="margin-bottom:24px${si<mod.sections.length-1?';padding-bottom:24px;border-bottom:2px dashed #ddd':''}"><h3 style="font-size:15px;margin-bottom:8px;text-transform:none;letter-spacing:0">${sec.title}</h3><div class="read-text" style="font-size:17px;margin-bottom:8px">${sec.text}</div><button class="tts-btn" onclick="speakFullSec(${mi},${si})"><i class="fa-solid fa-volume-high"></i> Vorlesen</button><div class="glossary" style="margin-top:8px"><div class="glossary-label">Kurmanji</div>${sec.glossary.map(g=>`<div class="glossary-row"><span class="kw">${g.kw}</span><span class="eq">=</span><span class="tr">${g.tr}</span></div>`).join('')}</div></div>`;});
html+=`</div>`;});
html+=`<button class="btn btn-primary" onclick="go('modules')"><i class="fa-solid fa-brain"></i> Zu den Modulen & Quiz</button><button class="btn btn-secondary" onclick="go('start')" style="margin-top:4px"><i class="fa-solid fa-arrow-left"></i> Zurück zum Start</button></div>`;
return html;}

function go(s){S.screen=s;S.answered=false;save();render()}
function startMod(i){S.mi=i;S.si=0;S.screen='read';save();render()}
function nextSec(){S.si++;S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function prevSec(){S.si=Math.max(0,S.si-1);S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function goSec(i){S.si=i;S.screen='read';S.qi=0;S.results=[];S.answered=false;save();render()}
function startQuiz(){S.qi=0;S.streak=0;S.results=[];S.answered=false;S.screen='quiz';save();render()}
function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function ans(btn,ok){
if(S.answered)return;S.answered=true;
const btns=document.querySelectorAll('#ans-grid .ans-btn');btns.forEach(b=>b.disabled=true);
if(ok){btn.classList.add('correct');S.streak++;S.results.push(true);document.getElementById('fb-ok').classList.add('show');playAudio('audio/richtig.mp3')}
else{btn.classList.add('wrong');S.streak=0;S.results.push(false);btns.forEach(b=>{if(b.dataset.c==='true')b.classList.add('revealed')});document.getElementById('fb-ko').classList.add('show');playAudio('audio/leider-falsch.mp3');}
document.getElementById('nq-btn').style.display='flex';save();}

function nextQ(){const sec=MODULES[S.mi].sections[S.si];S.qi++;S.answered=false;if(S.qi>=sec.questions.length){S.screen='parent'}save();render()}

function finishSec(){
const sec=MODULES[S.mi].sections[S.si];const total=sec.questions.length;const c=S.results.filter(r=>r).length;
if(!S.visited[S.mi])S.visited[S.mi]={};S.visited[S.mi][S.si]={correct:c,total:total};
S.screen='result';S.answered=false;save();render()}

function retrySec(){S.screen='read';S.qi=0;S.results=[];S.answered=false;startQuiz()}

function finishMod(){
const mod=MODULES[S.mi];let modCorrect=0,modTotal=0;
mod.sections.forEach((sec,si)=>{const total=sec.questions.length;modTotal+=total;if(S.visited[S.mi]&&S.visited[S.mi][si]){modCorrect+=S.visited[S.mi][si].correct}});
if(!S.visited)S.visited={};S.visited[mod.id]={done:true,correct:modCorrect,questions:modTotal};
const allDone=MODULES.every(m=>S.visited&&S.visited[m.id]&&S.visited[m.id].done);
if(allDone){S.screen='allDone'}else{S.mi=S.mi<MODULES.length-1?S.mi+1:0;S.si=0;S.screen='modules'}save();render()}

function saveParent(){const key=`${S.mi}-${S.si}`;const ta=document.getElementById('parent-input');if(ta){S.parentSaved[key]=ta.value;save()}}

let _audio=null;
function playAudio(src){
  if(_audio){_audio.pause();_audio=null}
  _audio=new Audio(src);_audio.play().catch(()=>{});
  document.querySelectorAll('.tts-btn').forEach(b=>b.classList.add('speaking'));
  _audio.onended=()=>{document.querySelectorAll('.tts-btn').forEach(b=>b.classList.remove('speaking'));_audio=null};
  _audio.onerror=()=>{document.querySelectorAll('.tts-btn').forEach(b=>b.classList.remove('speaking'));_audio=null};
}
function secIdx(){let idx=0;for(let i=0;i<S.mi;i++)idx+=MODULES[i].sections.length;return idx+S.si}
function speakText(){playAudio('audio/v5-sec'+String(secIdx()).padStart(2,'0')+'.mp3')}
function speakQ(){playAudio('audio/v5-sec'+String(secIdx()).padStart(2,'0')+'.mp3')}
function speakFullSec(mi,si){let idx=0;for(let i=0;i<mi;i++)idx+=MODULES[i].sections.length;playAudio('audio/v5-sec'+String(idx+si).padStart(2,'0')+'.mp3')}
function speak(text){/* fallback: replaced by pre-generated audio */}

load();render();
</script>
</body>
</html>
