<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1x1 Zeit-Trainer — Lernlust</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary:   #FF6B6B;
      --secondary: #4ECDC4;
      --accent:    #FFE66D;
      --success:   #95E1A3;
      --danger:    #FF8B94;
      --purple:    #C3A6FF;
      --bg-light:  #FFF9F0;
      --bg-card:   #FFFFFF;
      --text-dark: #2D3436;
      --text-muted:#636E72;
      --shadow:       0 8px 32px rgba(0,0,0,0.10);
      --shadow-hover: 0 12px 48px rgba(0,0,0,0.15);
      --radius:    24px;
      --radius-sm: 16px;
      --radius-xs: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 60px;
      position: relative;
      overflow-x: hidden;
    }
    .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .bg-shape {
      position: absolute; border-radius: 50%;
      animation: float 18s ease-in-out infinite;
    }
    .bg-shape:nth-child(1) {
      width: 400px; height: 400px; top: -100px; right: -80px;
      background: radial-gradient(circle, rgba(255,107,107,0.15), transparent 70%);
    }
    .bg-shape:nth-child(2) {
      width: 350px; height: 350px; bottom: 10%; left: -100px;
      background: radial-gradient(circle, rgba(78,205,196,0.15), transparent 70%);
      animation-delay: -7s;
    }
    .bg-shape:nth-child(3) {
      width: 300px; height: 300px; top: 40%; right: 10%;
      background: radial-gradient(circle, rgba(255,230,109,0.18), transparent 70%);
      animation-delay: -13s;
    }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(20px,-25px) scale(1.04); }
      66%      { transform: translate(-15px,15px) scale(0.97); }
    }
    .container {
      width: 100%; max-width: 480px;
      position: relative; z-index: 1;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* Header */
    .header { text-align: center; padding: 16px 0 4px; }
    .header h1 {
      font-family: 'Fredoka', cursive; font-size: 2rem;
      font-weight: 700; color: var(--text-dark); margin-bottom: 2px;
    }
    .header h1 .fa-solid { color: var(--primary); margin-right: 8px; }
    .header .subtitle { font-size: 0.85rem; color: var(--text-muted); }

    /* Timer bar */
    .timer-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 16px; background: var(--bg-card);
      padding: 12px 20px; border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }
    .timer-display {
      font-family: 'Fredoka', cursive; font-size: 2rem;
      font-weight: 700; color: var(--primary);
      min-width: 100px; text-align: center;
    }
    .timer-label { font-size: 0.82rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .best-display {
      font-family: 'Nunito', sans-serif; font-size: 0.9rem;
      color: var(--secondary); font-weight: 700;
    }
    .best-display .fa-solid { margin-right: 4px; }

    /* Card */
    .card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 28px 24px; box-shadow: var(--shadow);
    }

    /* Progress */
    .progress-bar {
      background: #e9ecef; border-radius: 50px; height: 10px; overflow: hidden; margin-bottom: 6px;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 50px; transition: width 0.5s ease;
    }
    .progress-text {
      text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; font-weight: 600;
    }

    /* Mode switch */
    .mode-switch {
      display: flex; gap: 10px; margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1; padding: 12px 8px;
      font-family: 'Fredoka', cursive; font-size: 1.1rem; font-weight: 600;
      border: 3px solid #e9ecef; border-radius: var(--radius-xs);
      background: #f8f9fa; color: var(--text-muted);
      cursor: pointer; transition: all 0.2s; text-align: center;
    }
    .mode-btn:hover { border-color: var(--secondary); }
    .mode-btn.active-mal {
      border-color: var(--primary); background: var(--primary); color: white;
      box-shadow: 0 4px 12px rgba(255,107,107,0.35);
    }
    .mode-btn.active-durch {
      border-color: var(--secondary); background: var(--secondary); color: white;
      box-shadow: 0 4px 12px rgba(78,205,196,0.35);
    }

    /* Reihe select */
    .reihe-select {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px;
    }
    .reihe-btn {
      padding: 10px 4px; font-size: 1rem; font-weight: 700;
      border: 2px solid #e9ecef; border-radius: var(--radius-xs);
      background: #f8f9fa; color: var(--text-dark); cursor: pointer; transition: all 0.2s;
      text-align: center;
    }
    .reihe-btn:hover { border-color: var(--secondary); }
    .reihe-btn.selected {
      background: var(--secondary); border-color: var(--secondary); color: white;
    }
    .reihe-mix {
      grid-column: span 5; font-size: 0.95rem;
    }
    .reihe-mix.selected { background: var(--accent); border-color: var(--accent); color: var(--text-dark); }

    /* Start button */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; padding: 14px 28px; border-radius: 50px; border: none;
      cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 800;
      font-size: 1rem; transition: all 0.2s; width: 100%;
    }
    .btn-primary {
      background: var(--primary); color: white;
      box-shadow: 0 4px 16px rgba(255,107,107,0.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(255,107,107,0.5); }

    /* Flashcard */
    .flashcard-container { perspective: 1000px; margin: 16px 0; }
    .flashcard {
      background: linear-gradient(135deg, #fff8f0, #fff);
      border: 3px solid #f0e6d6;
      border-radius: 20px; height: 180px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka', cursive; font-size: 3.2rem; font-weight: 700;
      color: var(--text-dark); transition: all 0.3s; cursor: pointer;
      position: relative; user-select: none;
    }
    .flashcard:hover { transform: scale(1.02); box-shadow: var(--shadow-hover); }
    .flashcard.revealed {
      background: linear-gradient(135deg, var(--success), rgba(149,225,163,0.6));
      border-color: var(--success);
    }
    .flashcard .answer { color: white; }
    .flashcard-tap-hint {
      position: absolute; bottom: 12px; font-size: 0.75rem;
      color: var(--text-muted); font-family: 'Nunito', sans-serif; font-weight: 600;
    }

    /* Self-assessment buttons */
    .assess-row { display: flex; gap: 10px; }
    .assess-btn {
      flex: 1; padding: 14px 8px;
      font-family: 'Fredoka', cursive; font-size: 1.1rem; font-weight: 600;
      border: none; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s;
    }
    .assess-btn:active { transform: scale(0.97); }
    .btn-knew {
      background: var(--success); color: #1a5c2a;
      box-shadow: 0 4px 12px rgba(149,225,163,0.4);
    }
    .btn-knew:hover { transform: translateY(-2px); }
    .btn-didnt {
      background: var(--danger); color: #8b0000;
      box-shadow: 0 4px 12px rgba(255,139,148,0.4);
    }
    .btn-didnt:hover { transform: translateY(-2px); }
    .assess-prompt {
      text-align: center; color: var(--text-muted); font-size: 0.9rem;
      font-weight: 700; margin-bottom: 10px;
    }

    /* Done screen */
    .done { text-align: center; padding: 16px 0; }
    .done-icon { font-size: 3.5rem; margin-bottom: 12px; color: var(--accent); }
    .done-icon .fa-solid { color: var(--accent); }
    .done-title {
      font-family: 'Fredoka', cursive; font-size: 2.2rem;
      color: var(--text-dark); margin-bottom: 4px;
    }
    .done-sub { color: var(--text-muted); margin-bottom: 20px; }
    .time-big {
      font-family: 'Fredoka', cursive; font-size: 3rem;
      color: var(--primary); margin-bottom: 4px;
    }
    .time-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .stats-row {
      display: flex; justify-content: center; gap: 24px; margin: 20px 0;
    }
    .stat { text-align: center; }
    .stat-val { font-size: 1.6rem; font-weight: 700; }
    .stat-val.green { color: var(--success); }
    .stat-val.red { color: var(--danger); }
    .stat-val.best { color: var(--secondary); }
    .stat-lbl { font-size: 0.8rem; color: var(--text-muted); }

    /* Screens */
    .screen { display: none; }
    .screen.active { display: block; }

    /* Responsive */
    @media (max-width: 400px) {
      .flashcard { font-size: 2.4rem; height: 150px; }
      .timer-display { font-size: 1.6rem; }
      .reihe-btn { font-size: 0.9rem; padding: 8px 2px; }
    }
  </style>
</head>
<body>
  <div class="bg-shapes">
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
    <div class="bg-shape"></div>
  </div>

  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-stopwatch"></i> 1x1 Zeit-Trainer</h1>
      <div class="subtitle">Malnehmen und Teilen — mit Stoppuhr</div>
    </div>

    <div class="card">
      <!-- ===== START SCREEN ===== -->
      <div class="screen active" id="screenStart">
        <h2 style="font-family:'Fredoka',cursive;font-size:1.4rem;text-align:center;margin-bottom:12px;color:var(--text-dark);">Wie willst du ueben?</h2>

        <div class="mode-switch">
          <button class="mode-btn active-mal" id="modeMal" data-mode="mal"><i class="fa-solid fa-xmark"></i> Malnehmen</button>
          <button class="mode-btn" id="modeDurch" data-mode="durch"><i class="fa-solid fa-divide"></i> Teilen</button>
        </div>

        <h3 style="font-size:0.9rem;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Welche Reihe?</h3>
        <div class="reihe-select" id="reiheSelect">
          <button class="reihe-btn selected" data-reihe="0">Alle</button>
          <button class="reihe-btn" data-reihe="1">1er</button>
          <button class="reihe-btn" data-reihe="2">2er</button>
          <button class="reihe-btn" data-reihe="3">3er</button>
          <button class="reihe-btn" data-reihe="4">4er</button>
          <button class="reihe-btn" data-reihe="5">5er</button>
          <button class="reihe-btn" data-reihe="6">6er</button>
          <button class="reihe-btn" data-reihe="7">7er</button>
          <button class="reihe-btn" data-reihe="8">8er</button>
          <button class="reihe-btn" data-reihe="9">9er</button>
          <button class="reihe-btn" data-reihe="10">10er</button>
        </div>

        <button class="btn btn-primary" id="btnStart"><i class="fa-solid fa-play"></i> Los gehts!</button>
      </div>

      <!-- ===== GAME SCREEN ===== -->
      <div class="screen" id="screenGame">
        <div class="progress-bar"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
        <div class="progress-text" id="progressText">Karte 1 von 10</div>

        <div class="flashcard-container">
          <div class="flashcard" id="flashcard">
            <span id="cardContent">3 x 4</span>
            <div class="flashcard-tap-hint" id="cardHint">Tippe zum Umdrehen</div>
          </div>
        </div>

        <div id="preReveal">
          <button class="btn btn-primary" id="btnReveal" style="background:var(--secondary);box-shadow:0 4px 16px rgba(78,205,196,0.4);"><i class="fa-solid fa-eye"></i> Loesung zeigen</button>
        </div>

        <div id="postReveal" style="display:none;">
          <div class="assess-prompt">Wusstest du es sofort?</div>
          <div class="assess-row">
            <button class="assess-btn btn-knew" id="btnKnew"><i class="fa-solid fa-check"></i> Ja!</button>
            <button class="assess-btn btn-didnt" id="btnDidnt"><i class="fa-solid fa-xmark"></i> Nein</button>
          </div>
        </div>
      </div>

      <!-- ===== DONE SCREEN ===== -->
      <div class="screen" id="screenDone">
        <div class="done">
          <div class="done-icon"><i class="fa-solid fa-trophy"></i></div>
          <div class="done-title">Geschafft!</div>
          <div class="done-sub" id="doneSub">Super gemacht!</div>

          <div class="time-label">Deine Zeit</div>
          <div class="time-big" id="timeResult">0:42</div>

          <div class="stats-row">
            <div class="stat">
              <div class="stat-val green" id="knewCount">8</div>
              <div class="stat-lbl">Gewusst</div>
            </div>
            <div class="stat">
              <div class="stat-val red" id="didntCount">2</div>
              <div class="stat-lbl">Ueben</div>
            </div>
            <div class="stat">
              <div class="stat-val best" id="bestTime">--</div>
              <div class="stat-lbl">Bestzeit</div>
            </div>
          </div>

          <button class="btn btn-primary" id="btnAgain"><i class="fa-solid fa-rotate-right"></i> Nochmal ueben</button>
        </div>
      </div>
    </div>

    <!-- Timer always visible -->
    <div class="timer-bar" id="timerBar" style="display:none;">
      <div style="text-align:center;">
        <div class="timer-label">Zeit</div>
        <div class="timer-display" id="timerDisplay">0:00</div>
      </div>
      <div style="text-align:center;">
        <div class="timer-label"><i class="fa-solid fa-star"></i> Bestzeit</div>
        <div class="best-display" id="bestDisplay">--</div>
      </div>
      <div style="text-align:center;">
        <div class="timer-label"><i class="fa-solid fa-check"></i> Richtig</div>
        <div class="best-display" id="knewDisplay" style="color:var(--success);">0</div>
      </div>
    </div>
  </div>

  <script>
    // === STATE ===
    var state = {
      mode: 'mal',       // 'mal' or 'durch'
      reihe: 0,          // 0 = alle gemischt, 1-10 = feste Reihe
      cards: [],
      current: 0,
      knew: 0,
      didnt: 0,
      total: 10,
      revealed: false,
      timerStart: null,
      timerInterval: null,
      elapsed: 0         // seconds
    };

    // === STORAGE ===
    function getBestKey() {
      var m = state.mode === 'mal' ? 'mal' : 'durch';
      var r = state.reihe === 0 ? 'alle' : state.reihe + 'er';
      return 'zeit_trainer_best_' + m + '_' + r;
    }

    function loadBest() {
      try {
        var val = localStorage.getItem(getBestKey());
        return val ? parseFloat(val) : null;
      } catch(e) { return null; }
    }

    function saveBest(seconds) {
      try { localStorage.setItem(getBestKey(), seconds.toString()); } catch(e) {}
    }

    function formatTime(sec) {
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    // === TIMER ===
    function startTimer() {
      state.timerStart = Date.now();
      state.elapsed = 0;
      updateTimerDisplay();
      state.timerInterval = setInterval(function() {
        state.elapsed = Math.floor((Date.now() - state.timerStart) / 1000);
        updateTimerDisplay();
      }, 500);
    }

    function stopTimer() {
      if (state.timerInterval) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
      }
      state.elapsed = Math.floor((Date.now() - state.timerStart) / 1000);
    }

    function updateTimerDisplay() {
      document.getElementById('timerDisplay').textContent = formatTime(state.elapsed);
    }

    // === SCREENS ===
    function showScreen(id) {
      var screens = document.querySelectorAll('.screen');
      for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
      document.getElementById(id).classList.add('active');
    }

    // === SHUFFLE ===
    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    // === GENERATE CARDS ===
    function generateCards() {
      var pool = [];

      if (state.mode === 'durch') {
        if (state.reihe === 0) {
          // Alle gemischt: beliebige Divisionsaufgaben
          for (var i = 1; i <= 10; i++) {
            for (var j = 1; j <= 10; j++) {
              pool.push({ question: (i * j) + ' \u00F7 ' + i, answer: j });
            }
          }
        } else {
          // Feste Reihe: z.B. 3er-Reihe Durch = 3\xF73=1, 6\xF73=2, ...
          for (var k = 1; k <= 10; k++) {
            pool.push({ question: (state.reihe * k) + ' \u00F7 ' + state.reihe, answer: k });
          }
        }
      } else {
        // Malnehmen
        if (state.reihe === 0) {
          for (var m = 1; m <= 10; m++) {
            for (var n = 1; n <= 10; n++) {
              pool.push({ question: m + ' \u00D7 ' + n, answer: m * n });
            }
          }
        } else {
          for (var p = 1; p <= 10; p++) {
            pool.push({ question: state.reihe + ' \u00D7 ' + p, answer: state.reihe * p });
          }
        }
      }

      pool = shuffle(pool);

      // If fewer than total, repeat
      state.cards = [];
      while (state.cards.length < state.total) {
        state.cards = state.cards.concat(pool.slice(0));
      }
      state.cards = state.cards.slice(0, state.total);
    }

    // === START GAME ===
    function startGame() {
      generateCards();
      state.current = 0;
      state.knew = 0;
      state.didnt = 0;
      state.revealed = false;

      // Show timer bar
      document.getElementById('timerBar').style.display = 'flex';
      var best = loadBest();
      document.getElementById('bestDisplay').textContent = best ? formatTime(best) : '--';
      document.getElementById('knewDisplay').textContent = '0';

      showScreen('screenGame');
      showCard();
      startTimer();
    }

    // === SHOW CARD ===
    function showCard() {
      var card = state.cards[state.current];
      state.revealed = false;

      // Progress
      var pct = (state.current / state.total) * 100;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressText').textContent = 'Karte ' + (state.current + 1) + ' von ' + state.total;

      // Flashcard front
      var fc = document.getElementById('flashcard');
      fc.classList.remove('revealed');
      document.getElementById('cardContent').innerHTML = card.question;
      document.getElementById('cardHint').style.display = 'block';

      // Show reveal, hide assess
      document.getElementById('preReveal').style.display = 'block';
      document.getElementById('postReveal').style.display = 'none';
    }

    // === REVEAL CARD ===
    function revealCard() {
      if (state.revealed) return;
      var card = state.cards[state.current];
      state.revealed = true;

      var fc = document.getElementById('flashcard');
      fc.classList.add('revealed');
      document.getElementById('cardContent').innerHTML = card.question + ' = <span class="answer">' + card.answer + '</span>';
      document.getElementById('cardHint').style.display = 'none';

      document.getElementById('preReveal').style.display = 'none';
      document.getElementById('postReveal').style.display = 'block';
    }

    // === RATE CARD ===
    function rateCard(knew) {
      var card = state.cards[state.current];
      if (knew) {
        state.knew++;
      } else {
        state.didnt++;
        // Add card back for repetition
        state.cards.push(card);
        state.total = state.cards.length;
      }

      document.getElementById('knewDisplay').textContent = state.knew;
      state.current++;

      if (state.current < state.total) {
        showCard();
      } else {
        showDone();
      }
    }

    // === SHOW DONE ===
    function showDone() {
      stopTimer();

      // Save best time
      var best = loadBest();
      var isNewBest = false;
      if (!best || state.elapsed < best) {
        saveBest(state.elapsed);
        isNewBest = true;
        best = state.elapsed;
      }

      // Progress bar full
      document.getElementById('progressBar').style.width = '100%';

      // Fill done screen
      var pct = state.total > 0 ? Math.round((state.knew / state.total) * 100) : 0;
      var msg = '';
      if (pct === 100) msg = 'Perfekt! Alles im Kopf!';
      else if (pct >= 80) msg = 'Super! Fast alles gewusst!';
      else if (pct >= 60) msg = 'Gut! Weiter ueben!';
      else msg = 'Uebung macht den Meister!';

      document.getElementById('doneSub').textContent = msg;
      document.getElementById('timeResult').textContent = formatTime(state.elapsed);
      document.getElementById('knewCount').textContent = state.knew;
      document.getElementById('didntCount').textContent = state.didnt;
      document.getElementById('bestTime').textContent = formatTime(best) + (isNewBest ? ' \u2605' : '');

      showScreen('screenDone');
    }

    // === MODE SWITCH ===
    document.getElementById('modeMal').addEventListener('click', function() {
      state.mode = 'mal';
      this.className = 'mode-btn active-mal';
      document.getElementById('modeDurch').className = 'mode-btn';
    });
    document.getElementById('modeDurch').addEventListener('click', function() {
      state.mode = 'durch';
      this.className = 'mode-btn active-durch';
      document.getElementById('modeMal').className = 'mode-btn';
    });

    // === REIHE SELECT ===
    document.getElementById('reiheSelect').addEventListener('click', function(e) {
      var btn = e.target.closest('.reihe-btn');
      if (!btn) return;
      var btns = document.querySelectorAll('.reihe-btn');
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove('selected');
      btn.classList.add('selected');
      state.reihe = parseInt(btn.getAttribute('data-reihe'));
    });

    // === BUTTONS ===
    document.getElementById('btnStart').addEventListener('click', startGame);
    document.getElementById('btnReveal').addEventListener('click', revealCard);
    document.getElementById('btnKnew').addEventListener('click', function() { rateCard(true); });
    document.getElementById('btnDidnt').addEventListener('click', function() { rateCard(false); });
    document.getElementById('btnAgain').addEventListener('click', function() {
      document.getElementById('timerBar').style.display = 'none';
      showScreen('screenStart');
    });

    // Click flashcard to reveal
    document.getElementById('flashcard').addEventListener('click', function() {
      if (!state.revealed) revealCard();
    });
  </script>
</body>
</html>
